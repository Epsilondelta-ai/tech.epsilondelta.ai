<svg xmlns="http://www.w3.org/2000/svg" width="800" height="770" viewBox="0 0 800 770"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8" fill="#237780"/></marker></defs><rect width="800" height="770" fill="#f7f5ee"/><g font-family="Noto Sans CJK KR, sans-serif"><text x="32" y="53" font-size="36" fill="#193d43" font-weight="700">한 과제부터 시작해 연결하기</text><rect x="36" y="97" width="326" height="160" rx="18" fill="white" stroke="#c9d8d5" stroke-width="2"/><text x="60" y="153" font-size="32" fill="#237780" font-weight="700">과제 하나 선택</text><text x="60" y="207" font-size="29" fill="#193d43" font-weight="400">지금 막힌 판단</text><rect x="438" y="97" width="326" height="160" rx="18" fill="white" stroke="#c9d8d5" stroke-width="2"/><text x="462" y="153" font-size="32" fill="#237780" font-weight="700">가상 시험</text><text x="462" y="207" font-size="29" fill="#193d43" font-weight="400">후보를 좁히기</text><rect x="438" y="356" width="326" height="160" rx="18" fill="white" stroke="#c9d8d5" stroke-width="2"/><text x="462" y="412" font-size="32" fill="#237780" font-weight="700">실물 비교</text><text x="462" y="466" font-size="29" fill="#193d43" font-weight="400">같은 과제·지표</text><rect x="36" y="356" width="326" height="160" rx="18" fill="white" stroke="#c9d8d5" stroke-width="2"/><text x="60" y="412" font-size="32" fill="#237780" font-weight="700">제한된 운영</text><text x="60" y="466" font-size="29" fill="#193d43" font-weight="400">개입·복구 기록</text><path d="M371 176 L426 176" fill="none" stroke="#237780" stroke-width="4" marker-end="url(#arrow)"/><path d="M600 270 L600 341" fill="none" stroke="#237780" stroke-width="4" marker-end="url(#arrow)"/><path d="M426 435 L375 435" fill="none" stroke="#237780" stroke-width="4" marker-end="url(#arrow)"/><path d="M199 530 L199 601 L600 601 L600 530" fill="none" stroke="#237780" stroke-width="4" marker-end="url(#arrow)"/><text x="269" y="644" font-size="29" fill="#193d43" font-weight="400">변경·실패를