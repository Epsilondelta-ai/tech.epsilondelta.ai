<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-labelledby="title desc"><title id="title">결과 상태와 후속 조치를 나눕니다</title><desc id="desc">가상 사례에서 원문 미기재는 정상 결과 null이다. 신품인지 리퍼인지 불명확하면 판단 보류한다. 보류나 고위험 결과는 상위 검토로 보내며 재검증하거나 추가 정보와 사람의 기준을 요청한다.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#547b77"/></marker></defs><rect width="800" height="500" rx="20" fill="#faf6ed"/><g font-family="Noto Sans CJK KR, sans-serif"><text x="36" y="52" font-size="32" fill="#193d42" text-anchor="start">결과 상태와 후속 조치를 나눕니다</text><text x="40" y="94" font-size="24" fill="#193d42" text-anchor="start">가상 예시</text><rect x="40" y="114" width="340" height="113" rx="18" fill="#dcebe7"/><text x="64" y="156" font-size="28" fill="#193d42" text-anchor="start">원문에 보증 언급 없음</text><text x="64" y="194" font-size="28" fill="#193d42" text-anchor="start">값 없음(null) · 정상</text><rect x="420" y="114" width="340" height="113" rx="18" fill="#f2e5c4"/><text x="444" y="156" font-size="28" fill="#193d42" text-anchor="start">신품 / 리퍼 여부 불명</text><text x="444" y="194" font-size="28" fill="#193d42" text-anchor="start">판단 보류 · 확정 안 함</text><path d="M590 232 L590 270" stroke="#547b77" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="40" y="280" width="720" height="85" rx="18" fill="#dcebe7"/><text x="64" y="322" font-size="28" fill="#193d42" text-anchor="start">보류 또는 고위험 → 상위 검토</text><path d="M400 370 L400 405" stroke="#547b77" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="400" y="445" font-size="28" fill="#193d42" text-anchor="middle">재검증 / 정보 요청 / 사람의 기준 결정</text></g></svg>