<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-labelledby="title desc"><title id="title">대표 시험지와 두 가지 합격 기준</title><desc id="desc">학습, 조정, 최종 시험 데이터를 분리한다. 최종 시험에는 정상, 희귀, 부정문, 누락, 새 양식과 범위 밖 문서를 포함한다. 자동 처리율과 자동 수용 결과 안의 오류율을 함께 판단한다. 수치 결과를 제시하지 않는다.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#547b77"/></marker></defs><rect width="800" height="500" rx="20" fill="#faf6ed"/><g font-family="Noto Sans CJK KR, sans-serif"><text x="36" y="52" font-size="32" fill="#193d42" text-anchor="start">대표 시험지와 두 가지 합격 기준</text><rect x="40" y="90" width="225" height="75" rx="18" fill="#dcebe7"/><text x="64" y="132" font-size="28" fill="#193d42" text-anchor="start">학습 데이터</text><rect x="285" y="90" width="230" height="75" rx="18" fill="#dcebe7"/><text x="309" y="132" font-size="28" fill="#193d42" text-anchor="start">조정 데이터</text><rect x="535" y="90" width="225" height="75" rx="18" fill="#dcebe7"/><text x="559" y="132" font-size="28" fill="#193d42" text-anchor="start">최종 시험</text><text x="400" y="206" font-size="26" fill="#193d42" text-anchor="middle">서로 분리 · 시험 문서 재사용 금지</text><rect x="40" y="235" width="720" height="112" rx="18" fill="#dcebe7"/><text x="64" y="277" font-size="28" fill="#193d42" text-anchor="start">정상 · 희귀 · 부정문</text><text x="64" y="315" font-size="28" fill="#193d42" text-anchor="start">누락 · 새 양식 · 범위 밖</text><rect x="40" y="380" width="340" height="85" rx="18" fill="#dcebe7"/><text x="64" y="422" font-size="28" fill="#193d42" text-anchor="start">자동 처리율</text><rect x="420" y="380" width="340" height="85" rx="18" fill="#f2e5c4"/><text x="444" y="422" font-size="28" fill="#193d42" text-anchor="start">수용 결과 내 오류율</text></g></svg>