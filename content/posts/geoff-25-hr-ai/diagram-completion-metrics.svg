<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="title desc"><title id="title">챗봇이 답한 시점과 직원의 일이 끝난 시점을 나눕니다</title><desc id="desc">질문, 챗봇 답변, 재문의와 담당자 처리, 결과 수령에 이르는 정성적 흐름. 실제 시간이나 개선 수치를 나타내지 않는다.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#297C75"/></marker></defs><rect width="800" height="450" rx="18" fill="#FAF8F2"/><g font-family="Apple SD Gothic Neo,Noto Sans KR,sans-serif"><text x="30" y="44" font-size="26" fill="#183D40" font-weight="700">챗봇이 답한 시점과 직원의 일이 끝난 시점을 나눕니다</text><text x="30" y="82" font-size="18" fill="#61746F" font-weight="400">어디까지 걸린 시간을 측정하고 있나요?</text><rect x="30" y="110" width="170" height="62" rx="12" fill="white" stroke="#D9E4DF"/><text x="46" y="149" font-size="21" fill="#183D40" font-weight="700">첫 질문</text><path d="M203 141 L211 141" stroke="#297C75" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="215" y="110" width="170" height="62" rx="12" fill="#FBE9DF" stroke="#D9E4DF"/><text x="231" y="149" font-size="21" fill="#183D40" font-weight="700">챗봇 답변</text><path d="M388 141 L396 141" stroke="#297C75" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="400" y="110" width="170" height="62" rx="12" fill="white" stroke="#D9E4DF"/><text x="416" y="149" font-size="21" fill="#183D40" font-weight="700">재문의·처리</text><path d="M573 141 L581 141" stroke="#297C75" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="585" y="110" width="170" height="62" rx="12" fill="#EDF4EE" stroke="#D9E4DF"/><text x="601" y="149" font-size="21" fill="#183D40" font-weight="700">결과 수령</text><path d="M46 185V207H371V185" stroke="#C2634C" stroke-width="2" fill="none"/><text x="85" y="236" font-size="19" fill="#C2634C" font-weight="700">여기까지가 응답 시간</text><path d="M46 250V273H742V250" stroke="#297C75" stroke-width="2" fill="none"/><text x="160" y="304" font-size="21" fill="#297C75" font-weight="700">직원이 필요한 결과를 얻기까지의 전체 시간</text><rect x="30" y="340" width="740" height="66" rx="12" fill="#FFFFFF" stroke="#D9E4DF"/><text x="50" y="368" font-size="19" fill="#183D40" font-weight="700">함께 볼 지표</text><text x="50" y="394" font-size="20" fill="#183D40" font-weight="400">실제 완료 · 재문의 · 담당자 수정 시간 · 인계 품질</text><text x="30" y="434" font-size="14" fill="#61746F" font-weight="400">측정 범위를 설명한 개념도 · 선 길이는 실제 소요 시간을 나타내지 않음</text></g></svg>
