<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="title desc"><title id="title">Cemex에서는 복지 안내가 신청 접수로 이어집니다</title><desc id="desc">직원이 Teams에서 복지 규정을 확인하고 양식과 영수증을 제출하면 ServiceNow 접수번호를 받아 진행 상태를 확인한다.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#297C75"/></marker></defs><rect width="800" height="450" rx="18" fill="#FAF8F2"/><g font-family="Apple SD Gothic Neo,Noto Sans KR,sans-serif"><text x="30" y="44" font-size="26" fill="#183D40" font-weight="700">Cemex에서는 복지 안내가 신청 접수로 이어집니다</text><text x="30" y="78" font-size="16" fill="#61746F" font-weight="400">공개 도입 사례 · 안경 구입비 지원 요청 흐름</text><rect x="30" y="101" width="220" height="145" rx="12" fill="#FFFFFF" stroke="#D9E4DF"/><text x="49" y="136" font-size="21" fill="#183D40" font-weight="700">01  규정 질문</text><text x="49" y="172" font-size="18" fill="#183D40" font-weight="400">Teams에서 지원 문의</text><text x="49" y="203" font-size="18" fill="#183D40" font-weight="400">SharePoint 근거 검색</text><text x="49" y="229" font-size="17" fill="#183D40" font-weight="400">Copilot Studio가 안내</text><path d="M256 172 L280 172" stroke="#297C75" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="290" y="101" width="220" height="145" rx="12" fill="#EDF4EE" stroke="#D9E4DF"/><text x="309" y="136" font-size="21" fill="#183D40" font-weight="700">02  신청 제출</text><text x="309" y="172" font-size="18" fill="#183D40" font-weight="400">대화 속 입력 양식</text><text x="309" y="203" font-size="18" fill="#183D40" font-weight="400">필요한 정보 작성</text><text x="309" y="229" font-size="17" fill="#183D40" font-weight="400">영수증 업로드</text><path d="M516 172 L540 172" stroke="#297C75" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="550" y="101" width="220" height="145" rx="12" fill="#FFFFFF" stroke="#D9E4DF"/><text x="569" y="136" font-size="21" fill="#183D40" font-weight="700">03  요청 접수</text><text x="569" y="172" font-size="18" fill="#183D40" font-weight="400">ServiceNow에 등록</text><text x="569" y="203" font-size="18" fill="#183D40" font-weight="400">접수번호 전달</text><text x="569" y="229" font-size="17" fill="#183D40" font-weight="400">처리 상태 확인</text><rect x="30" y="283" width="740" height="101" rx="12" fill="#FBE9DF" stroke="#D9E4DF"/><text x="51" y="319" font-size="23" fill="#183D40" font-weight="700">접수번호를 받으면, 신청을 추적할 수 있습니다.</text><text x="51" y="356" font-size="19" fill="#183D40" font-weight="400">신청 접수와 복지비 지급 완료는 서로 다른 상태입니다.</text><text x="30" y="423" font-size="15" fill="#61746F" font-weight="400">출처: Microsoft의 Cemex Consult HR 고객 사례</text></g></svg>
