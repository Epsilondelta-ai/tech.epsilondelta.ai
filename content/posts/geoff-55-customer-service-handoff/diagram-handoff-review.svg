<text x="111" y="371" fill="#17372f" font-family="Noto Sans CJK KR, Noto Sans KR, Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="34" font-weight="700" text-anchor="start">필수 본인 확인을 뺀 반복 설명</text>
