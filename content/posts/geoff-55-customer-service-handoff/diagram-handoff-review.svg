<text x="111" y="175" fill="#17372f" font-family="Noto Sans CJK KR, Noto Sans KR, Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="34" font-weight="700" text-anchor="start">이관 누락·불필요한 이관</text>
<circle cx="57" cy="244" r="10" fill="#225848"/>
<path d="M66 244H86" stroke="#88a08e" stroke-width="3" fill="none" stroke-linecap="round"/>
<rect x="87" y="200" width="603" height="89" rx="14" fill="#fffaf1"/>
