<text x="111" y="273" fill="#17372f" font-family="Noto Sans CJK KR, Noto Sans KR, Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="34" font-weight="700" text-anchor="start">실제 인수율·인수 대기시간</text>
<circle cx="57" cy="342" r="10" fill="#225848"/>
<path d="M66 342H86" stroke="#88a08e" stroke-width="3" fill="none" stroke-linecap="round"/>
