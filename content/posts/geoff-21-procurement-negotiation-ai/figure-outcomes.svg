<svg xmlns="http://www.w3.org/2000/svg" width="800" height="460" viewBox="0 0 800 460" role="img" aria-label="합의한 조건이 실제 구매에 적용됐을까?"><rect width="800" height="460" rx="24" fill="#faf7ef"/><style>text{font-family:'Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#183b43}.h{font-size:28px;font-weight:700}.t{font-size:21px}.s{font-size:17px}.n{font-size:32px;font-weight:700}</style><text class="h" x="36" y="50">합의한 조건이 실제 구매에 적용됐을까?</text><rect x="36" y="90" width="220" height="120" rx="16" fill="#e0ede7"/><rect x="290" y="90" width="220" height="120" rx="16" fill="#e0ede7"/><rect x="544" y="90" width="220" height="120" rx="16" fill="#f4e2d8"/><text class="h" x="60" y="138">협상 합의</text><text class="s" x="60" y="175">어떤 조건을 얻었나</text><text class="h" x="318" y="138">발주 반영</text><text class="s" x="314" y="175">바뀐 조건으로 샀나</text><text class="h" x="570" y="138">실제 효과</text><text class="s" x="565" y="175">비용·시간이 줄었나</text><path d="M261 148h21m-8-6 8 6-8 6 M515 148h21m-8-6 8 6-8 6" fill="none" stroke="#26766b" stroke-width="3"/><rect x="36" y="250" width="728" height="145" rx="16" fill="white"/><text class="t" x="60" y="288">가격·물량·지급조건을 구분해 평가합니다</text><text class="t" x="60" y="328">검토·예외 처리에 든 시간도 포함합니다</text><text class="t" x="60" y="368">공급사 불만·납품·품질 문제도 확인합니다</text></svg>
