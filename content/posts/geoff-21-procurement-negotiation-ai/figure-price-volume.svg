<svg xmlns="http://www.w3.org/2000/svg" width="800" height="460" viewBox="0 0 800 460" role="img" aria-label="단가 2% 할인, 최소 주문량은 네 배"><rect width="800" height="460" rx="24" fill="#faf7ef"/><style>text{font-family:'Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#183b43}.h{font-size:28px;font-weight:700}.t{font-size:21px}.s{font-size:17px}.n{font-size:32px;font-weight:700}</style><text class="h" x="36" y="50">단가 2% 할인, 최소 주문량은 네 배</text><text class="s" x="36" y="80">본문의 가상 예시 · 두 그래프는 단위와 눈금이 다릅니다</text><rect x="30" y="104" width="356" height="270" rx="18" fill="#fff"/><rect x="404" y="104" width="366" height="270" rx="18" fill="#fff"/><text class="t" x="52" y="143">개당 가격 (원)</text><text class="s" x="52" y="181">기존</text><rect x="110" y="162" width="225" height="35" rx="6" fill="#789c96"/><text class="s" x="240" y="185" fill="#fff" style="fill:white">10,000</text><text class="s" x="52" y="237">제안</text><rect x="110" y="218" width="220.5" height="35" rx="6" fill="#247a6b"/><text class="s" x="242" y="241" style="fill:white">9,800</text><text class="n" x="52" y="322">−2%</text><text class="t" x="426" y="143">최소 주문량 (개)</text><text class="s" x="426" y="181">기존</text><rect x="485" y="162" width="62.5" height="35" rx="6" fill="#789c96"/><text class="s" x="557" y="185">500</text><text class="s" x="426" y="237">제안</text><rect x="485" y="218" width="250" height="35" rx="6" fill="#ce6953"/><text class="s" x="660" y="241" style="fill:white">2,000</text><text class="n" x="426" y="322">4배</text><text class="t" x="40" y="416">500개만 필요하다면? 추가 1,500개의 수요·보관 부담도 확인</text></svg>
