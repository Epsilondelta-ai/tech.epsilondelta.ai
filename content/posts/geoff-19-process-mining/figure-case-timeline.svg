<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="title desc"><title id="title">견적 Q-101의 하루</title><desc id="desc">가상 예시. 초안 작성 09:02~09:05, 검토 시작14:00, 고객 발송16:00. 전체7시간.</desc><rect width="800" height="450" rx="20" fill="#fffaf2"/><g font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" fill="#193e4a"><text x="36" y="50" font-size="28" fill="#193e4a">초안은 3분, 고객 발송까지는 7시간</text><text x="36" y="87" font-size="19" fill="#193e4a">Q-101 · 같은 날의 기록을 이용한 가상 예시</text><rect x="60" y="174" width="672" height="48" rx="7" fill="#dce4e2"/><rect x="68" y="174" width="472" height="48" fill="#f3c4ae"/><rect x="63.2" y="174" width="4.8" height="48" fill="#23877c"/><text x="180" y="205" font-size="20" fill="#193e4a">초안 완료 → 검토 시작: 4시간 55분</text><line x1="60" y1="224" x2="60" y2="238" stroke="#527780"/><text x="36" y="265" font-size="16" fill="#193e4a">09:00</text><line x1="156" y1="224" x2="156" y2="238" stroke="#527780"/><text x="132" y="265" font-size="16" fill="#193e4a">10:00</text><line x1="252" y1="224" x2="252" y2="238" stroke="#527780"/><text x="228" y="265" font-size="16" fill="#193e4a">11:00</text><line x1="348" y1="224" x2="348" y2="238" stroke="#527780"/><text x="324" y="265" font-size="16" fill="#193e4a">12:00</text><line x1="444" y1="224" x2="444" y2="238" stroke="#527780"/><text x="420" y="265" font-size="16" fill="#193e4a">13:00</text><line x1="540" y1="224" x2="540" y2="238" stroke="#527780"/><text x="516" y="265" font-size="16" fill="#193e4a">14:00</text><line x1="636" y1="224" x2="636" y2="238" stroke="#527780"/><text x="612" y="265" font-size="16" fill="#193e4a">15:00</text><line x1="732" y1="224" x2="732" y2="238" stroke="#527780"/><text x="708" y="265" font-size="16" fill="#193e4a">16:00</text><line x1="66" y1="173" x2="100" y2="125" stroke="#23877c"/><text x="105" y="124" font-size="19" fill="#193e4a">09:02~09:05 초안 작성</text><text x="42" y="307" font-size="19" fill="#193e4a">요청 접수</text><text x="504" y="307" font-size="19" fill="#193e4a">검토 시작</text><text x="667" y="307" font-size="19" fill="#193e4a">고객 발송</text><text x="36" y="368" font-size="22" fill="#193e4a">먼저 확인할 것: 이 구간에서 왜 시간이 걸렸을까?</text><text x="36" y="405" font-size="18" fill="#193e4a">사건 사이의 간격만으로 지연 원인을 단정하지 않습니다.</text></g></svg>
