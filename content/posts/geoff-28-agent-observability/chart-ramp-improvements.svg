<svg xmlns="http://www.w3.org/2000/svg" width="800" height="460" viewBox="0 0 800 460" role="img" aria-labelledby="t d"><title id="t">Ramp Research의 운영 개선 발표</title><desc id="d">Langfuse2026년9월공개자료. 토큰10~20퍼센트감소,도구호출15퍼센트감소,세션시간30퍼센트단축. 개선전100지수로비교하며실제토큰수나시간이아니다.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#466766"/></marker></defs><rect width="800" height="460" rx="20" fill="#faf7f0"/><g font-family="Apple SD Gothic Neo,Noto Sans KR,sans-serif" fill="#183b3b"><text x="32" y="47" font-size="25" font-weight="700">Ramp Research의 운영 개선 발표</text><text x="32" y="80" font-size="15">각 지표의 개선 전 = 100인 지수 · Langfuse 2026년 9월 공개</text><text x="32" y="155" font-size="20">토큰 사용</text><rect x="190" y="115" width="360" height="19" rx="4" fill="#c5d5d1"/><text x="569" y="131" font-size="15">100</text><rect x="190" y="146" width="288" height="23" rx="4" fill="#568f89"/><rect x="478" y="146" width="36" height="23" fill="#cddfd9"/><text x="565" y="164" font-size="15">80~90 · 10~20% 감소</text><text x="32" y="262" font-size="20">도구 호출</text><rect x="190" y="222" width="360" height="19" rx="4" fill="#c5d5d1"/><text x="569" y="238" font-size="15">100</text><rect x="190" y="253" width="306" height="23" rx="4" fill="#568f89"/><text x="565" y="271" font-size="15">85 · 15% 감소</text><text x="32" y="369" font-size="20">세션 시간</text><rect x="190" y="329" width="360" height="19" rx="4" fill="#c5d5d1"/><text x="569" y="345" font-size="15">100</text><rect x="190" y="360" width="252" height="23" rx="4" fill="#568f89"/><text x="565" y="378" font-size="15">70 · 30% 단축</text><text x="32" y="421" font-size="15">발표된 감소율을 시각화한 지수 · 기록 분석과 수정 반영 이후 결과</text></g></svg>
