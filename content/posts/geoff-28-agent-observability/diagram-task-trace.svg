<svg xmlns="http://www.w3.org/2000/svg" width="800" height="460" viewBox="0 0 800 460" role="img" aria-labelledby="t d"><title id="t">한 업무의 실행 기록을 연결합니다</title><desc id="d">가상의 발주 업무를 요청부터 검색 모델 도구 승인 실제 등록 확인까지 연결한다. 개별 단계는 span이며 관련 실행은 업무 ID로 연결한다.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#466766"/></marker></defs><rect width="800" height="460" rx="20" fill="#faf7f0"/><g font-family="Apple SD Gothic Neo,Noto Sans KR,sans-serif" fill="#183b3b"><text x="32" y="47" font-size="25" font-weight="700">한 업무의 실행 기록을 연결합니다</text><text x="32" y="80" font-size="15">설계 예시 · 업무 ID와 대화 ID를 구분해 연결</text><rect x="32" y="104" width="736" height="56" rx="12" fill="#e2eeeb"/><text x="55" y="140" font-size="22">발주 업무 A  ·  관련 요청과 실행 경로 = Trace</text><rect x="32" y="208" width="115" height="84" rx="12" fill="#e2eeeb"/><text x="45" y="245" font-size="18">요청</text><text x="45" y="275" font-size="14">개별 Span</text><path d="M149 249L153 249" stroke="#466766" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="155" y="208" width="115" height="84" rx="12" fill="#e2eeeb"/><text x="168" y="245" font-size="18">자료 검색</text><text x="168" y="275" font-size="14">개별 Span</text><path d="M272 249L276 249" stroke="#466766" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="278" y="208" width="115" height="84" rx="12" fill="#e2eeeb"/><text x="291" y="245" font-size="18">모델 호출</text><text x="291" y="275" font-size="14">개별 Span</text><path d="M395 249L399 249" stroke="#466766" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="401" y="208" width="115" height="84" rx="12" fill="#e2eeeb"/><text x="414" y="245" font-size="18">도구 실행</text><text x="414" y="275" font-size="14">개별 Span</text><path d="M518 249L522 249" stroke="#466766" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="524" y="208" width="115" height="84" rx="12" fill="#e2eeeb"/><text x="537" y="245" font-size="18">승인</text><text x="537" y="275" font-size="14">개별 Span</text><path d="M641 249L645 249" stroke="#466766" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="647" y="208" width="115" height="84" rx="12" fill="#f5dfd3"/><text x="660" y="245" font-size="18">완료 확인</text><text x="660" y="275" font-size="14">개별 Span</text><rect x="32" y="334" width="736" height="85" rx="12" fill="#d7e7f2"/><text x="55" y="365" font-size="21">완료 확인에서 업무 시스템의 발주 번호·상태를 대조</text><text x="55" y="397" font-size="17">정상 응답 · 승인 대기 · 실제 확정을 구분</text></g></svg>
