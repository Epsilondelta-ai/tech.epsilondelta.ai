<svg xmlns="http://www.w3.org/2000/svg" width="800" height="460" viewBox="0 0 800 460" role="img" aria-labelledby="t d"><title id="t">필요한 기록을 남기고 개선에 사용합니다</title><desc id="d">수집범위와마스킹샘플링조회권한을정한뒤실행에피드백을연결하고담당자가수정재검증한다는설계예시.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#466766"/></marker></defs><rect width="800" height="460" rx="20" fill="#faf7f0"/><g font-family="Apple SD Gothic Neo,Noto Sans KR,sans-serif" fill="#183b3b"><text x="32" y="47" font-size="25" font-weight="700">필요한 기록을 남기고 개선에 사용합니다</text><rect x="32" y="108" width="350" height="200" rx="12" fill="#e2eeeb"/><text x="56" y="149" font-size="25">무엇을 남길까요?</text><text x="56" y="195" font-size="18">업무·문서·버전 식별 정보</text><text x="56" y="236" font-size="18">허용된 입력·출력과 결과</text><text x="56" y="277" font-size="18">마스킹 · 샘플링 · 조회 권한</text><rect x="414" y="108" width="354" height="200" rx="12" fill="#f5dfd3"/><text x="438" y="149" font-size="25">누가 활용할까요?</text><text x="438" y="195" font-size="18">현업의 수정·반려 사유</text><text x="438" y="236" font-size="18">개발팀의 실패 원인 조사</text><text x="438" y="277" font-size="18">수정 담당자 · 재검증</text><rect x="32" y="357" width="736" height="68" rx="12" fill="#d7e7f2"/><text x="54" y="398" font-size="21">같은 실행에 기록과 피드백을 연결 → 수정 → 다시 시험</text></g></svg>
