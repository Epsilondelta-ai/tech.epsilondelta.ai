<svg xmlns="http://www.w3.org/2000/svg" width="800" height="460" viewBox="0 0 800 460" role="img" aria-labelledby="t d"><title id="t">운영 기록으로 변경 전후를 검증합니다</title><desc id="d">TradeRepublic 설명을 바탕으로 단순화. 실제 실행 기록 평가 후 수정용과 별도시험세트를 나눠기존절차와새에이전트를비교하고출시판단.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#466766"/></marker></defs><rect width="800" height="460" rx="20" fill="#faf7f0"/><g font-family="Apple SD Gothic Neo,Noto Sans KR,sans-serif" fill="#183b3b"><text x="32" y="47" font-size="25" font-weight="700">운영 기록으로 변경 전후를 검증합니다</text><text x="32" y="80" font-size="15">Trade Republic 공개 사례의 흐름을 단순화</text><rect x="32" y="112" width="205" height="100" rx="12" fill="#e2eeeb"/><text x="54" y="149" font-size="22">실제 실행 기록</text><text x="54" y="184" font-size="18">좋은 결과 · 실패 사례</text><path d="M250 162L279 162" stroke="#466766" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="295" y="104" width="213" height="110" rx="12" fill="#e2eeeb"/><text x="317" y="141" font-size="22">수정용 문제</text><text x="317" y="180" font-size="18">구성과 지침을 개선</text><rect x="295" y="240" width="213" height="110" rx="12" fill="#d7e7f2"/><text x="317" y="277" font-size="22">별도 시험문제</text><text x="317" y="315" font-size="18">다른 사례로 재검증</text><path d="M269 164V295H281" stroke="#466766" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="558" y="168" width="210" height="144" rx="12" fill="#f5dfd3"/><text x="580" y="206" font-size="21">기존 절차 vs</text><text x="580" y="239" font-size="21">새 에이전트</text><text x="580" y="277" font-size="17">비교 후 출시 판단</text><path d="M515 160L547 195" stroke="#466766" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M515 294L547 278" stroke="#466766" stroke-width="3" fill="none" marker-end="url(#a)"/></g></svg>
