<svg xmlns="http://www.w3.org/2000/svg" width="800" height="666" viewBox="0 0 800 666" role="img"><title>GFS 파일럿과 Eon 운영 보고의 범위 및 교훈</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#256d73"/></marker></defs><rect width="800" height="666" fill="#faf7ef"/><g font-family="Noto Sans CJK KR, sans-serif"><text x="32" y="48" font-size="30" fill="#183d40" font-weight="700">사례의 범위와 교훈을 나누어 읽기</text><rect x="32" y="82" width="354" height="388" rx="16" fill="white" stroke="#256d73" stroke-width="2"/><rect x="414" y="82" width="354" height="388" rx="16" fill="white" stroke="#256d73" stroke-width="2"/><text x="52" y="127" font-size="28" fill="#256d73" font-weight="700">GFS · Tyson Foods</text><text x="52" y="175" font-size="29" fill="#a65036" font-weight="700">기업 간 파일럿</text><text x="52" y="230" font-size="28" fill="#183d40" font-weight="400">상품 검색</text><text x="52" y="275" font-size="28" fill="#183d40" font-weight="400">판매 추적</text><text x="52" y="337" font-size="25" fill="#183d40" font-weight="400">본운영 전환·확대는</text><text x="52" y="376" font-size="25" fill="#183d40" font-weight="400">향후 계획으로 제시</text><text x="52" y="434" font-size="25" fill="#256d73" font-weight="700">교훈: 명확한 과제부터</text><text x="434" y="127" font-size="28" fill="#256d73" font-weight="700">Eon · Buzz</text><text x="434" y="175" font-size="27" fill="#a65036" font-weight="700">운영 엔지니어링 보고</text><text x="434" y="230" font-size="26" fill="#183d40" font-weight="400">전문 서비스·테넌트</text><text x="434" y="275" font-size="26" fill="#183d40" font-weight="400">에이전트 연결 경험</text><text x="434" y="337" font-size="25" fill="#183d40" font-weight="400">기업 간 구매 조달</text><text x="434" y="376" font-size="25" fill="#183d40" font-weight="400">구축 사례는 아님</text><text x="434" y="434" font-size="25" fill="#256d73" font-weight="700">교훈: 경계의 정보 확인</text><rect x="32" y="506" width="736" height="128" rx="16" fill="#eee0be" stroke="#256d73" stroke-width="2"/><text x="52" y="547" font-size="28" fill="#183d40" font-weight="700">결과와 함께 근거·호출자 맥락을 설계</text><text x="52" y="593" font-size="27" fill="#183d40" font-weight="400">긴 작업의 지연과 원격 오류도 보이도록</text></g></svg>