<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img"><title>반복 계산과 당장 필요 없는 속도를 줄입니다</title><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#287D75"/></marker></defs><rect width="800" height="450" rx="18" fill="#FAF8F2"/><g font-family="Apple SD Gothic Neo,Noto Sans KR,sans-serif"><text x="30" y="46" font-size="26" fill="#193D3B" font-weight="700">반복 계산과 당장 필요 없는 속도를 줄입니다</text><rect x="30" y="87" width="355" height="292" rx="12" fill="#fff" stroke="#D9E3DB"/><rect x="415" y="87" width="355" height="292" rx="12" fill="#fff" stroke="#D9E3DB"/><text x="50" y="126" font-size="24" fill="#287D75" font-weight="700">프롬프트 캐시</text><text x="435" y="126" font-size="24" fill="#287D75" font-weight="700">배치 추론</text><rect x="50" y="151" width="315" height="55" rx="12" fill="#EAF1EB" stroke="#D9E3DB"/><text x="67" y="185" font-size="20" fill="#193D3B" font-weight="400">같은 회사 규정·업무 지침</text><path d="M208 211L208 239" stroke="#287D75" stroke-width="2.5" fill="none" marker-end="url(#a)"/><rect x="50" y="249" width="315" height="53" rx="12" fill="#fff" stroke="#D9E3DB"/><text x="67" y="282" font-size="20" fill="#193D3B" font-weight="400">입력 계산 재사용 + 새 질문</text><text x="50" y="337" font-size="18" fill="#193D3B" font-weight="400">이전 답변을 그대로 쓰는</text><text x="50" y="362" font-size="18" fill="#193D3B" font-weight="400">답변 캐시와는 다릅니다.</text><rect x="435" y="151" width="315" height="55" rx="12" fill="#FCE3D8" stroke="#D9E3DB"/><text x="452" y="185" font-size="20" fill="#193D3B" font-weight="400">내일 아침까지 필요한 분류</text><path d="M592 211L592 239" stroke="#287D75" stroke-width="2.5" fill="none" marker-end="url(#a)"/><rect x="435" y="249" width="315" height="53" rx="12" fill="#fff" stroke="#D9E3DB"/><text x="452" y="282" font-size="19" fill="#193D3B" font-weight="400">여러 요청을 모아 비동기 처리</text><text x="435" y="337" font-size="18" fill="#193D3B" font-weight="400">즉시 응답할 필요가 없는</text><text x="435" y="362" font-size="18" fill="#193D3B" font-weight="400">업무부터 검토합니다.</text><text x="30" y="423" font-size="18" fill="#193D3B" font-weight="400">캐시 재사용률·요금 조건·완료 시한을 함께 확인</text></g></svg>
