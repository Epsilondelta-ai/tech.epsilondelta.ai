<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img"><title>같은 업무로 시험하고, 한 가지씩 바꿔봅니다</title><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#287D75"/></marker></defs><rect width="800" height="450" rx="18" fill="#FAF8F2"/><g font-family="Apple SD Gothic Neo,Noto Sans KR,sans-serif"><text x="30" y="46" font-size="26" fill="#193D3B" font-weight="700">같은 업무로 시험하고, 한 가지씩 바꿔봅니다</text><rect x="30" y="87" width="740" height="70" rx="12" fill="#EAF1EB" stroke="#D9E3DB"/><text x="50" y="120" font-size="21" fill="#193D3B" font-weight="700">비교 기준 고정</text><text x="239" y="116" font-size="19" fill="#193D3B" font-weight="400">같은 난도 · 같은 완료 기준 · 같은 비용 범위</text><text x="239" y="145" font-size="16" fill="#193D3B" font-weight="400">실패한 요청과 직원의 수정 시간도 포함</text><rect x="30" y="185" width="342" height="103" rx="12" fill="#fff" stroke="#D9E3DB"/><text x="50" y="222" font-size="23" fill="#193D3B" font-weight="700">기존 구성</text><text x="50" y="251" font-size="19" fill="#193D3B" font-weight="400">현재 모델·검색·실행 방식</text><text x="50" y="277" font-size="17" fill="#193D3B" font-weight="400">총비용과 완료 건수 기록</text><rect x="428" y="185" width="342" height="103" rx="12" fill="#fff" stroke="#D9E3DB"/><text x="448" y="222" font-size="23" fill="#287D75" font-weight="700">개선 구성</text><text x="448" y="251" font-size="18" fill="#193D3B" font-weight="400">모델 선택 또는 캐시 하나만 변경</text><text x="448" y="277" font-size="17" fill="#193D3B" font-weight="400">같은 방식으로 결과 기록</text><path d="M201 293L201 330" stroke="#287D75" stroke-width="2.5" fill="none" marker-end="url(#a)"/><path d="M599 293L599 330" stroke="#287D75" stroke-width="2.5" fill="none" marker-end="url(#a)"/><rect x="30" y="340" width="740" height="77" rx="12" fill="#fff" stroke="#D9E3DB"/><text x="50" y="371" font-size="21" fill="#193D3B" font-weight="700">함께 비교할 결과</text><text x="50" y="402" font-size="19" fill="#193D3B" font-weight="400">완료 건당 비용 / 품질 통과율 / 직원 수정 시간 / 처리 시간</text></g></svg>
