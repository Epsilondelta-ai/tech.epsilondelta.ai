<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img"><title>한 줄을 고쳤다면, 바뀐 구간만 다시 계산합니다</title><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#287D75"/></marker></defs><rect width="800" height="450" rx="18" fill="#FAF8F2"/><g font-family="Apple SD Gothic Neo,Noto Sans KR,sans-serif"><text x="30" y="46" font-size="26" fill="#193D3B" font-weight="700">한 줄을 고쳤다면, 바뀐 구간만 다시 계산합니다</text><rect x="30" y="88" width="355" height="236" rx="12" fill="#fff" stroke="#D9E3DB"/><rect x="415" y="88" width="355" height="236" rx="12" fill="#fff" stroke="#D9E3DB"/><text x="50" y="123" font-size="22" fill="#C7634C" font-weight="700">이전: 문서 전체 재처리</text><text x="435" y="123" font-size="22" fill="#287D75" font-weight="700">개선: 변경 여부를 비교</text><rect x="50" y="145" width="135" height="36" rx="12" fill="#EDF1EB" stroke="#D9E3DB"/><text x="65" y="170" font-size="17" fill="#193D3B" font-weight="400">같은 구간</text><path d="M194 163L222 163" stroke="#287D75" stroke-width="2.5" fill="none" marker-end="url(#a)"/><text x="235" y="170" font-size="18" fill="#C7634C" font-weight="400">다시 임베딩</text><rect x="435" y="145" width="135" height="36" rx="12" fill="#EDF1EB" stroke="#D9E3DB"/><text x="450" y="170" font-size="17" fill="#193D3B" font-weight="400">같은 구간</text><path d="M579 163L607 163" stroke="#287D75" stroke-width="2.5" fill="none" marker-end="url(#a)"/><text x="620" y="170" font-size="18" fill="#287D75" font-weight="400">그대로 유지</text><rect x="50" y="196" width="135" height="36" rx="12" fill="#FCE3D8" stroke="#D9E3DB"/><text x="65" y="221" font-size="17" fill="#193D3B" font-weight="400">수정된 구간</text><path d="M194 214L222 214" stroke="#287D75" stroke-width="2.5" fill="none" marker-end="url(#a)"/><text x="235" y="221" font-size="18" fill="#C7634C" font-weight="400">다시 임베딩</text><rect x="435" y="196" width="135" height="36" rx="12" fill="#FCE3D8" stroke="#D9E3DB"/><text x="450" y="221" font-size="17" fill="#193D3B" font-weight="400">수정된 구간</text><path d="M579 214L607 214" stroke="#287D75" stroke-width="2.5" fill="none" marker-end="url(#a)"/><text x="620" y="221" font-size="18" fill="#C7634C" font-weight="400">다시 임베딩</text><rect x="50" y="247" width="135" height="36" rx="12" fill="#EDF1EB" stroke="#D9E3DB"/><text x="65" y="272" font-size="17" fill="#193D3B" font-weight="400">같은 구간</text><path d="M194 265L222 265" stroke="#287D75" stroke-width="2.5" fill="none" marker-end="url(#a)"/><text x="235" y="272" font-size="18" fill="#C7634C" font-weight="400">다시 임베딩</text><rect x="435" y="247" width="135" height="36" rx="12" fill="#EDF1EB" stroke="#D9E3DB"/><text x="450" y="272" font-size="17" fill="#193D3B" font-weight="400">같은 구간</text><path d="M579 265L607 265" stroke="#287D75" stroke-width="2.5" fill="none" marker-end="url(#a)"/><text x="620" y="272" font-size="18" fill="#287D75" font-weight="400">그대로 유지</text><rect x="30" y="344" width="740" height="65" rx="12" fill="#EAF1EB" stroke="#D9E3DB"/><text x="50" y="371" font-size="21" fill="#193D3B" font-weight="700">권한만 바뀌면? 텍스트 임베딩은 유지</text><text x="50" y="397" font-size="18" fill="#193D3B" font-weight="400">권한 정보만 갱신합니다.</text><text x="30" y="433" font-size="14" fill="#193D3B" font-weight="400">Notion의 문서 갱신 방식 개선을 단순화한 도해</text></g></svg>
