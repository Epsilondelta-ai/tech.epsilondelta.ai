<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img"><title>사용료는 줄었지만, 한 건 처리 비용은 올랐습니다</title><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#287D75"/></marker></defs><rect width="800" height="450" rx="18" fill="#FAF8F2"/><g font-family="Apple SD Gothic Neo,Noto Sans KR,sans-serif"><text x="30" y="46" font-size="26" fill="#193D3B" font-weight="700">사용료는 줄었지만, 한 건 처리 비용은 올랐습니다</text><text x="30" y="78" font-size="16" fill="#193D3B" font-weight="400">가상 계산 · 같은 품질로 업무 100건 완료</text><text x="30" y="119" font-size="17" fill="#287D75" font-weight="400">■ 모델·도구 사용료</text><text x="251" y="119" font-size="17" fill="#C7634C" font-weight="400">■ 직원 시간 환산</text><text x="30" y="173" font-size="20" fill="#193D3B" font-weight="400">기존</text><rect x="160" y="142" width="50" height="54" fill="#287D75"/><rect x="210" y="142" width="250" height="54" fill="#C7634C"/><text x="166" y="176" font-size="16" fill="white" font-weight="400">1만</text><text x="307" y="176" font-size="20" fill="white" font-weight="400">5만원</text><text x="477" y="176" font-size="20" fill="#193D3B" font-weight="400">합계 60,000원</text><text x="30" y="254" font-size="20" fill="#193D3B" font-weight="400">변경 후</text><rect x="160" y="221" width="25" height="54" fill="#287D75"/><rect x="185" y="221" width="500" height="54" fill="#C7634C"/><text x="376" y="255" font-size="20" fill="white" font-weight="400">10만원</text><text x="160" y="301" font-size="17" fill="#287D75" font-weight="400">사용료 5,000원</text><text x="503" y="301" font-size="20" fill="#193D3B" font-weight="400">합계 105,000원</text><rect x="30" y="328" width="740" height="68" rx="12" fill="#EAF1EB" stroke="#D9E3DB"/><text x="50" y="369" font-size="20" fill="#193D3B" font-weight="400">완료 업무 한 건당</text><text x="299" y="374" font-size="31" fill="#C7634C" font-weight="700">600원 → 1,050원</text><text x="30" y="428" font-size="15" fill="#193D3B" font-weight="400">직원 시간: 분당 500원 환산 · 구축비와 공통 인프라비 제외</text></g></svg>
