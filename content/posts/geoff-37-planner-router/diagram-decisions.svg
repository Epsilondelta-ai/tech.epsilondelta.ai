<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="title desc"><title id="title">다음 행동을 고르는 다섯 가지 기준</title><desc id="desc">진행, 확인 질문, 재계획, 인계, 종료의 조건과 남길 기록을 대응시킨다.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#203d40"/></marker></defs><rect width="800" height="480" rx="20" fill="#faf7ee"/><g font-family="Noto Sans CJK KR, sans-serif"><text x="30" y="46" font-size="27" font-weight="700" fill="#203d40">다음 행동을 고르는 다섯 가지 기준</text><text x="30" y="91" font-size="18" font-weight="600" fill="#203d40">다음 행동</text><text x="185" y="91" font-size="18" font-weight="600" fill="#203d40">선택 조건</text><text x="505" y="91" font-size="18" font-weight="600" fill="#203d40">남길 기록</text><rect x="26" y="108" width="748" height="54" rx="14" fill="#dce9e5"/><text x="42" y="143" font-size="22" font-weight="700" fill="#203d40">진행</text><text x="185" y="143" font-size="20" font-weight="500" fill="#203d40">선행 정보·작업 명확</text><text x="505" y="143" font-size="19" font-weight="500" fill="#203d40">작업·도구·기대 결과</text><rect x="26" y="172" width="748" height="54" rx="14" fill="#f0e3bc"/><text x="42" y="207" font-size="22" font-weight="700" fill="#203d40">확인 질문</text><text x="185" y="207" font-size="20" font-weight="500" fill="#203d40">해석에 따라 행동 달라짐</text><text x="505" y="207" font-size="19" font-weight="500" fill="#203d40">질문·대기 의도</text><rect x="26" y="236" width="748" height="54" rx="14" fill="#dce9e5"/><text x="42" y="271" font-size="22" font-weight="700" fill="#203d40">재계획</text><text x="185" y="271" font-size="20" font-weight="500" fill="#203d40">새 관찰로 기존 가정 무효</text><text x="505" y="271" font-size="19" font-weight="500" fill="#203d40">유지할 사실·새 작업</text><rect x="26" y="300" width="748" height="54" rx="14" fill="#f0e3bc"/><text x="42" y="335" font-size="22" font-weight="700" fill="#203d40">인계</text><text x="185" y="335" font-size="20" font-weight="500" fill="#203d40">권한·도구 부족, 판단 충돌</text><text x="505" y="335" font-size="19" font-weight="500" fill="#203d40">사실·남은 결정·담당자</text><rect x="26" y="364" width="748" height="54" rx="14" fill="#dce9e5"/><text x="42" y="399" font-size="22" font-weight="700" fill="#203d40">종료</text><text x="185" y="399" font-size="20" font-weight="500" fill="#203d40">완료 근거 또는 중단 조건</text><text x="505" y="399" font-size="19" font-weight="500" fill="#203d40">명시적 업무 상태</text><text x="30" y="464" font-size="20" font-weight="600" fill="#203d40">프로그램 종료·인계 문장 출력만으로 업무 완료가 되지는 않습니다.</text></g></svg>