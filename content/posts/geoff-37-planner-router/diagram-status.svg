<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="title desc"><title id="title">가상 사례의 종료 기록: 일부 완료</title><desc id="desc">청구는 초기 설치비 확인으로 완료. 단말기 연결 장애는 임시 장비 투입 결정이 지역 운영팀장에게 인계되어 보류다.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#203d40"/></marker></defs><rect width="800" height="480" rx="20" fill="#faf7ee"/><g font-family="Noto Sans CJK KR, sans-serif"><text x="30" y="46" font-size="27" font-weight="700" fill="#203d40">가상 사례의 종료 기록: 일부 완료</text><rect x="30" y="85" width="740" height="77" rx="14" fill="#dce9e5"/><text x="48" y="116" font-size="21" font-weight="600" fill="#203d40">① 청구 확인 → 완료</text><text x="48" y="145" font-size="21" font-weight="400" fill="#203d40">추가 금액: 계약서의 초기 설치비</text><rect x="30" y="185" width="740" height="105" rx="14" fill="#f3dfd5"/><text x="48" y="216" font-size="20" font-weight="600" fill="#203d40">② 단말기 연결 장애 → 인계 보류</text><text x="48" y="245" font-size="20" font-weight="400" fill="#203d40">망 복구 시각 미확보 · 임시 장비 투입은 권한자 판단</text><text x="48" y="274" font-size="20" font-weight="400" fill="#203d40">받을 담당자: 지역 운영팀장 · 가상 접수번호 #402</text><path d="M400,290 L400,330" fill="none" stroke="#203d40" stroke-width="2.5" marker-end="url(#a)"/><rect x="170" y="340" width="460" height="73" rx="14" fill="#f0e3bc"/><text x="188" y="371" font-size="24" font-weight="600" fill="#203d40">전체 상태: 일부 완료(인계 보류)</text><text x="72" y="454" font-size="22" font-weight="600" fill="#203d40">확인 사실·남은 결정·실제 접수 상태를 함께 남깁니다.</text></g></svg>