<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="title desc"><title id="title">분기가 있어도 고정 워크플로일 수 있습니다</title><desc id="desc">미리 정의된 진단별 경로와 관찰로 새 하위 작업을 정하는 제한된 동적 계획을 구분한다.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#203d40"/></marker></defs><rect width="800" height="480" rx="20" fill="#faf7ee"/><g font-family="Noto Sans CJK KR, sans-serif"><text x="30" y="46" font-size="27" font-weight="700" fill="#203d40">분기가 있어도 고정 워크플로일 수 있습니다</text><rect x="30" y="77" width="350" height="63" rx="14" fill="#dce9e5"/><text x="48" y="108" font-size="21" font-weight="600" fill="#203d40">미리 정의한 경로</text><rect x="420" y="77" width="350" height="63" rx="14" fill="#f0e3bc"/><text x="438" y="108" font-size="21" font-weight="600" fill="#203d40">관찰로 고르는 새 작업</text><rect x="70" y="171" width="270" height="60" rx="14" fill="#dce9e5"/><text x="88" y="202" font-size="21" font-weight="600" fill="#203d40">진단 결과 확인</text><path d="M205,140 L205,167" fill="none" stroke="#203d40" stroke-width="2.5" marker-end="url(#a)"/><path d="M205,231 L115,275" fill="none" stroke="#203d40" stroke-width="2.5" marker-end="url(#a)"/><path d="M205,231 L295,275" fill="none" stroke="#203d40" stroke-width="2.5" marker-end="url(#a)"/><rect x="30" y="280" width="170" height="70" rx="14" fill="#dce9e5"/><text x="48" y="311" font-size="19" font-weight="600" fill="#203d40">기기 문제</text><text x="48" y="340" font-size="19" font-weight="400" fill="#203d40">교체 절차</text><rect x="210" y="280" width="170" height="70" rx="14" fill="#dce9e5"/><text x="228" y="311" font-size="19" font-weight="600" fill="#203d40">망 문제</text><text x="228" y="340" font-size="19" font-weight="400" fill="#203d40">통신사 조회</text><rect x="440" y="171" width="310" height="60" rx="14" fill="#f0e3bc"/><text x="458" y="202" font-size="21" font-weight="600" fill="#203d40">조사 → 관찰 읽기</text><path d="M595,140 L595,167" fill="none" stroke="#203d40" stroke-width="2.5" marker-end="url(#a)"/><path d="M595,231 L595,272" fill="none" stroke="#203d40" stroke-width="2.5" marker-end="url(#a)"/><rect x="440" y="280" width="310" height="70" rx="14" fill="#f0e3bc"/><text x="458" y="311" font-size="19" font-weight="600" fill="#203d40">관찰로 드러난 하위 작업</text><text x="458" y="340" font-size="19" font-weight="400" fill="#203d40">범위 안에서 계획 갱신</text><text x="38" y="405" font-size="20" font-weight="500" fill="#203d40">대안 경로를 미리 코드로 정의</text><text x="438" y="405" font-size="20" font-weight="500" fill="#203d40">다음 조사 대상을 결과로 결정</text><text x="38" y="447" font-size="21" font-weight="600" fill="#203d40">핵심은 단계 수가 아니라, 다음 작업을 정하는 방식입니다.</text></g></svg>