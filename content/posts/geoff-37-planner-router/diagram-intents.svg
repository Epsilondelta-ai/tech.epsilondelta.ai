<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="title desc"><title id="title">정보 누락과 복합 의도는 다른 문제입니다</title><desc id="desc">지점 식별을 위한 질문은 두 의도 모두의 조회에 선행하며, 두 의도는 각각 보존한다.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#203d40"/></marker></defs><rect width="800" height="480" rx="20" fill="#faf7ee"/><g font-family="Noto Sans CJK KR, sans-serif"><text x="30" y="46" font-size="27" font-weight="700" fill="#203d40">정보 누락과 복합 의도는 다른 문제입니다</text><rect x="30" y="80" width="350" height="105" rx="14" fill="#f3dfd5"/><text x="48" y="111" font-size="21" font-weight="600" fill="#203d40">정보 누락: 어느 새 지점?</text><text x="48" y="140" font-size="21" font-weight="400" fill="#203d40">성수점인가, 판교점인가?</text><rect x="420" y="80" width="350" height="105" rx="14" fill="#dce9e5"/><text x="438" y="111" font-size="21" font-weight="600" fill="#203d40">복합 의도: 두 가지 요청</text><text x="438" y="140" font-size="21" font-weight="400" fill="#203d40">단말기 조사 + 청구 확인</text><path d="M205,185 L205,225" fill="none" stroke="#203d40" stroke-width="2.5" marker-end="url(#a)"/><path d="M595,185 L595,225" fill="none" stroke="#203d40" stroke-width="2.5" marker-end="url(#a)"/><rect x="30" y="234" width="350" height="90" rx="14" fill="#f3dfd5"/><text x="48" y="265" font-size="20" font-weight="600" fill="#203d40">대상이 갈리면 확인 질문</text><text x="48" y="294" font-size="20" font-weight="400" fill="#203d40">맥락으로 유일하면 질문 생략</text><rect x="420" y="234" width="350" height="90" rx="14" fill="#dce9e5"/><text x="438" y="265" font-size="20" font-weight="600" fill="#203d40">의도 목록을 모두 보존</text><text x="438" y="294" font-size="20" font-weight="400" fill="#203d40">각각 결과·보류 사유 연결</text><rect x="30" y="365" width="740" height="76" rx="14" fill="#f0e3bc"/><text x="48" y="396" font-size="22" font-weight="600" fill="#203d40">지점 확정 후 → 해당 매장의 로그·청구서 조회</text></g></svg>