<svg xmlns="http://www.w3.org/2000/svg" width="800" height="460" viewBox="0 0 800 460" role="img" aria-labelledby="title desc"><title id="title">공정회의는 조치와 재확인까지 연결합니다</title><desc id="desc">근거를 확인해 막힌 일을 특정하고 협력사 계획 및 담당자 기한을 정한 다음 현장 기록으로 재확인하는 순환. 각 단계에서 비전 AI 일정 도구 에이전트와 사람이 역할을 나눈다.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10" fill="#397b79"/></marker></defs><rect width="800" height="460" rx="20" fill="#faf7f0"/><g font-family="Apple SD Gothic Neo,Noto Sans KR,sans-serif"><text x="32" y="47" font-size="26" fill="#183b3b" font-weight="700">공정회의는 조치와 재확인까지 연결합니다</text><text x="32" y="81" font-size="16" fill="#59696b" font-weight="400">자동 분석 이후 누가 무엇을 바꿀지 남기는 업무 흐름</text><rect x="32" y="114" width="166" height="113" rx="12" fill="#e2eeeb"/><text x="47" y="154" font-size="22" fill="#183b3b" font-weight="700">근거 확인</text><text x="47" y="194" font-size="16" fill="#183b3b" font-weight="400">사진·설치량·검사</text><rect x="222" y="114" width="166" height="113" rx="12" fill="#e2eeeb"/><text x="237" y="154" font-size="22" fill="#183b3b" font-weight="700">막힌 일 특정</text><text x="237" y="194" font-size="16" fill="#183b3b" font-weight="400">미완료·자재·도면</text><rect x="412" y="114" width="166" height="113" rx="12" fill="#f5dfd3"/><text x="427" y="154" font-size="22" fill="#183b3b" font-weight="700">작업 계획 조정</text><text x="427" y="194" font-size="16" fill="#183b3b" font-weight="400">담당자·완료 기한</text><rect x="602" y="114" width="166" height="113" rx="12" fill="#e2eeeb"/><text x="617" y="154" font-size="22" fill="#183b3b" font-weight="700">처리 결과 확인</text><text x="617" y="194" font-size="16" fill="#183b3b" font-weight="400">새 촬영·검사 기록</text><path d="M201 168L218 168" fill="none" stroke="#397b79" stroke-width="2.5" marker-end="url(#a)"/><path d="M391 168L408 168" fill="none" stroke="#397b79" stroke-width="2.5" marker-end="url(#a)"/><path d="M581 168L598 168" fill="none" stroke="#397b79" stroke-width="2.5" marker-end="url(#a)"/><path d="M685 230V260H115V230" stroke="#397b79" stroke-width="2.5" fill="none" marker-end="url(#a)"/><text x="292" y="291" font-size="18" fill="#397b79" font-weight="600">다음 회의에서 다시 확인</text><rect x="32" y="318" width="736" height="104" rx="12" fill="#d7e7f2"/><text x="52" y="351" font-size="19" fill="#183b3b" font-weight="600">비전 AI: 상태 추정  ·  일정 도구: 지연 영향 계산</text><text x="52" y="386" font-size="19" fill="#183b3b" font-weight="400">에이전트: 근거·안건 정리  ·  사람: 대응 결정·변경 승인</text></g></svg>
