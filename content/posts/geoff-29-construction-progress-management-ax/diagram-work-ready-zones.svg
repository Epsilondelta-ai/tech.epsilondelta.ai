<svg xmlns="http://www.w3.org/2000/svg" width="800" height="460" viewBox="0 0 800 460" role="img" aria-labelledby="title desc"><title id="title">남은 물량이 적어도 다음 작업은 기다립니다</title><desc id="desc">설명용 구역 A는 설치와 검사를 마쳐 마감 가능하지만 구역 B는 설치 일부 미완료, 구역 C는 검사 대기이므로 마감을 시작할 수 없다.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10" fill="#397b79"/></marker></defs><rect width="800" height="460" rx="20" fill="#faf7f0"/><g font-family="Apple SD Gothic Neo,Noto Sans KR,sans-serif"><text x="32" y="47" font-size="26" fill="#183b3b" font-weight="700">남은 물량이 적어도 다음 작업은 기다립니다</text><text x="32" y="81" font-size="16" fill="#59696b" font-weight="400">설명용 구역 비교 · 설치량과 후속 작업 가능 여부를 함께 확인</text><rect x="32" y="106" width="736" height="50" rx="12" fill="#d7e7f2"/><text x="54" y="138" font-size="19" fill="#183b3b" font-weight="700">구역</text><text x="205" y="138" font-size="19" fill="#183b3b" font-weight="700">설치 상태</text><text x="420" y="138" font-size="19" fill="#183b3b" font-weight="700">검사 상태</text><text x="610" y="138" font-size="19" fill="#183b3b" font-weight="700">천장 마감</text><rect x="32" y="167" width="736" height="60" rx="12" fill="#e2eeeb"/><text x="54" y="205" font-size="20" fill="#183b3b" font-weight="400">A 구역</text><text x="205" y="205" font-size="20" fill="#183b3b" font-weight="400">설치 완료</text><text x="420" y="205" font-size="20" fill="#183b3b" font-weight="400">검사 완료</text><text x="610" y="205" font-size="20" fill="#397b79" font-weight="700">시작 가능</text><rect x="32" y="239" width="736" height="60" rx="12" fill="#f5dfd3"/><text x="54" y="277" font-size="20" fill="#183b3b" font-weight="400">B 구역</text><text x="205" y="277" font-size="20" fill="#183b3b" font-weight="400">일부 미완료</text><text x="420" y="277" font-size="20" fill="#183b3b" font-weight="400">미완료분 확인</text><text x="610" y="277" font-size="20" fill="#d46c47" font-weight="700">대기</text><rect x="32" y="311" width="736" height="60" rx="12" fill="#f5dfd3"/><text x="54" y="349" font-size="20" fill="#183b3b" font-weight="400">C 구역</text><text x="205" y="349" font-size="20" fill="#183b3b" font-weight="400">설치 완료</text><text x="420" y="349" font-size="20" fill="#183b3b" font-weight="400">검사 대기</text><text x="610" y="349" font-size="20" fill="#d46c47" font-weight="700">대기</text><text x="40" y="419" font-size="20" fill="#183b3b" font-weight="600">확인할 것: 남은 작업의 위치 → 담당자·기한 → 후속 작업 착수 조건</text></g></svg>
