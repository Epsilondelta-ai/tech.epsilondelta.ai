<svg xmlns="http://www.w3.org/2000/svg" width="800" height="560" viewBox="0 0 800 560" lang="ko"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#377f80"/></marker></defs><rect width="800" height="560" rx="20" fill="#f8f5ed"/><g font-family="Noto Sans CJK KR, sans-serif"><text x="34" y="49" font-size="30" fill="#19374a" font-weight="700">검증 결과와 업무 위험에 맞춘 권한</text><rect x="30" y="80" width="740" height="128" rx="16" fill="#e0ece8" stroke="#bdd1d0" stroke-width="2"/><text x="54" y="117" font-size="30" fill="#19374a" font-weight="700">검토 순서 정렬</text><text x="54" y="157" font-size="27" fill="#19374a" font-weight="500">AI가 위험 징후를 분류</text><text x="54" y="191" font-size="26" fill="#19374a" font-weight="500">최종 발송은 사람 승인</text><rect x="30" y="225" width="740" height="128" rx="16" fill="#ffffff" stroke="#bdd1d0" stroke-width="2"/><text x="54" y="262" font-size="30" fill="#19374a" font-weight="700">저위험 구간의 조건부 통과</text><text x="54" y="302" font-size="27" fill="#19374a" font-weight="500">검증된 구간만 제한적으로 적용</text><text x="54" y="336" font-size="26" fill="#19374a" font-weight="500">보류 전건 확인 · 통과 건 표본 감사</text><rect x="30" y="370" width="740" height="128" rx="16" fill="#fff0e9" stroke="#bdd1d0" stroke-width="2"/><text x="54" y="407" font-size="30" fill="#19374a" font-weight="700">전건 사람 승인</text><text x="54" y="447" font-size="27" fill="#19374a" font-weight="500">표본 부족 또는 오판 손실이 큰 업무</text><text x="54" y="481" font-size="26" fill="#19374a" font-weight="500">AI 판정은 참고 정보로 활용</text><text x="34" y="540" font-size="26" fill="#b04435" font-weight="700">점수만으로 발송·거래 권한이 생기지는 않습니다</text></g></svg>