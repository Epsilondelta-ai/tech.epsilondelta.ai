<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480" role="img"><title>후보 해석에서 실제 저장까지 책임을 나눕니다</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#256d73"/></marker></defs><rect width="800" height="480" fill="#faf7ef"/><g font-family="Noto Sans CJK KR, sans-serif"><text x="30" y="48" font-size="29" fill="#183d40" font-weight="700">후보 해석에서 실제 저장까지 책임을 나눕니다</text><rect x="25" y="85" width="230" height="145" rx="14" fill="white" stroke="#256d73" stroke-width="2"/><text x="45" y="121" font-size="24" fill="#256d73" font-weight="700">① 모델</text><text x="45" y="157" font-size="20" fill="#183d40" font-weight="400">의도 · 누락 정보 해석</text><text x="45" y="188" font-size="20" fill="#183d40" font-weight="400">확정값 대신 후보 제안</text><rect x="285" y="85" width="230" height="145" rx="14" fill="white" stroke="#256d73" stroke-width="2"/><text x="305" y="121" font-size="24" fill="#256d73" font-weight="700">② 조회 부품</text><text x="305" y="157" font-size="20" fill="#183d40" font-weight="400">주문 ID · 현재 단가</text><text x="305" y="188" font-size="20" fill="#183d40" font-weight="400">입수량 · 유효 규정</text><rect x="545" y="85" width="230" height="145" rx="14" fill="white" stroke="#256d73" stroke-width="2"/><text x="565" y="121" font-size="24" fill="#256d73" font-weight="700">③ 계산 코드</text><text x="565" y="157" font-size="20" fill="#183d40" font-weight="400">확정 입력과 단위</text><text x="565" y="188" font-size="20" fill="#183d40" font-weight="400">결과 · 규칙 버전 기록</text><path d="M257 155 L280 155" stroke="#256d73" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M517 155 L540 155" stroke="#256d73" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="25" y="285" width="350" height="145" rx="14" fill="white" stroke="#256d73" stroke-width="2"/><text x="45" y="321" font-size="24" fill="#256d73" font-weight="700">④ 검증 · 담당자 승인</text><text x="45" y="357" font-size="20" fill="#183d40" font-weigh