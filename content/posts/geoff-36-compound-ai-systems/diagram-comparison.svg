<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" role="img"><title>모델 교체와 부품 수정: 같은 조건에서 네 가지 비교</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#256d73"/></marker></defs><rect width="800" height="520" fill="#faf7ef"/><g font-family="Noto Sans CJK KR, sans-serif"><text x="30" y="48" font-size="29" fill="#183d40" font-weight="700">모델 교체와 부품 수정: 같은 조건에서 네 가지 비교</text><text x="32" y="86" font-size="22" fill="#183d40" font-weight="400">동일 사례 묶음 · 동일 원장 시점 · 동일 예산 조건</text><rect x="30" y="110" width="355" height="120" rx="14" fill="white" stroke="#256d73" stroke-width="2"/><text x="50" y="146" font-size="24" fill="#256d73" font-weight="700">현재 모델 + 현재 구조</text><text x="50" y="182" font-size="20" fill="#183d40" font-weight="400">현재 오류·시간·비용의 기준</text><rect x="415" y="110" width="355" height="120" rx="14" fill="white" stroke="#256d73" stroke-width="2"/><text x="435" y="146" font-size="24" fill="#256d73" font-weight="700">후보 모델 + 현재 구조</text><text x="435" y="182" font-size="20" fill="#183d40" font-weight="400">모델 교체만의 효과</text><rect x="30" y="250" width="355" height="120" rx="14" fill="white" stroke="#256d73" stroke-width="2"/><text x="50" y="286" font-size="24" fill="#256d73" font-weight="700">현재 모델 + 문제 부품 수정</text><text x="50" y="322" font-size="20" fill="#183d40" font-weight="400">확인된 구조·계약 수정의 효과</text><rect x="415" y="250" width="355" height="120" rx="14" fill="white" stroke="#256d73" stroke-width="2"/><text x="435" y="286" font-size="24" fill="#256d73" font-weight="700">후보 모델 + 개선 구조</text><text x="435" y="322" font-size="20" fill="#183d40" font-weight="400">결합 효과와 추가 비용</text><text x="30" y="414" font-size="25" fill="#256d73" font-weight="700">기록으로 조사 → 비교 실험 → 최종 상태 확인</text><text x="30" y="452" font-size="21" fill="#183d40" font-weight="400">잘못된 확정 · 적절한 보류 · 수정 시간 · 완료 건당 총비용</text><text x="30" y="491" font-size="21" fill="#a65036" font-weight="400">증상이나 한 번의 개선만으로 원인을 확정하지 않습니다</text></g></svg>