<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480" role="img"><title>가상 주문 변경: 두 박스는 두 개가 아닙니다</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#256d73"/></marker></defs><rect width="800" height="480" fill="#faf7ef"/><g font-family="Noto Sans CJK KR, sans-serif"><text x="30" y="48" font-size="29" fill="#183d40" font-weight="700">가상 주문 변경: 두 박스는 두 개가 아닙니다</text><rect x="30" y="85" width="340" height="155" rx="14" fill="white" stroke="#256d73" stroke-width="2"/><text x="50" y="121" font-size="24" fill="#256d73" font-weight="700">고객 요청</text><text x="50" y="157" font-size="20" fill="#183d40" font-weight="400">두 박스 추가</text><text x="50" y="188" font-size="20" fill="#183d40" font-weight="400">배송지: 새 평택 물류센터</text><rect x="430" y="85" width="340" height="155" rx="14" fill="white" stroke="#256d73" stroke-width="2"/><text x="450" y="121" font-size="24" fill="#256d73" font-weight="700">원장에서 확인할 기준</text><text x="450" y="157" font-size="20" fill="#183d40" font-weight="400">1박스 = 24개</text><text x="450" y="188" font-size="20" fill="#183d40" font-weight="400">주문 ID · 단가 · 변경 가능 상태</text><text x="70" y="302" font-size="30" fill="#256d73" font-weight="700">추가 수량: 2박스 × 24개/박스 = 48개</text><rect x="60" y="338" width="680" height="105" rx="14" fill="white" stroke="#a65036" stroke-width="2"/><text x="80" y="374" font-size="24" fill="#a65036" font-weight="700">확인 전에는 변경 초안만</text><text x="80" y="410" font-size="20" fill="#183d40" font-weight="400">대상이 여럿이거나 단위가 빠지면 확인 요청</text></g></svg>