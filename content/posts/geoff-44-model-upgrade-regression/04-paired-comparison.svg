<svg xmlns="http://www.w3.org/2000/svg" width="800" height="684" viewBox="0 0 800 684"><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8" fill="#237e78"/></marker></defs><rect width="800" height="684" rx="20" fill="#faf6ed"/><g font-family="Noto Sans CJK KR, sans-serif"><text x="32" y="54" font-size="32" fill="#203d4b" text-anchor="start" font-weight="700">답변보다 행동과 원장 결과를 비교</text><rect x="32" y="88" width="736" height="78" rx="16" fill="#e0eeea"/><text x="400.0" y="136.0" font-size="28" fill="#203d4b" text-anchor="middle" font-weight="500">같은 사례 · 동일한 초기 원장 상태</text><path d="M240 166 L240 209" fill="none" stroke="#237e78" stroke-width="3" marker-end="url(#arr)"/><path d="M560 166 L560 209" fill="none" stroke="#237e78" stroke-width="3" marker-end="url(#arr)"/><rect x="72" y="217" width="300" height="91" rx="16" fill="#e0eeea"/><text x="222.0" y="271.5" font-size="26" fill="#203d4b" text-anchor="middle" font-weight="500">현행 묶음</text><rect x="428" y="217" width="300" height="91" rx="16" fill="#e0eeea"/><text x="578.0" y="271.5" font-size="26" fill="#203d4b" text-anchor="middle" font-weight="500">후보 묶음</text><path d="M222 308 L222 351" fill="none" stroke="#237e78" stroke-width="3" marker-end="url(#arr)"/><path d="M578 308 L578 351" fill="none" stroke="#237e78" stroke-width="3" marker-end="url(#arr)"/><rect x="32" y="359" width="356" height="120" rx="16" fill="#e0eeea"/><text x="210.0" y="409.0" font-size="25" fill="#203d4b" text-anchor="middle" font-weight="500">출고 확인 → 승인 요청</text><text x="210.0" y="447.0" font-size="25" fill="#203d4b" text-anchor="middle" font-weight="500">외부 취소 실행 안 함</text><rect x="412" y="359" width="356" height="120" rx="16" fill="#f9e4da"/><text x="590.0" y="409.0" font-size="25" fill="#203d4b" text-anchor="middle" font-weight="500">승인 없이 취소 시도</text><text x="590.0" y="447.0" font-size="25" fill="#203d4b" text-anchor="middle" font-weight="500">안전장치가 실행 차단</text><rect x="32" y="508" width="736" height="94" rx="16" fill="#f9e4da"/><text x="400.0" y="545.0" font-size="27" fill="#203d4b" text-anchor="middle" font-weight="500">기존 성공 → 후보 실패</text><text x="400.0" y="583.0" font-size="27" fill="#203d4b" text-anchor="middle" font-weight="500">차단됐어도 승인 보류 사유</text><text x="400" y="648" font-size="25" fill="#203d4b" text-anchor="middle" font-weight="500">전체 평균 옆에 중요 구간·수정 부담을 함께 확인</text></g></svg>