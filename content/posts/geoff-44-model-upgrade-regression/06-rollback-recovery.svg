<svg xmlns="http://www.w3.org/2000/svg" width="800" height="686" viewBox="0 0 800 686"><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8" fill="#237e78"/></marker></defs><rect width="800" height="686" rx="20" fill="#faf6ed"/><g font-family="Noto Sans CJK KR, sans-serif"><text x="32" y="54" font-size="32" fill="#203d4b" text-anchor="start" font-weight="700">롤백과 업무 복구는 서로 다른 일</text><rect x="32" y="92" width="736" height="78" rx="16" fill="#f9e4da"/><text x="400.0" y="140.0" font-size="26" fill="#203d4b" text-anchor="middle" font-weight="500">이상 발견 → 후보 쓰기·진행 작업·재시도 격리</text><path d="M222 170 L222 217" fill="none" stroke="#237e78" stroke-width="3" marker-end="url(#arr)"/><path d="M578 170 L578 217" fill="none" stroke="#237e78" stroke-width="3" marker-end="url(#arr)"/><rect x="32" y="225" width="356" height="103" rx="16" fill="#e0eeea"/><text x="210.0" y="266.5" font-size="28" fill="#203d4b" text-anchor="middle" font-weight="500">구성 롤백</text><text x="210.0" y="304.5" font-size="28" fill="#203d4b" text-anchor="middle" font-weight="500">앞으로 들어올 요청</text><rect x="412" y="225" width="356" height="103" rx="16" fill="#f9e4da"/><text x="590.0" y="266.5" font-size="28" fill="#203d4b" text-anchor="middle" font-weight="500">업무 복구</text><text x="590.0" y="304.5" font-size="28" fill="#203d4b" text-anchor="middle" font-weight="500">이미 실행된 거래</text><path d="M210 328 L210 374" fill="none" stroke="#237e78" stroke-width="3" marker-end="url(#arr)"/><path d="M590 328 L590 374" fill="none" stroke="#237e78" stroke-width="3" marker-end="url(#arr)"/><rect x="32" y="382" width="356" height="144" rx="16" fill="#e0eeea"/><text x="210.0" y="425.0" font-size="25" fill="#203d4b" text-anchor="middle" font-weight="500">기존 묶음으로 전환</text><text x="210.0" y="463.0" font-size="25" fill="#203d4b" text-anchor="middle" font-weight="500">데이터·권한 호환 확인</text><text x="210.0" y="501.0" font-size="25" fill="#203d4b" text-anchor="middle" font-weight="500">진행 상담 담당 결정</text><rect x="412" y="382" width="356" height="144" rx="16" fill="#f9e4da"/><text x="590.0" y="425.0" font-size="25" fill="#203d4b" text-anchor="middle" font-weight="500">거래 ID·실행 기록 대조</text><text x="590.0" y="463.0" font-size="25" fill="#203d4b" text-anchor="middle" font-weight="500">취소·정정 판단</text><text x="590.0" y="501.0" font-size="25" fill="#203d4b" text-anchor="middle" font-weight="500">필요한 고객 재안내</text><rect x="32" y="561" width="736" height="94" rx="16" fill="#e0eeea"/><text x="400.0" y="598.0" font-size="25" fill="#203d4b" text-anchor="middle" font-weight="500">설정을 되돌려도 처리된 환불은 남습니다</text><text x="400.0" y="636.0" font-size="25" fill="#203d4b" text-anchor="middle" font-weight="500">종료일 전에 검증·롤백 시한과 우회 경로 합의</text></g></svg>