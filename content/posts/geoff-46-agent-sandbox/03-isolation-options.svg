<svg xmlns="http://www.w3.org/2000/svg" width="800" height="620" viewBox="0 0 800 620"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#426c76"/></marker></defs><rect width="800" height="620" fill="#faf8f2"/><g font-family="Noto Sans CJK KR, sans-serif"><text x="36" y="52" font-size="30" fill="#183847" font-weight="700" text-anchor="start">무엇을 공유하고 어디서 요청을 받는가</text><rect x="36" y="82" width="728" height="134" rx="16" fill="#e6f1ed" stroke="#51968c" stroke-width="2"/><text x="58" y="118" font-size="29" fill="#183847" font-weight="700" text-anchor="start">일반 컨테이너</text><text x="58" y="160" font-size="27" fill="#183847" font-weight="500" text-anchor="start">프로그램 → 공유 호스트 커널</text><text x="58" y="197" font-size="25" fill="#183847" font-weight="500" text-anchor="start">호스트 연결 폴더와 관리 권한을 확인</text><rect x="36" y="235" width="728" height="134" rx="16" fill="#e8eef5" stroke="#51968c" stroke-width="2"/><text x="58" y="271" font-size="29" fill="#183847" font-weight="700" text-anchor="start">사용자 공간 커널</text><text x="58" y="313" font-size="27" fill="#183847" font-weight="500" text-anchor="start">프로그램 → 중간 커널 → 호스트</text><text x="58" y="350" font-size="25" fill="#183847" font-weight="500" text-anchor="start">호스트 노출을 줄이고 호환성을 확인</text><rect x="36" y="388" width="728" height="134" rx="16" fill="#f4ead3" stroke="#51968c" stroke-width="2"/><text x="58" y="424" font-size="29" fill="#183847" font-weight="700" text-anchor="start">가상 머신 · 마이크로VM</text><text x="58" y="466" font-size="27" fill="#183847" font-weight="500" text-anchor="start">프로그램 → 개별 게스트 커널</text><text x="58" y="503" font-size="25" fill="#183847" font-weight="500" text-anchor="start">이미지 · 패치 · 연결 통로를 운영</text><text x="36" y="586" font-size="25" fill="#183847" font-weight="700" text-anchor="start">모든 방식에서 파일 · 네트워크 · API 권한은 별도 설계</text></g></svg>