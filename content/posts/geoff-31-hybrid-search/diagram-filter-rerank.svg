<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500"><title>후보 자격과 후보 순서를 분리하기</title><desc>확정된 단일 제품 질의의 설계 예입니다. 적용 제품 필터로 자격을 제한하고 하이브리드 검색으로 후보를 수집해 순위를 결합한 뒤 재정렬합니다. 필터 시점과 후보 제한에 따른 누락을 시험해야 하며 재정렬은 빠진 문서를 복원하지 못합니다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#597674" stroke-width="1.5"/></marker></defs><rect width="800" height="500" rx="20" fill="#FAF7F0"/><g font-family="'Noto Sans CJK KR','Noto Sans KR','Malgun Gothic',sans-serif"><text x="32" y="49" font-size="30" font-weight="700" fill="#243E40">후보 자격과 후보 순서를 분리하기</text><text x="32" y="84" font-size="22" font-weight="500" fill="#243E40">확정된 단일 제품 질의의 설계 예</text><rect x="32" y="102" width="736" height="88" rx="14" fill="#F4E7DA"/><text x="52" y="137" font-size="27" font-weight="700" fill="#243E40">정확 조회·필터: 후보 자격 제한</text><text x="52" y="172" font-size="24" font-weight="500" fill="#243E40">적용 제품 ID = AX-010-B · 판본·접근 범위</text><path d="M400 195 L400 218" fill="none" stroke="#597674" stroke-width="3" marker-end="url(#arrow)"/><rect x="32" y="228" width="736" height="78" rx="14" fill="#E8EFEB"/><text x="52" y="261" font-size="27" font-weight="700" fill="#243E40">하이브리드 검색: 후보 수집·순위 결합</text><text x="52" y="292" font-size="23" font-weight="500" fill="#243E40">허용 범위 안에서 어휘 검색 + 벡터 검색</text><path d="M400 311 L400 334" fill="none" stroke="#597674" stroke-width="3" marker-end="url(#arrow)"/><rect x="32" y="344" width="736" height="74" rx="14" fill="#E8EFEB"/><text x="52" y="376" font-size="27" font-weight="700" fill="#243E40">재정렬: 모인 후보의 순서 조정</text><text x="52" y="405" font-size="23" font-weight="500" fill="#243E40">후보에 없던 문서는 복원하지 못함</text><text x="32" y="456" font-size="24" font-weight="700" fill="#914623">필터 시점·후보 제한에 따른 누락을 시험해야 합니다</text><text x="32" y="486" font-size="22" font-weight="500" fill="#243E40">비교·대체품 질문은 의도에 맞는 별도 경로로 설계</text></g></svg>
