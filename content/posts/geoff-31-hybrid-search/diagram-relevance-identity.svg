<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500"><title>뜻이 비슷한가, 같은 제품인가</title><desc>의미 검색은 다른 표현의 증상을 연결합니다. 동일성 조건은 전용 식별자 필드의 값을 대조합니다. 의미 유사도는 제품번호 일치의 증명이 아닙니다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#597674" stroke-width="1.5"/></marker></defs><rect width="800" height="500" rx="20" fill="#FAF7F0"/><g font-family="'Noto Sans CJK KR','Noto Sans KR','Malgun Gothic',sans-serif"><text x="32" y="49" font-size="30" font-weight="700" fill="#243E40">뜻이 비슷한가, 같은 제품인가</text><rect x="32" y="80" width="356" height="326" rx="14" fill="#E8EFEB"/><rect x="412" y="80" width="356" height="326" rx="14" fill="#F4E7DA"/><text x="54" y="121" font-size="28" font-weight="700" fill="#243E40">의미적 관련성</text><text x="54" y="174" font-size="24" font-weight="500" fill="#243E40">추운 날 처음 돌 때 떨림</text><path d="M204 192 L204 229" fill="none" stroke="#597674" stroke-width="3" marker-end="url(#arrow)"/><text x="54" y="270" font-size="27" font-weight="700" fill="#243E40">저온 기동 진동</text><text x="54" y="320" font-size="25" font-weight="500" fill="#243E40">표현이 달라도 연결</text><text x="54" y="371" font-size="22" font-weight="500" fill="#243E40">다른 제품도 관련될 수 있음</text><text x="434" y="121" font-size="28" font-weight="700" fill="#243E40">대상의 동일성</text><text x="434" y="174" font-size="24" font-weight="500" fill="#243E40">질문 코드  AX-010-B</text><path d="M584 192 L584 229" fill="none" stroke="#597674" stroke-width="3" marker-end="url(#arrow)"/><text x="434" y="270" font-size="27" font-weight="700" fill="#243E40">적용 제품 ID 대조</text><text x="434" y="320" font-size="23" font-weight="500" fill="#243E40">AX-010-B  ≠  AX-010-8</text><text x="434" y="371" font-size="22" font-weight="500" fill="#243E40">전용 식별자 필드로 확인</text><text x="32" y="462" font-size="27" font-weight="700" fill="#914623">유사도는 제품번호 일치의 증명이 아닙니다</text></g></svg>
