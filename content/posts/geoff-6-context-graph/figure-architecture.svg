<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Context Graph 구축과 활용 흐름</title>
  <desc id="desc">업무 원천에서 이벤트를 포착하고 엔티티, 시간, 출처, 권한을 정리해 Context Graph를 만든 뒤 작은 Context를 사람과 에이전트에게 주고 실행 결과를 다시 기록하는 순환 구조다.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#DED8C8" stroke-width="1" opacity=".38"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#17212B" flood-opacity=".09"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#59636E"/>
    </marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#0F766E"/>
    </marker>
  </defs>

  <rect width="1200" height="675" rx="28" fill="#F7F4EC"/>
  <rect width="1200" height="675" rx="28" fill="url(#grid)"/>
  <rect x="48" y="36" width="150" height="32" rx="16" fill="#E8F3FF"/>
  <text x="123" y="58" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="15" font-weight="900" fill="#2563EB">IMPLEMENTATION</text>
  <text x="48" y="112" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="34" font-weight="900" fill="#17212B">Context Graph는 저장소보다 순환 구조가 중요합니다</text>
  <text x="48" y="146" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="18" fill="#66717D">업무에서 포착한 맥락을 다음 판단에 필요한 만큼만 되돌려 줍니다</text>

  <g stroke="#59636E" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M203 338H226M388 338H411M573 338H596M758 338H781M943 338H966"/>
  </g>

  <g font-family="Pretendard, 'Noto Sans KR', sans-serif" filter="url(#shadow)">
    <g>
      <rect x="40" y="214" width="164" height="248" rx="22" fill="#FFFFFF" stroke="#CBD2D9" stroke-width="2"/>
      <circle cx="72" cy="250" r="18" fill="#EEF1F4"/><text x="72" y="256" text-anchor="middle" font-size="16" font-weight="900" fill="#59636E">1</text>
      <text x="104" y="256" font-size="20" font-weight="900" fill="#17212B">업무 원천</text>
      <rect x="60" y="290" width="124" height="38" rx="10" fill="#E8F3FF"/><text x="122" y="315" text-anchor="middle" font-size="15" font-weight="800" fill="#2563EB">CRM · ERP</text>
      <rect x="60" y="339" width="124" height="38" rx="10" fill="#EEEAFE"/><text x="122" y="364" text-anchor="middle" font-size="15" font-weight="800" fill="#6D5BD0">티켓 · 메일</text>
      <rect x="60" y="388" width="124" height="38" rx="10" fill="#D9F3EC"/><text x="122" y="413" text-anchor="middle" font-size="15" font-weight="800" fill="#0F766E">코드 · 센서</text>
      <text x="122" y="446" text-anchor="middle" font-size="13" fill="#66717D">원문은 제자리에</text>
    </g>

    <g>
      <rect x="225" y="214" width="164" height="248" rx="22" fill="#FFFFFF" stroke="#E76F51" stroke-width="2"/>
      <circle cx="257" cy="250" r="18" fill="#FFF1E8"/><text x="257" y="256" text-anchor="middle" font-size="16" font-weight="900" fill="#B45336">2</text>
      <text x="289" y="256" font-size="20" font-weight="900" fill="#17212B">Capture</text>
      <circle cx="307" cy="333" r="46" fill="#FFF1E8" stroke="#E76F51" stroke-width="2"/>
      <path d="M307 308v26l17 12M295 304h24" fill="none" stroke="#E76F51" stroke-width="4" stroke-linecap="round"/>
      <text x="307" y="406" text-anchor="middle" font-size="15" font-weight="800" fill="#B45336">결정이 일어날 때</text>
      <text x="307" y="430" text-anchor="middle" font-size="13" fill="#66717D">조회·승인·변경 포착</text>
    </g>

    <g>
      <rect x="410" y="214" width="164" height="248" rx="22" fill="#FFFFFF" stroke="#B77900" stroke-width="2"/>
      <circle cx="442" cy="250" r="18" fill="#FFF7D6"/><text x="442" y="256" text-anchor="middle" font-size="16" font-weight="900" fill="#9A6500">3</text>
      <text x="474" y="256" font-size="20" font-weight="900" fill="#17212B">연결·정리</text>
      <g font-size="14" font-weight="800">
        <rect x="430" y="292" width="124" height="32" rx="16" fill="#FFF7D6"/><text x="492" y="314" text-anchor="middle" fill="#9A6500">같은 대상 찾기</text>
        <rect x="430" y="334" width="58" height="32" rx="16" fill="#EEF1F4"/><text x="459" y="356" text-anchor="middle" fill="#59636E">시간</text>
        <rect x="496" y="334" width="58" height="32" rx="16" fill="#EEF1F4"/><text x="525" y="356" text-anchor="middle" fill="#59636E">출처</text>
        <rect x="430" y="376" width="58" height="32" rx="16" fill="#EEF1F4"/><text x="459" y="398" text-anchor="middle" fill="#59636E">신뢰</text>
        <rect x="496" y="376" width="58" height="32" rx="16" fill="#EEF1F4"/><text x="525" y="398" text-anchor="middle" fill="#59636E">권한</text>
      </g>
      <text x="492" y="440" text-anchor="middle" font-size="13" fill="#66717D">추정과 사실을 구분</text>
    </g>

    <g>
      <rect x="595" y="198" width="164" height="280" rx="24" fill="#2563EB"/>
      <circle cx="627" cy="238" r="18" fill="#FFFFFF" opacity=".18"/><text x="627" y="244" text-anchor="middle" font-size="16" font-weight="900" fill="#FFFFFF">4</text>
      <text x="659" y="233" font-size="18" font-weight="900" fill="#FFFFFF">Context</text>
      <text x="659" y="255" font-size="18" font-weight="900" fill="#FFFFFF">Graph</text>
      <g stroke="#DDE9FF" stroke-width="2.5">
        <path d="M635 329L677 300L720 329L704 382L650 382Z"/>
        <path d="M677 300V353M635 329L677 353L720 329M650 382L677 353L704 382"/>
      </g>
      <g fill="#FFFFFF">
        <circle cx="635" cy="329" r="9"/><circle cx="677" cy="300" r="9"/><circle cx="720" cy="329" r="9"/>
        <circle cx="677" cy="353" r="12"/><circle cx="650" cy="382" r="9"/><circle cx="704" cy="382" r="9"/>
      </g>
      <text x="677" y="429" text-anchor="middle" font-size="14" font-weight="800" fill="#DDE9FF">현재 상태 + 이력</text>
      <text x="677" y="451" text-anchor="middle" font-size="13" fill="#DDE9FF">검색·재생 가능한 기억</text>
    </g>

    <g>
      <rect x="780" y="214" width="164" height="248" rx="22" fill="#FFFFFF" stroke="#6D5BD0" stroke-width="2"/>
      <circle cx="812" cy="250" r="18" fill="#EEEAFE"/><text x="812" y="256" text-anchor="middle" font-size="16" font-weight="900" fill="#6D5BD0">5</text>
      <text x="844" y="247" font-size="18" font-weight="900" fill="#17212B">작은</text>
      <text x="844" y="269" font-size="18" font-weight="900" fill="#17212B">Context</text>
      <rect x="802" y="296" width="120" height="126" rx="14" fill="#F7F5FE"/>
      <rect x="820" y="316" width="84" height="12" rx="6" fill="#6D5BD0" opacity=".85"/>
      <rect x="820" y="339" width="68" height="10" rx="5" fill="#9A90D9"/>
      <rect x="820" y="360" width="76" height="10" rx="5" fill="#9A90D9"/>
      <rect x="820" y="381" width="50" height="10" rx="5" fill="#9A90D9"/>
      <text x="862" y="447" text-anchor="middle" font-size="13" fill="#66717D">이번 판단의 근거만</text>
    </g>

    <g>
      <rect x="965" y="214" width="194" height="248" rx="22" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/>
      <circle cx="997" cy="250" r="18" fill="#D9F3EC"/><text x="997" y="256" text-anchor="middle" font-size="16" font-weight="900" fill="#0F766E">6</text>
      <text x="1029" y="256" font-size="20" font-weight="900" fill="#17212B">사람 · Agent</text>
      <circle cx="1018" cy="329" r="27" fill="#E8F3FF"/>
      <path d="M1004 341c5-16 23-16 28 0M1018 318a8 8 0 1 0 0-16 8 8 0 0 0 0 16" fill="none" stroke="#2563EB" stroke-width="2.5"/>
      <rect x="1064" y="302" width="66" height="54" rx="13" fill="#D9F3EC"/>
      <path d="M1080 328l9 9 21-23" fill="none" stroke="#0F766E" stroke-width="3" stroke-linecap="round"/>
      <text x="1062" y="391" text-anchor="middle" font-size="15" font-weight="800" fill="#0F766E">정책 확인 → 승인 → 실행</text>
      <text x="1062" y="424" text-anchor="middle" font-size="13" fill="#66717D">권한 안에서만 행동</text>
    </g>
  </g>

  <path d="M1062 480V538H677V489" fill="none" stroke="#0F766E" stroke-width="4" marker-end="url(#arrowTeal)"/>
  <rect x="795" y="518" width="215" height="42" rx="21" fill="#D9F3EC"/>
  <text x="902" y="545" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="16" font-weight="900" fill="#0F766E">실행 기록 · 결과 · 사람의 수정</text>
  <text x="600" y="619" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="18" font-weight="800" fill="#17212B">Graph DB 하나로 모든 시스템을 옮기는 일이 아닙니다. 연결과 되먹임을 설계하는 일입니다.</text>
</svg>
