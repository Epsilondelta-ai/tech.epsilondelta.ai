<svg xmlns="http://www.w3.org/2000/svg" width="800" height="560" viewBox="0 0 800 560"><title>화면 캡처, 모델 판단, 실행과 재관찰의 반복</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#28777b"/></marker></defs><rect width="800" height="560" fill="#f8f5ed"/><g font-family="Noto Sans CJK KR, sans-serif"><text x="32" y="54" font-size="30" fill="#173d43" font-weight="700">화면을 다시 보며 다음 행동을 고릅니다</text><rect x="32" y="100" width="200" height="160" rx="14" fill="#ffffff" stroke="#8cb1af" stroke-width="2"/><text x="50" y="143" font-size="26" fill="#173d43" font-weight="700">화면 캡처</text><text x="50" y="191" font-size="21" fill="#173d43" font-weight="400">현재 상태를</text><text x="50" y="225" font-size="21" fill="#173d43" font-weight="400">이미지로 전달</text><rect x="300" y="100" width="200" height="160" rx="14" fill="#ffffff" stroke="#8cb1af" stroke-width="2"/><text x="318" y="143" font-size="26" fill="#173d43" font-weight="700">모델 판단</text><text x="318" y="191" font-size="21" fill="#173d43" font-weight="400">화면을 해석해</text><text x="318" y="225" font-size="21" fill="#173d43" font-weight="400">다음 행동 선택</text><rect x="568" y="100" width="200" height="160" rx="14" fill="#ffffff" stroke="#8cb1af" stroke-width="2"/><text x="586" y="143" font-size="26" fill="#173d43" font-weight="700">실행기 조작</text><text x="586" y="191" font-size="21" fill="#173d43" font-weight="400">마우스·키보드로</text><text x="586" y="225" font-size="21" fill="#173d43" font-weight="400">선택한 행동 실행</text><path d="M234 180 L290 180" stroke="#28777b" stroke-width="3" marker-end="url(#arrow)" fill="none"/><path d="M502 180 L558 180" stroke="#28777b" stroke-width="3" marker-end="url(#arrow)" fill="none"/><path d="M668 270 V322 H132 V270" stroke="#28777b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="259" y="306" font-size="23" fill="#173d43" font-weight="700">바뀐 화면을 다시 캡처</text><rect x="32" y="365" width="736" height="145" rx="14" fill="#e7efeb" stroke="#8cb1af" stroke-width="2"/><text x="56" y="407" font-size="27" fill="#173d43" font-weight="700">대상 프로그램의 API가 없어도</text><text x="56" y="448" font-size="25" fill="#173d43" font-weight="400">화면과 입력 장치를 연결 경로로 사용합니다</text><text x="56" y="483" font-size="22" fill="#173d43" font-weight="400">실행 권한과 업무 규칙은 회사가 정합니다</text></g></svg>