<svg xmlns="http://www.w3.org/2000/svg" width="800" height="570" viewBox="0 0 800 570"><title>API, RPA, 컴퓨터 사용의 연결과 검증 차이</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#28777b"/></marker></defs><rect width="800" height="570" fill="#f8f5ed"/><g font-family="Noto Sans CJK KR, sans-serif"><text x="32" y="52" font-size="29" fill="#173d43" font-weight="700">세 방식의 차이는 연결 경로와 판단 방식</text><rect x="32" y="85" width="736" height="108" rx="14" fill="#ffffff" stroke="#8cb1af" stroke-width="2"/><text x="52" y="121" font-size="26" fill="#173d43" font-weight="700">API 연동</text><text x="235" y="121" font-size="23" fill="#173d43" font-weight="400">정해진 요청과 구조화된 응답</text><text x="235" y="162" font-size="21" fill="#42636a" font-weight="400">규격·인증·재시도·업무 완료 확인</text><rect x="32" y="210" width="736" height="108" rx="14" fill="#ffffff" stroke="#8cb1af" stroke-width="2"/><text x="52" y="246" font-size="26" fill="#173d43" font-weight="700">기존 RPA</text><text x="235" y="246" font-size="23" fill="#173d43" font-weight="400">UI 요소·선택자와 사전 정의 절차</text><text x="235" y="287" font-size="21" fill="#42636a" font-weight="400">분기·대기·예외 처리 유지</text><rect x="32" y="335" width="736" height="108" rx="14" fill="#ffffff" stroke="#8cb1af" stroke-width="2"/><text x="52" y="371" font-size="26" fill="#173d43" font-weight="700">컴퓨터 사용</text><text x="235" y="371" font-size="23" fill="#173d43" font-weight="400">현재 화면 해석과 다음 행동 선택</text><text x="235" y="412" font-size="21" fill="#42636a" font-weight="400">관찰 오류·판단 편차·결과 확인</text><rect x="32" y="480" width="736" height="64" rx="14" fill="#e7efeb" stroke="#8cb1af" stroke-width="2"/><text x="56" y="521" font-size="25" fill="#173d43" font-weight="700">업무 구간에 맞춰 연결하고, 결과를 검증합니다</text></g></svg>