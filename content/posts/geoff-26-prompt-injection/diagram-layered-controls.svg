<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img"><title>입력 탐지와 실행 통제는 서로 다른 역할을 합니다</title><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#297D75"/></marker></defs><rect width="800" height="450" rx="18" fill="#FAF8F2"/><g font-family="Apple SD Gothic Neo,Noto Sans KR,sans-serif"><text x="30" y="45" font-size="27" fill="#193D40">입력 탐지와 실행 통제는 서로 다른 역할을 합니다</text><rect x="30" y="90" width="740" height="56" rx="12" fill="white" stroke="#D6E3DB"/><text x="50" y="125" font-size="21" fill="#193D40">입력·컨텍스트</text><text x="295" y="125" font-size="20" fill="#193D40">출처 구분 · 의심 지시 탐지</text><path d="M400 148L400 159" fill="none" stroke="#297D75" stroke-width="3" marker-end="url(#a)"/><rect x="30" y="163" width="740" height="56" rx="12" fill="#EAF3EF" stroke="#D6E3DB"/><text x="50" y="198" font-size="21" fill="#193D40">도구 호출 검사</text><text x="295" y="198" font-size="20" fill="#193D40">사용자·대상·필드 권한 검사</text><path d="M400 221L400 232" fill="none" stroke="#297D75" stroke-width="3" marker-end="url(#a)"/><rect x="30" y="236" width="740" height="56" rx="12" fill="white" stroke="#D6E3DB"/><text x="50" y="271" font-size="21" fill="#193D40">외부 전송·출력</text><text x="295" y="271" font-size="20" fill="#193D40">수신처·첨부·이미지 요청 통제</text><path d="M400 294L400 305" fill="none" stroke="#297D75" stroke-width="3" marker-end="url(#a)"/><rect x="30" y="309" width="740" height="56" rx="12" fill="#EAF3EF" stroke="#D6E3DB"/><text x="50" y="344" font-size="21" fill="#193D40">사람 승인</text><text x="295" y="344" font-size="20" fill="#193D40">실제 실행할 내용을 확인</text><text x="30" y="423" font-size="19" fill="#193D40">모델이 잘못 제안하더라도, 허용하지 않은 실행은 시스템에서 차단</text></g></svg>
