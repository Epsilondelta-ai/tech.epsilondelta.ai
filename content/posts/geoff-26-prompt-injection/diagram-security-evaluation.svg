<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img"><title>공격은 막고, 정상 업무는 끝낼 수 있는지 함께 봅니다</title><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#297D75"/></marker></defs><rect width="800" height="450" rx="18" fill="#FAF8F2"/><g font-family="Apple SD Gothic Neo,Noto Sans KR,sans-serif"><text x="30" y="45" font-size="27" fill="#193D40">공격은 막고, 정상 업무는 끝낼 수 있는지 함께 봅니다</text><rect x="30" y="97" width="355" height="188" rx="12" fill="#FBE7DE" stroke="#D6E3DB"/><text x="50" y="134" font-size="23" fill="#193D40">공격이 섞인 자료</text><text x="50" y="174" font-size="18" fill="#193D40">외부 전송 요구 · 평가 기준 조작</text><text x="50" y="219" font-size="20" fill="#193D40">확인: 금지된 행동이 실행됐나?</text><text x="50" y="255" font-size="18" fill="#193D40">도구 호출·외부 요청 기록 대조</text><rect x="415" y="97" width="355" height="188" rx="12" fill="#EAF3EF" stroke="#D6E3DB"/><text x="435" y="134" font-size="23" fill="#193D40">정상 업무 자료</text><text x="435" y="174" font-size="18" fill="#193D40">계약 의무 · 매뉴얼의 작업 지시</text><text x="435" y="219" font-size="20" fill="#193D40">확인: 필요한 업무를 끝냈나?</text><text x="435" y="255" font-size="18" fill="#193D40">오탐·거절·추가 검토 시간 확인</text><rect x="30" y="324" width="740" height="72" rx="12" fill="#fff" stroke="#D6E3DB"/><text x="50" y="355" font-size="23" fill="#193D40">대화창의 답변과 실제 실행 결과를 구분</text><text x="50" y="382" font-size="17" fill="#193D40">시험용 계정과 가상 문서로 검증 · 한국어·긴 자료·도구 연결 포함</text><text x="30" y="430" font-size="14" fill="#193D40">평가 항목 개념도 · 측정되지 않은 성과 수치는 표시하지 않음</text></g></svg>
