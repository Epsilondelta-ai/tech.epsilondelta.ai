<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" role="img" aria-labelledby="title desc"><title id="title">Blount의 예측 오차와 완제품 폐기 변화</title><desc id="desc">각 지표의 개선 전 값을 100으로 둔 지수. 공급사 발표의 폐기 35% 감소는 65, 2년에 걸친 예측 오차 50% 감소는 50으로 표시. 실제 수량이 아니며 두 지표의 단위와 측정 기간은 서로 다를 수 있다.</desc><rect width="800" height="400" rx="20" fill="#faf7f0"/><g font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" fill="#183b3b"><text x="32" y="44" font-size="25" font-weight="700">예측 오차와 폐기를 각각 줄였습니다</text><text x="32" y="76" font-size="15">Blount · RELEX 2025년 발표 / 각 지표의 개선 전 = 100인 지수</text><text x="32" y="146" font-size="20">완제품 폐기</text><rect x="220" y="108" width="400" height="26" rx="5" fill="#c5d5d1"/><text x="639" y="128" font-size="18">100</text><rect x="220" y="146" width="260" height="26" rx="5" fill="#518c86"/><text x="497" y="166" font-size="18">65 · 35% 감소</text><text x="32" y="252" font-size="20">예측 오차</text><rect x="220" y="214" width="400" height="26" rx="5" fill="#c5d5d1"/><text x="639" y="234" font-size="18">100</text><rect x="220" y="252" width="200" height="26" rx="5" fill="#d88e6e"/><text x="438" y="272" font-size="18">50 · 2년에 걸쳐 50% 감소</text><rect x="32" y="322" width="20" height="14" rx="3" fill="#c5d5d1"/><text x="64" y="335" font-size="15">개선 전</text><text x="32" y="372" font-size="14">발표된 감소율을 시각화한 지수이며 실제 폐기량·오차 수치는 아닙니다.</text></g></svg>
