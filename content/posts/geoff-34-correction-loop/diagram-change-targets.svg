<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480"><title>교정의 변경 대상과 책임 구분</title><rect width="800" height="480" rx="20" fill="#FAF7F0"/><g font-family="Noto Sans CJK KR, sans-serif"><text x="28" y="43" font-size="28" font-weight="700" fill="#243E40">수정할 대상부터 구분합니다</text><rect x="28" y="64" width="744" height="68" rx="12" fill="#E8EFEB"/><text x="44" y="92" font-size="23" font-weight="700" fill="#243E40">답변 편집</text><text x="44" y="119" font-size="20" font-weight="400" fill="#243E40">해당 답변·사건만</text><text x="420" y="106" font-size="21" font-weight="400" fill="#243E40">응답 담당자</text><rect x="28" y="142" width="744" height="68" rx="12" fill="#F4E7DA"/><text x="44" y="170" font-size="23" font-weight="700" fill="#243E40">원천·지식 정정</text><text x="44" y="197" font-size="20" font-weight="400" fill="#243E40">공식 원문·검색 색인</text><text x="420" y="184" font-size="21" font-weight="400" fill="#243E40">문서·데이터 소유자</text><rect x="28" y="220" width="744" height="68" rx="12" fill="#E8EFEB"/><text x="44" y="248" font-size="23" font-weight="700" fill="#243E40">범위 있는 규칙</text><text x="44" y="275" font-size="20" font-weight="400" fill="#243E40">조건·예외·시행·만료</text><text x="420" y="262" font-size="21" font-weight="400" fill="#243E40">정책 소유자·배포 책임자</text><rect x="28" y="298" width="744" height="68" rx="12" fill="#F4E7DA"/><text x="44" y="326" font-size="23" font-weight="700" fill="#243E40">모델 가중치 훈련</text><text x="44" y="353" font-size="20" font-weight="400" fill="#243E40">승인 학습셋·새 모델·평가</text><text x="420" y="340" font-size="21" font-weight="400" fill="#243E40">모델 책임자·데이터 승인자</text><text x="30" y="408" font-size="22" font-weight="700" fill="#243E40">검색·도구 실패 → 원문 정정 대신 별도 버그 수정</text><text x="30" y="449" font-size="21" font-weight="400" fill="#243E40">답변 수정만으로 모델 가중치가 즉시 바뀌지는 않습니다</text></g></svg>
