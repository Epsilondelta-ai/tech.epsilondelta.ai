<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-labelledby="title"><title id="title">배포 결정 전 다섯 가지 확인 질문</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#a35b3d"/></marker></defs><rect width="800" height="500" rx="18" fill="#f7f2e8"/><g font-family="Noto Sans CJK KR, sans-serif"><text x="30" y="48" font-size="32" fill="#203d40">어디까지 운영 책임을 맡을까요?</text><rect x="30" y="75" width="740" height="58" rx="14" fill="#e0ebe7"/><text x="50" y="114.0" font-size="27" fill="#203d40">업무 데이터로 모델·양자화 품질 검증</text><rect x="30" y="145" width="740" height="58" rx="14" fill="#eee1ca"/><text x="50" y="184.0" font-size="27" fill="#203d40">평시·피크의 문서 길이와 대기 측정</text><rect x="30" y="215" width="740" height="58" rx="14" fill="#e0ebe7"/><text x="50" y="254.0" font-size="27" fill="#203d40">유휴·예비 용량과 운영 시간까지 비교</text><rect x="30" y="285" width="740" height="58" rx="14" fill="#eee1ca"/><text x="50" y="324.0" font-size="27" fill="#203d40">검색·로그·백업의 데이터 권한 확인</text><rect x="30" y="355" width="740" height="58" rx="14" fill="#e0ebe7"/><text x="50" y="394.0" font-size="27" fill="#203d40">라이선스·업그레이드·당직·복구 담당 지정</text><text x="35" y="470" font-size="27" fill="#203d40">업무별 배포 조합 + 공통 관문의 일관된 통제</text></g></svg>