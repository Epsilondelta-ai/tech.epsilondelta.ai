<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-labelledby="title desc" style="max-width:100%;height:auto">
<title id="title">먼저 실제 입력을 확인합니다</title><desc id="desc">실제 모델 입력 로그에서 근거 누락, 추출 손상과 구버전 여부를 확인합니다. 근거가 온전한 경우 질문과 정답 근거를 고정하고 주변 자료의 양과 배치를 통제해 반복 비교합니다. 근거의 존재나 한 번의 성공만으로 Context Rot를 확정하지 않습니다.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#597674" stroke-width="1.5"/></marker></defs>
<rect width="800" height="500" rx="20" fill="#FAF7F0"/>
<g font-family="'Noto Sans CJK KR','Noto Sans KR','Malgun Gothic',sans-serif"><text x="32" y="49" font-size="32" font-weight="700" fill="#243E40">먼저 실제 입력을 확인합니다</text><text x="32" y="91" font-size="27" font-weight="500" fill="#243E40">모델에 전달된 입력 로그에서 정답 근거 대조</text><rect x="32" y="114" width="736" height="60" rx="14" fill="#E8EFEB"/><text x="52" y="153" font-size="27" font-weight="700" fill="#243E40">근거 누락</text><path d="M226 144 L278 144" fill="none" stroke="#597674" stroke-width="3" marker-end="url(#arrow)"/><text x="300" y="153" font-size="27" font-weight="500" fill="#243E40">검색·전달 단계 점검</text><rect x="32" y="186" width="736" height="60" rx="14" fill="#F4E7DA"/><text x="52" y="225" font-size="27" font-weight="700" fill="#243E40">손상·구버전</text><path d="M226 216 L278 216" fill="none" stroke="#597674" stroke-width="3" marker-end="url(#arrow)"/><text x="300" y="225" font-size="27" font-weight="500" fill="#243E40">추출·원본 버전 점검</text><rect x="32" y="258" width="736" height="60" rx="14" fill="#E8EFEB"/><text x="52" y="297" font-size="27" font-weight="700" fill="#243E40">근거 온전</text><path d="M226 288 L278 288" fill="none" stroke="#597674" stroke-width="3" marker-end="url(#arrow)"/><text x="300" y="297" font-size="27" font-weight="500" fill="#243E40">문맥 활용 문제 조사</text><rect x="32" y="334" width="736" height="94" rx="14" fill="#DCE8E3"/><text x="52" y="371" font-size="27" font-weight="700" fill="#243E40">질문·정답 근거 고정 → 주변 양·배치 통제</text><text x="52" y="408" font-size="27" font-weight="500" fill="#243E40">여러 번 실행해 비교</text><text x="32" y="472" font-size="26" font-weight="700" fill="#914623">근거 존재·한 번의 성공만으로 원인 확정 불가</text></g></svg>