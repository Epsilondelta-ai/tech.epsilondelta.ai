<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-labelledby="title desc" style="max-width:100%;height:auto">
<title id="title">같은 업무 질문으로 세 구성을 비교</title><desc id="desc">넓은 원문 입력, 필요한 구간 선별, 요약과 원문 재조회를 같은 질문 세트와 합격 기준으로 반복 비교합니다. 예외 조건과 정확한 수치, 출처를 지키는지 확인하고 API 및 재조회 비용과 사람의 검수·재작업 비용을 함께 평가합니다. 수치나 우승 방식은 제시하지 않는 개념도입니다.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#597674" stroke-width="1.5"/></marker></defs>
<rect width="800" height="500" rx="20" fill="#FAF7F0"/>
<g font-family="'Noto Sans CJK KR','Noto Sans KR','Malgun Gothic',sans-serif"><text x="32" y="49" font-size="32" font-weight="700" fill="#243E40">같은 업무 질문으로 세 구성을 비교</text><rect x="32" y="78" width="232" height="96" rx="14" fill="#E8EFEB"/><rect x="284" y="78" width="232" height="96" rx="14" fill="#E8EFEB"/><rect x="536" y="78" width="232" height="96" rx="14" fill="#E8EFEB"/><text x="52" y="117" font-size="28" font-weight="700" fill="#243E40">넓은 원문</text><text x="52" y="153" font-size="27" font-weight="500" fill="#243E40">입력</text><text x="304" y="117" font-size="28" font-weight="700" fill="#243E40">필요 구간</text><text x="304" y="153" font-size="27" font-weight="500" fill="#243E40">선별</text><text x="556" y="117" font-size="28" font-weight="700" fill="#243E40">요약 +</text><text x="556" y="153" font-size="27" font-weight="500" fill="#243E40">원문 재조회</text><path d="M148 181 L148 207" fill="none" stroke="#597674" stroke-width="3" marker-end="url(#arrow)"/><path d="M400 181 L400 207" fill="none" stroke="#597674" stroke-width="3" marker-end="url(#arrow)"/><path d="M652 181 L652 207" fill="none" stroke="#597674" stroke-width="3" marker-end="url(#arrow)"/><rect x="32" y="217" width="736" height="90" rx="14" fill="#DCE8E3"/><text x="52" y="254" font-size="28" font-weight="700" fill="#243E40">동일한 질문·합격 기준으로 반복 실행</text><text x="52" y="290" font-size="26" font-weight="500" fill="#243E40">예외 조건 · 정확한 금액·기간 · 근거 출처</text><path d="M400 313 L400 337" fill="none" stroke="#597674" stroke-width="3" marker-end="url(#arrow)"/><rect x="32" y="348" width="736" height="90" rx="14" fill="#F4E7DA"/><text x="52" y="383" font-size="28" font-weight="700" fill="#243E40">품질과 총비용을 함께 판단</text><text x="52" y="420" font-size="26" font-weight="500" fill="#243E40">API·재조회 비용 + 사람의 검수·재작업 비용</text><text x="32" y="478" font-size="26" font-weight="700" fill="#914623">우열은 우리 업무 데이터로 확인</text></g></svg>