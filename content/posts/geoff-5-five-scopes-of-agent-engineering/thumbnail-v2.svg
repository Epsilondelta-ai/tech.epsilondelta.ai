<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024" role="img" aria-labelledby="title desc">
  <title id="title">AI 에이전트 엔지니어링의 다섯 범위</title>
  <desc id="desc">프롬프트, 컨텍스트, 루프, 그래프, 하네스가 중앙의 AI 모델과 연결된 다섯 범위임을 보여주는 블로그 썸네일</desc>
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#DCD7CB" stroke-width="1.4" opacity="0.42"/>
    </pattern>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#17212B" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#76818C"/>
    </marker>
  </defs>

  <rect width="1536" height="1024" fill="#F7F4EC"/>
  <rect width="1536" height="1024" fill="url(#grid)"/>
  <circle cx="1420" cy="80" r="220" fill="#D9F3EC" opacity="0.75"/>
  <circle cx="20" cy="980" r="260" fill="#E8F3FF" opacity="0.65"/>

  <rect x="82" y="82" width="280" height="50" rx="25" fill="#17212B"/>
  <text x="222" y="116" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" font-size="22" font-weight="800" letter-spacing="1.5" fill="#FFFFFF">AI AGENT ENGINEERING</text>

  <text x="82" y="246" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" font-size="84" font-weight="900" letter-spacing="-3" fill="#17212B">프롬프트만 잘 쓰면</text>
  <text x="82" y="350" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" font-size="92" font-weight="900" letter-spacing="-3.5" fill="#17212B">끝인 줄 알았다</text>
  <rect x="84" y="398" width="470" height="8" rx="4" fill="#0F766E"/>
  <text x="82" y="466" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" font-size="34" font-weight="700" fill="#52606D">AI 에이전트를 움직이는 다섯 가지 통제 범위</text>

  <g font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif">
    <rect x="82" y="574" width="520" height="194" rx="28" fill="#FFFFFF" filter="url(#shadow)"/>
    <text x="118" y="630" font-size="22" font-weight="800" fill="#0F766E">이 글에서 답할 질문</text>
    <text x="118" y="684" font-size="29" font-weight="750" fill="#17212B">무엇을 시키고, 무엇을 보여주며,</text>
    <text x="118" y="728" font-size="29" font-weight="750" fill="#17212B">어떻게 반복하고, 연결하고, 통제할까?</text>
  </g>

  <g opacity="0.95">
    <path d="M1038 496L865 326M1075 462L1254 314M1105 505L1332 504M1080 548L1232 714M1028 552L840 724" fill="none" stroke="#76818C" stroke-width="5" stroke-dasharray="10 12"/>
  </g>

  <g filter="url(#shadow)" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif">
    <circle cx="1060" cy="518" r="126" fill="#FFFFFF" stroke="#17212B" stroke-width="5"/>
    <circle cx="1060" cy="518" r="82" fill="#0F766E"/>
    <path d="M1028 520l22 22 47-55" fill="none" stroke="#D9F3EC" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1060" y="680" text-anchor="middle" font-size="30" font-weight="900" fill="#17212B">AI MODEL</text>
  </g>

  <g filter="url(#shadow)" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif">
    <rect x="700" y="202" width="274" height="142" rx="28" fill="#FFFFFF" stroke="#E76F51" stroke-width="4"/>
    <circle cx="752" cy="254" r="26" fill="#FFF1E8"/>
    <path d="M741 245h22v17h-13l-8 7v-7h-1z" fill="none" stroke="#E76F51" stroke-width="3" stroke-linejoin="round"/>
    <text x="790" y="263" font-size="34" font-weight="900" fill="#A8462E">PROMPT</text>
    <text x="752" y="314" font-size="23" font-weight="700" fill="#52606D">무엇을 시킬까</text>

    <rect x="1190" y="190" width="282" height="142" rx="28" fill="#FFFFFF" stroke="#2563EB" stroke-width="4"/>
    <circle cx="1242" cy="242" r="26" fill="#E8F3FF"/>
    <rect x="1231" y="229" width="20" height="26" rx="3" fill="none" stroke="#2563EB" stroke-width="3"/><path d="M1236 236h10M1236 243h10M1236 250h7" stroke="#2563EB" stroke-width="2"/>
    <text x="1280" y="251" font-size="32" font-weight="900" fill="#174EA6">CONTEXT</text>
    <text x="1242" y="302" font-size="23" font-weight="700" fill="#52606D">무엇을 보여줄까</text>

    <rect x="1240" y="432" width="250" height="142" rx="28" fill="#FFFFFF" stroke="#D89B12" stroke-width="4"/>
    <circle cx="1292" cy="484" r="26" fill="#FFF7D6"/>
    <path d="M1279 486a14 14 0 1 1 8 12" fill="none" stroke="#D89B12" stroke-width="3.5" marker-end="url(#arrow)"/>
    <text x="1330" y="493" font-size="34" font-weight="900" fill="#9A6500">LOOP</text>
    <text x="1292" y="544" font-size="23" font-weight="700" fill="#52606D">어떻게 반복할까</text>

    <rect x="1154" y="704" width="286" height="142" rx="28" fill="#FFFFFF" stroke="#6D4BB3" stroke-width="4"/>
    <circle cx="1206" cy="756" r="26" fill="#F1E9FF"/>
    <circle cx="1194" cy="750" r="4.5" fill="#6D4BB3"/><circle cx="1218" cy="743" r="4.5" fill="#6D4BB3"/><circle cx="1219" cy="768" r="4.5" fill="#6D4BB3"/><path d="M1198 749l16-5M1197 753l18 13M1218 748v15" stroke="#6D4BB3" stroke-width="3"/>
    <text x="1244" y="765" font-size="34" font-weight="900" fill="#5B3D96">GRAPH</text>
    <text x="1206" y="816" font-size="23" font-weight="700" fill="#52606D">어떻게 연결할까</text>

    <rect x="660" y="716" width="298" height="142" rx="28" fill="#FFFFFF" stroke="#0F766E" stroke-width="4"/>
    <circle cx="712" cy="768" r="26" fill="#D9F3EC"/>
    <path d="M712 748l16 7v12c0 12-7 20-16 25-9-5-16-13-16-25v-12z" fill="none" stroke="#0F766E" stroke-width="3.5" stroke-linejoin="round"/>
    <text x="750" y="777" font-size="33" font-weight="900" fill="#0F665F">HARNESS</text>
    <text x="712" y="828" font-size="23" font-weight="700" fill="#52606D">어디까지 통제할까</text>
  </g>

  <text x="1452" y="950" text-anchor="end" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" font-size="22" font-weight="800" letter-spacing="0.6" fill="#0F766E">EPSILON DELTA TECH BLOG</text>
</svg>
