<svg xmlns="http://www.w3.org/2000/svg" width="800" height="460" viewBox="0 0 800 460" role="img" aria-label="음성을 듣고 답하는 두 가지 구성"><rect width="800" height="460" rx="24" fill="#faf7ef"/><style>text{font-family:'Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#193b43}.h{font-size:27px;font-weight:700}.t{font-size:21px}.s{font-size:17px}.n{font-size:30px;font-weight:700}</style><text class="h" x="32" y="49">음성을 듣고 답하는 두 가지 구성</text><rect x="32" y="86" width="736" height="132" rx="15" fill="white"/><text class="h" x="52" y="121">단계별 구성</text><text class="t" x="53" y="170">음성 → STT → 언어 모델·도구 → TTS → 음성</text><text class="s" x="53" y="199">음성 인식·판단·합성을 나누어 구성</text><rect x="32" y="238" width="736" height="132" rx="15" fill="#e1eee8"/><text class="h" x="52" y="273">실시간 음성 모델</text><text class="t" x="53" y="322">음성 → 실시간 모델·도구 → 음성</text><text class="s" x="53" y="351">대화 중단·재생 기록·실행 상태를 함께 관리</text><text class="s" x="32" y="420">두 방식 모두 전화 연결·본인 확인·업무 권한은 별도 구성</text></svg>
