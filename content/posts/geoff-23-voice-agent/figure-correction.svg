<svg xmlns="http://www.w3.org/2000/svg" width="800" height="460" viewBox="0 0 800 460" role="img" aria-label="정정된 요청을 확인한 뒤 실행합니다"><rect width="800" height="460" rx="24" fill="#faf7ef"/><style>text{font-family:'Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#193b43}.h{font-size:27px;font-weight:700}.t{font-size:21px}.s{font-size:17px}.n{font-size:30px;font-weight:700}</style><text class="h" x="32" y="49">정정된 요청을 확인한 뒤 실행합니다</text><rect x="32" y="85" width="736" height="80" rx="15" fill="white"/><text class="t" x="53" y="120">고객: “금요일 오후 세 시로… 아니요, 네 시로요.”</text><text class="s" x="53" y="148">가상 예약 변경 예시</text><rect x="32" y="197" width="220" height="137" rx="15" fill="#e1eee8"/><text class="h" x="52" y="236">요청 갱신</text><text class="t" x="52" y="280">세 시 → 네 시</text><text class="s" x="52" y="309">날짜·시간·대상 관리</text><text class="t" x="263" y="270">→</text><rect x="290" y="197" width="230" height="137" rx="15" fill="#e1eee8"/><text class="h" x="310" y="236">최종 조건 확인</text><text class="t" x="310" y="280">금요일 오후 네 시?</text><text class="s" x="310" y="309">고객 동의 확인</text><text class="t" x="530" y="270">→</text><rect x="558" y="197" width="210" height="137" rx="15" fill="#f4e1d7"/><text class="h" x="578" y="236">변경 실행</text><text class="t" x="578" y="280">예약 도구 호출</text><text class="s" x="578" y="309">처리 결과 확인</text><text class="s" x="32" y="410">잠깐의 침묵이나 맞장구를 실행 동의로 취급하지 않습니다.</text></svg>
