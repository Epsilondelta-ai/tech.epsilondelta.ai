<svg xmlns="http://www.w3.org/2000/svg" width="720" height="468" viewBox="0 0 720 468" role="img" aria-labelledby="title desc" xml:lang="ko">
  <title id="title">제작 방식마다 달라지는 제품 입력</title>
  <desc id="desc">자유 생성은 텍스트, 참조 생성은 윤곽과 깊이, 사진 합성은 승인 사진, 3D 합성은 검증한 형상·재질·라벨을 제품 입력으로 삼습니다.</desc>
  <rect width="720" height="468" rx="20" fill="#f5f1e8"/>
  <g font-family="'Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" fill="#172e2a">
    <text x="30" y="51" font-size="36" font-weight="700">제작 방식마다 달라지는 제품 입력</text>
    <g fill="#fffcf6">
      <rect x="26" y="75" width="668" height="88" rx="12"/>
      <rect x="26" y="168" width="668" height="88" rx="12"/>
      <rect x="26" y="261" width="668" height="88" rx="12"/>
    </g>
    <rect x="26" y="354" width="668" height="88" rx="12" fill="#dcede3"/>
    <path d="M301 91v56m0 37v56m0 37v56m0 37v56" stroke="#b6c9bf" stroke-width="2"/>
    <g font-size="32" font-weight="700">
      <text x="48" y="130">자유 생성</text>
      <text x="48" y="223">참조 기반 생성</text>
      <text x="48" y="316">제품 사진 합성</text>
      <text x="48" y="409">3D 자산 합성</text>
    </g>
    <g font-size="31" font-weight="700">
      <text x="328" y="113">텍스트 지시</text>
      <text x="328" y="206">참조 윤곽·깊이</text>
      <text x="328" y="299">승인된 제품 사진</text>
      <text x="328" y="392">검증한 형상·재질·라벨</text>
    </g>
    <g font-size="28" fill="#36574e">
      <text x="328" y="147">제품과 배경 모두 생성</text>
      <text x="328" y="240">비슷한 구도로 제품 생성</text>
      <text x="328" y="333">촬영 각도 유지</text>
      <text x="328" y="426">제품 배치·카메라 각도 조절</text>
    </g>
  </g>
</svg>
