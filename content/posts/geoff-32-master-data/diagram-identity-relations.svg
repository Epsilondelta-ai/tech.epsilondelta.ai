<svg xmlns="http://www.w3.org/2000/svg" width="800" height="625" viewBox="0 0 800 625"><title>동일성과 별개 대상의 관계 구분</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#597674" stroke-width="1.5"/></marker></defs><rect width="800" height="625" rx="20" fill="#FAF7F0"/><g fill="#243E40" font-family="Noto Sans CJK KR, sans-serif"><text x="30" y="48" font-size="30" font-weight="700">별칭은 확인하고, 관계는 구분합니다</text><rect x="30" y="75" width="740" height="150" rx="12" fill="#E8EFEB"/><text x="50" y="111" font-size="24" font-weight="700">동일성 확인 후 연결</text><text x="50" y="155" font-size="25" font-weight="500">가온테크㈜  ·  GAON TECH</text><path d="M410 149 L470 149" stroke="#597674" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="495" y="155" font-size="25" font-weight="700">법인 ORG-0042</text><text x="50" y="199" font-size="22" font-weight="500">이름만이 아니라 식별 번호·계약 근거로 확인</text><rect x="30" y="249" width="740" height="303" rx="12" fill="#F4E7DA"/><text x="50" y="286" font-size="24" font-weight="700">아래는 관계 연결 — 하나로 병합하지 않음</text><rect x="50" y="316" width="260" height="64" rx="12" fill="#FFFFFF"/><text x="70" y="357" font-size="25" font-weight="700">가온테크 · 법인</text><path d="M315 348 H330 V346 H482" stroke="#597674" stroke-width="3" stroke-dasharray="7 5" fill="none" marker-end="url(#arrow)"/><text x="350" y="335" font-size="19" font-weight="500">소유·지배</text><rect x="493" y="319" width="258" height="55" rx="12" fill="#FFFFFF"/><text x="506" y="354" font-size="21" font-weight="500">가온서비스 · 별도 법인</text><path d="M315 348 H330 V427 H482" stroke="#597674" stroke-width="3" stroke-dasharray="7 5" fill="none" marker-end="url(#arrow)"/><text x="350" y="416" font-size="19" font-weight="500">사업장</text><rect x="493" y="400" width="258" height="55" rx="12" fill="#FFFFFF"/><text x="506" y="435" font-size="21" font-weight="500">부산공장 · 현장 단위</text><path d="M315 348 H330 V508 H482" stroke="#597674" stroke-width="3" stroke-dasharray="7 5" fill="none" marker-end="url(#arrow)"/><text x="350" y="497" font-size="19" font-weight="500">소속</text><rect x="493" y="481" width="258" height="55" rx="12" fill="#FFFFFF"/><text x="506" y="516" font-size="21" font-weight="500">김민수 · 담당자</text><text x="30" y="595" font-size="23" font-weight="700">같은 주소·전화번호만으로 동일성을 확정할 수 없습니다</text></g></svg>