<svg xmlns="http://www.w3.org/2000/svg" width="800" height="460" viewBox="0 0 800 460" role="img" aria-labelledby="title desc"><title id="title">비슷한 기록과 같은 설비는 다릅니다</title><desc id="desc">의미 검색의 결과에 자산 연결의 근거를 더합니다</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#176d70"/></marker></defs><rect width="800" height="460" rx="18" fill="#faf7f0"/><g font-family="Noto Sans CJK KR, Noto Sans CJK JP, sans-serif"><text x="32" y="48" fill="#193449" font-size="29" font-weight="700">비슷한 기록과 같은 설비는 다릅니다</text><text x="32" y="82" fill="#526471" font-size="18" font-weight="400">의미 검색의 결과에 자산 연결의 근거를 더합니다</text><rect x="32" y="110" width="350" height="260" rx="14" fill="#ffffff" stroke="#d8dedc"/><rect x="418" y="110" width="350" height="260" rx="14" fill="#ffffff" stroke="#d8dedc"/><text x="54" y="148" fill="#193449" font-size="23" font-weight="700">모양·소리가 비슷함</text><text x="440" y="148" fill="#193449" font-size="23" font-weight="700">같은 대상인지 확인</text><circle cx="105" cy="219" r="31" fill="#dce9e6" stroke="#176d70" stroke-width="3"/><rect x="65" y="249" width="80" height="12" fill="#193449"/><text x="77" y="298" fill="#193449" font-size="22" font-weight="400">A-17</text><circle cx="275" cy="219" r="31" fill="#dce9e6" stroke="#176d70" stroke-width="3"/><rect x="235" y="249" width="80" height="12" fill="#193449"/><text x="247" y="298" fill="#193449" font-size="22" font-weight="400">A-18</text><path d="M145 218 L225 218" fill="none" stroke="#176d70" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="56" y="342" fill="#9a5914" font-size="19" font-weight="400">유사도는 개체의 증명이 아님</text><text x="442" y="203" fill="#193449" font-size="23" font-weight="400">사진 → A-17</text><text x="442" y="249" fill="#9a5914" font-size="23" font-weight="400">원음 → 발생원 미확인</text><text x="442" y="301" fill="#193449" font-size="20" font-weight="400">사건 E17 · 제품 개체 · 시각</text><text x="442" y="343" fill="#176d70" font-size="20" font-weight="400">식별자와 맥락을 대조</text><text x="32" y="420" fill="#526471" font-size="19" font-weight="400">가상 예시  ·  닮은 자료 검색과 자산 연결을 구분</text></g></svg>