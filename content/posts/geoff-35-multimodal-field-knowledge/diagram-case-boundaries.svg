<svg xmlns="http://www.w3.org/2000/svg" width="800" height="460" viewBox="0 0 800 460" role="img" aria-labelledby="title desc"><title id="title">공개 사례가 보여주는 범위를 읽습니다</title><desc id="desc">본문 사례의 기여를 요약한 개념도  ·  배포 아키텍처가 아닙니다</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#176d70"/></marker></defs><rect width="800" height="460" rx="18" fill="#faf7f0"/><g font-family="Noto Sans CJK KR, Noto Sans CJK JP, sans-serif"><text x="32" y="48" fill="#193449" font-size="29" font-weight="700">공개 사례가 보여주는 범위를 읽습니다</text><text x="32" y="82" fill="#526471" font-size="18" font-weight="400">본문 사례의 기여를 요약한 개념도  ·  배포 아키텍처가 아닙니다</text><rect x="32" y="112" width="736" height="76" rx="14" fill="#ffffff" stroke="#d8dedc"/><text x="50" y="142" fill="#176d70" font-size="21" font-weight="700">공급사 보고 · 저장 기반</text><text x="50" y="171" fill="#193449" font-size="19" font-weight="400">이미지·음향 저장, 라벨링과 메타데이터 검색</text><rect x="32" y="203" width="736" height="76" rx="14" fill="#ffffff" stroke="#d8dedc"/><text x="50" y="233" fill="#176d70" font-size="21" font-weight="700">공급사 보고 · 경험 문서화</text><text x="50" y="262" fill="#193449" font-size="19" font-weight="400">전문가 대화 기록을 문서·설비 데이터와 함께 활용</text><rect x="32" y="294" width="736" height="76" rx="14" fill="#ffffff" stroke="#d8dedc"/><text x="50" y="324" fill="#176d70" font-size="21" font-weight="700">연구 데이터셋 · 시간 정렬</text><text x="50" y="353" fill="#193449" font-size="19" font-weight="400">관측 영상·센서와 전문가 해설을 분리 수집</text><text x="32" y="420" fill="#9a5914" font-size="23" font-weight="700">각 사례의 성과 조각 ≠ 통합 사건철 전체의 실증</text></g></svg>