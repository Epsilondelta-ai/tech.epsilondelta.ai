<svg xmlns="http://www.w3.org/2000/svg" width="800" height="460" viewBox="0 0 800 460" role="img" aria-labelledby="title desc"><title id="title">출처와 확인 여부를 함께 남깁니다</title><desc id="desc">같은 사건 안에서도 관측·추론·설명은 서로 다른 정보입니다</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#176d70"/></marker></defs><rect width="800" height="460" rx="18" fill="#faf7f0"/><g font-family="Noto Sans CJK KR, Noto Sans CJK JP, sans-serif"><text x="32" y="48" fill="#193449" font-size="29" font-weight="700">출처와 확인 여부를 함께 남깁니다</text><text x="32" y="82" fill="#526471" font-size="18" font-weight="400">같은 사건 안에서도 관측·추론·설명은 서로 다른 정보입니다</text><rect x="32" y="111" width="222" height="266" rx="14" fill="#ffffff" stroke="#d8dedc"/><rect x="289" y="111" width="222" height="266" rx="14" fill="#ffffff" stroke="#d8dedc"/><rect x="546" y="111" width="222" height="266" rx="14" fill="#ffffff" stroke="#d8dedc"/><text x="48" y="153" fill="#176d70" font-size="24" font-weight="700">원본 관측</text><text x="48" y="205" fill="#193449" font-size="18" font-weight="400">설비 사진</text><text x="48" y="243" fill="#193449" font-size="18" font-weight="400">10초 원음</text><text x="48" y="281" fill="#193449" font-size="18" font-weight="400">온도 집계 구간</text><text x="48" y="349" fill="#526471" font-size="18" font-weight="400">원본 파일 유지</text><text x="305" y="153" fill="#176d70" font-size="24" font-weight="700">AI 추론</text><text x="305" y="205" fill="#193449" font-size="18" font-weight="400">표면 변화 후보</text><text x="305" y="243" fill="#193449" font-size="18" font-weight="400">음성 전사문</text><text x="305" y="281" fill="#193449" font-size="18" font-weight="400">원본으로 되짚기</text><text x="305" y="349" fill="#526471" font-size="18" font-weight="400">추정 결과</text><text x="562" y="153" fill="#176d70" font-size="24" font-weight="700">사람의 설명</text><text x="562" y="205" fill="#193449" font-size="18" font-weight="400">“옆 설비 소리 같다”</text><text x="562" y="243" fill="#193449" font-size="18" font-weight="400">작업자 발언</text><text x="562" y="281" fill="#193449" font-size="18" font-weight="400">발언자·원음 연결</text><text x="562" y="349" fill="#526471" font-size="18" font-weight="400">현장 설명</text><path d="M288 309 L257 309" fill="none" stroke="#176d70" stroke-width="2.5" marker-end="url(#arrow)"/><text x="32" y="423" fill="#9a5914" font-size="23" font-weight="700">확인 상태는 별도 기록  →  소리 발생원: 미확인</text></g></svg>