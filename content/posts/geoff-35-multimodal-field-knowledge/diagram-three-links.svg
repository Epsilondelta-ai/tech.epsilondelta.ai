<svg xmlns="http://www.w3.org/2000/svg" width="800" height="460" viewBox="0 0 800 460" role="img" aria-labelledby="title desc"><title id="title">기록을 묶는 세 가지 연결 고리</title><desc id="desc">가상 사건 E17  ·  업로드 시각을 관측 시각으로 쓰지 않습니다</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#176d70"/></marker></defs><rect width="800" height="460" rx="18" fill="#faf7f0"/><g font-family="Noto Sans CJK KR, Noto Sans CJK JP, sans-serif"><text x="32" y="48" fill="#193449" font-size="29" font-weight="700">기록을 묶는 세 가지 연결 고리</text><text x="32" y="82" fill="#526471" font-size="18" font-weight="400">가상 사건 E17  ·  업로드 시각을 관측 시각으로 쓰지 않습니다</text><rect x="32" y="122" width="236" height="235" rx="14" fill="#ffffff" stroke="#d8dedc"/><text x="50" y="163" fill="#176d70" font-size="24" font-weight="700">대상 연결</text><text x="50" y="215" fill="#193449" font-size="18" font-weight="400">설비 A-17 · 현장 별칭</text><text x="50" y="252" fill="#193449" font-size="18" font-weight="400">제품 개체 · 사건 E17</text><text x="50" y="324" fill="#526471" font-size="18" font-weight="400">어느 대상을 기록했나</text><rect x="282" y="122" width="236" height="235" rx="14" fill="#ffffff" stroke="#d8dedc"/><text x="300" y="163" fill="#176d70" font-size="24" font-weight="700">시간 연결</text><text x="300" y="215" fill="#193449" font-size="18" font-weight="400">관측 02:10</text><text x="300" y="252" fill="#193449" font-size="18" font-weight="400">업로드 08:30</text><text x="300" y="324" fill="#526471" font-size="18" font-weight="400">센서 집계 구간 대조</text><rect x="532" y="122" width="236" height="235" rx="14" fill="#ffffff" stroke="#d8dedc"/><text x="550" y="163" fill="#176d70" font-size="24" font-weight="700">원음 연결</text><text x="550" y="215" fill="#193449" font-size="18" font-weight="400">전사문 ↔ 원음 구간</text><text x="550" y="252" fill="#193449" font-size="18" font-weight="400">주변 소음 · 운전 조건</text><text x="550" y="324" fill="#526471" font-size="18" font-weight="400">발언의 맥락 다시 듣기</text><text x="32" y="405" fill="#193449" font-size="22" font-weight="700">하나의 사건철로 연결하되, 누락·시계 오차도 남깁니다</text></g></svg>