<svg xmlns="http://www.w3.org/2000/svg" width="800" height="880" viewBox="0 0 800 880"><title>실제 호출 경로가 통제 범위를 정합니다</title><rect width="800" height="880" fill="#f6f3eb"/><style>text{font-family:Noto Sans CJK KR,sans-serif;fill:#172e3b;font-size:27px} .h{font-size:32px;font-weight:700} .b{font-size:29px;font-weight:700}</style><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#147d79" stroke-width="1.5"/></marker></defs><text x="32" y="60" class="h">실제 호출 경로가 통제 범위를 정합니다</text><rect x="32" y="100" width="736" height="120" rx="14" fill="white" stroke="#bacdca"/><text x="52" y="140" class="b">에이전트의 도구 요청</text><text x="52" y="180">어떤 신원·자격증명으로 어디를 통과하는가?</text><path d="M210 220L210 270" fill="none" stroke="#147d79" stroke-width="4" marker-end="url(#a)"/><path d="M590 220L590 270" fill="none" stroke="#147d79" stroke-width="4" marker-end="url(#a)"/><rect x="32" y="280" width="352" height="170" rx="14" fill="#e5f2ed" stroke="#bacdca"/><text x="52" y="320" class="b">게이트웨이 통과</text><text x="52" y="360">정책 평가</text><text x="52" y="398">허용 없으면 거부</text><text x="52" y="436">금지 규칙 우선</text><rect x="416" y="280" width="352" height="170" rx="14" fill="#fff0d7" stroke="#bacdca"/><text x="436" y="320" class="b">별도 자격증명 사용</text><text x="436" y="360">API·DB 직접 호출</text><text x="436" y="398">이 게이트웨이의</text><text x="436" y="436">정책 집행 범위 밖</text><path d="M210 450L210 505" fill="none" stroke="#147d79" stroke-width="4" marker-end="url(#a)"/><path d="M590 450L590 505" fill="none" stroke="#147d79" stroke-width="4" marker-end="url(#a)"/><rect x="32" y="515" width="352" height="120" rx="14" fill="white" stroke="#bacdca"/><text x="52" y="555" class="b">엔진 ENFORCE</text><text x="52" y="595">정책에 따라 허용·차단</text><rect x="416" y="515" width="352" height="120" rx="14" fill="white" stroke="#bacdca"/><text x="436" y="555" class="b">원천 접근 통제 확인</text><text x="436" y="595">권한·자격증명도 점검</text><rect x="32" y="670" width="736" height="155" rx="14" fill="white" stroke="#bacdca"/><text x="52" y="710" class="b">정책 ACTIVE여도 엔진이 LOG_ONLY라면</text><text x="52" y="750">판단 결과만 기록하고 도구 호출은 차단하지 않음</text><text x="52" y="788">호스팅 권한과 새 세션 적용 범위도 별도 확인</text></svg>