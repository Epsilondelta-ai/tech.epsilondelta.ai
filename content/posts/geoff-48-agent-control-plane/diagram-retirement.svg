<svg xmlns="http://www.w3.org/2000/svg" width="800" height="890" viewBox="0 0 800 890" role="img"><title>퇴역은 다섯 조건을 모두 확인해야 합니다</title><rect width="800" height="890" fill="#f6f3eb"/><style>text{font-family:Noto Sans CJK KR,sans-serif;fill:#172e3b} .title{font-size:34px;font-weight:700} .head{font-size:30px;font-weight:700} .body{font-size:27px}</style><text x="38" y="65" class="title">퇴역은 다섯 조건을 모두 확인해야 합니다</text><path d="M38 94H762" stroke="#147d79" stroke-width="5"/><rect x="32" y="124" width="736" height="108" rx="14" fill="white" stroke="#c5d3cf"/><rect x="32" y="124" width="8" height="108" rx="4" fill="#147d79"/><text x="58" y="165" class="head">① 카탈로그 폐기 · 의존 업무 확인</text><text x="58" y="206" class="body">검색에서 내리는 일과 실행 종료를 구분</text><rect x="32" y="250" width="736" height="108" rx="14" fill="white" stroke="#c5d3cf"/><rect x="32" y="250" width="8" height="108" rx="4" fill="#147d79"/><text x="58" y="291" class="head">② 예약 해제 · 런타임 정지</text><text x="58" y="332" class="body">반복 실행과 돌아가는 프로세스를 중단</text><rect x="32" y="376" width="736" height="108" rx="14" fill="white" stroke="#c5d3cf"/><rect x="32" y="376" width="8" height="108" rx="4" fill="#147d79"/><text x="58" y="417" class="head">③ 실행 신원 비활성화 · 자격증명 회수</text><text x="58" y="458" class="body">남아 있는 계정·토큰·키의 접근을 정리</text><rect x="32" y="502" width="736" height="108" rx="14" fill="white" stroke="#c5d3cf"/><rect x="32" y="502" width="8" height="108" rx="4" fill="#147d79"/><text x="58" y="543" class="head">④ 게이트웨이·도구 접근 차단 확인</text><text x="58" y="584" class="body">실제 연결 지점에서 차단 여부를 검증</text><rect x="32" y="628" width="736" height="108" rx="14" fill="white" stroke="#c5d3cf"/><rect x="32" y="628" width="8" height="108" rx="4" fill="#147d79"/><text x="58" y="669" class="head">⑤ 감사 기록 보존</text><text x="58" y="710" class="body">실행·변경·퇴역의 근거를 남김</text><text x="38" y="770" class="body" font-weight="700">현업 책임자 + 기술 담당자 · 인사이동 시 승계</text><text x="38" y="808" class="body" font-weight="700">운용 만료일에 연장 심사 또는 퇴역</text></svg>