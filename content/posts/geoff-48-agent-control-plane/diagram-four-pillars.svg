<svg xmlns="http://www.w3.org/2000/svg" width="800" height="764" viewBox="0 0 800 764" role="img"><title>명부와 실제 통제를 연결하는 네 기둥</title><rect width="800" height="764" fill="#f6f3eb"/><style>text{font-family:Noto Sans CJK KR,sans-serif;fill:#172e3b} .title{font-size:34px;font-weight:700} .head{font-size:30px;font-weight:700} .body{font-size:27px}</style><text x="38" y="65" class="title">명부와 실제 통제를 연결하는 네 기둥</text><path d="M38 94H762" stroke="#147d79" stroke-width="5"/><rect x="32" y="124" width="736" height="108" rx="14" fill="white" stroke="#c5d3cf"/><rect x="32" y="124" width="8" height="108" rx="4" fill="#147d79"/><text x="58" y="165" class="head">레지스트리 · 누가 존재하는가</text><text x="58" y="206" class="body">목적 · 소유자 · 접근 범위를 대장에 기록</text><rect x="32" y="250" width="736" height="108" rx="14" fill="white" stroke="#c5d3cf"/><rect x="32" y="250" width="8" height="108" rx="4" fill="#147d79"/><text x="58" y="291" class="head">아이덴티티 · 어떤 신원으로 일하는가</text><text x="58" y="332" class="body">실행 신원에 권한을 부여하고 회수</text><rect x="32" y="376" width="736" height="108" rx="14" fill="white" stroke="#c5d3cf"/><rect x="32" y="376" width="8" height="108" rx="4" fill="#147d79"/><text x="58" y="417" class="head">게이트웨이 · 요청을 허용할 것인가</text><text x="58" y="458" class="body">통과하는 도구 호출에 정책을 집행</text><rect x="32" y="502" width="736" height="108" rx="14" fill="white" stroke="#c5d3cf"/><rect x="32" y="502" width="8" height="108" rx="4" fill="#147d79"/><text x="58" y="543" class="head">관측 · 실제로 무엇을 했는가</text><text x="58" y="584" class="body">호출과 활동 기록을 남기고 추적</text><text x="38" y="644" class="body" font-weight="700">대장 등록만으로 접근 통제가 생기지는 않습니다</text></svg>