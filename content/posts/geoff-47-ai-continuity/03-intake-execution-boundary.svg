<svg xmlns="http://www.w3.org/2000/svg" width="800" height="640" viewBox="0 0 800 640"><rect width="800" height="640" rx="24" fill="#f7f4ed"/><style>text{font-family:'Noto Sans CJK KR','Noto Sans KR',sans-serif;fill:#183344}.h{font-size:30px;font-weight:700}.a{font-size:26px;font-weight:700}.b{font-size:23px}</style><text x="40" y="65" class="h">접수와 실행 사이에 경계를 둡니다</text><rect x="40" y="100" width="720" height="82" rx="14" fill="white" stroke="#b9cdc8"/><rect x="40" y="100" width="8" height="82" rx="4" fill="#218478"/><text x="66" y="134" class="a">접수 유지</text><text x="66" y="165" class="b">기록 저장이 정상일 때 접수 · 대기번호 안내</text><rect x="40" y="200" width="720" height="82" rx="14" fill="white" stroke="#b9cdc8"/><rect x="40" y="200" width="8" height="82" rx="4" fill="#218478"/><text x="66" y="234" class="a">조회 · 문서 작성</text><text x="66" y="265" class="b">열람 권한과 원문 접근이 정상일 때 진행</text><rect x="40" y="300" width="720" height="82" rx="14" fill="white" stroke="#b9cdc8"/><rect x="40" y="300" width="8" height="82" rx="4" fill="#218478"/><text x="66" y="334" class="a">대외 실행 보류</text><text x="66" y="365" class="b">환불 · 발주 · 가격 확정의 자동 실행 중지</text><rect x="40" y="400" width="720" height="82" rx="14" fill="white" stroke="#b9cdc8"/><rect x="40" y="400" width="8" height="82" rx="4" fill="#218478"/><text x="66" y="434" class="a">수동 실행의 조건</text><text x="66" y="465" class="b">직무 권한 + 결재 승인 + 원장 중복 확인</text><text x="40" y="592" class="b">접수 안내는 환불 확정이나 발주 완료가 아닙니다</text><path d="M400 184v10m-5 -4l5 5 5 -5" fill="none" stroke="#218478" stroke-width="2"/><path d="M400 284v10m-5 -4l5 5 5 -5" fill="none" stroke="#218478" stroke-width="2"/><path d="M400 384v10m-5 -4l5 5 5 -5" fill="none" stroke="#218478" stroke-width="2"/></svg>