<svg xmlns="http://www.w3.org/2000/svg" width="800" height="640" viewBox="0 0 800 640"><rect width="800" height="640" rx="24" fill="#f7f4ed"/><style>text{font-family:'Noto Sans CJK KR','Noto Sans KR',sans-serif;fill:#183344}.h{font-size:30px;font-weight:700}.a{font-size:26px;font-weight:700}.b{font-size:23px}</style><text x="40" y="65" class="h">복구 신호 다음은 원장 대조입니다</text><rect x="40" y="100" width="720" height="82" rx="14" fill="white" stroke="#b9cdc8"/><rect x="40" y="100" width="8" height="82" rx="4" fill="#218478"/><text x="66" y="134" class="a">보류 건 · 수기 처리 건 · 결과 미확정 건</text><text x="66" y="165" class="b">동일한 업무 번호로 모아 실제 원장과 대조</text><rect x="40" y="200" width="720" height="82" rx="14" fill="white" stroke="#b9cdc8"/><rect x="40" y="200" width="8" height="82" rx="4" fill="#218478"/><text x="66" y="234" class="a">완료 확인 → 대기열에서 제외</text><text x="66" y="265" class="b">미실행 확인 → 승인 · 재고 · 가격 다시 확인</text><rect x="40" y="300" width="720" height="82" rx="14" fill="white" stroke="#b9cdc8"/><rect x="40" y="300" width="8" height="82" rx="4" fill="#218478"/><text x="66" y="334" class="a">결과 미확정 → 자동 재실행 격리</text><text x="66" y="365" class="b">담당자가 원장 관리자와 처리 결과 확정</text><rect x="40" y="400" width="720" height="82" rx="14" fill="white" stroke="#b9cdc8"/><rect x="40" y="400" width="8" height="82" rx="4" fill="#218478"/><text x="66" y="434" class="a">소량 재개 → 결과 확인 → 범위 확대</text><text x="66" y="465" class="b">오류 · 품질 · 잔여 처리 여력을 확인</text><text x="40" y="592" class="b">대조와 안정화가 끝난 뒤 정상 운영 복귀를 선언</text><path d="M400 184v10m-5 -4l5 5 5 -5" fill="none" stroke="#218478" stroke-width="2"/><path d="M400 284v10m-5 -4l5 5 5 -5" fill="none" stroke="#218478" stroke-width="2"/><path d="M400 384v10m-5 -4l5 5 5 -5" fill="none" stroke="#218478" stroke-width="2"/></svg>