<svg xmlns="http://www.w3.org/2000/svg" width="800" height="760" viewBox="0 0 800 760" role="img" aria-labelledby="title desc">
<title id="title">RAG의 문서 등록과 질문 처리</title><desc id="desc">등록 때 만든 검색 저장소는 별도 사본이며 질문 때 사용자 권한에 맞는 조각만 찾아 문맥으로 전달합니다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#24736d"/></marker></defs>
<rect width="800" height="760" rx="22" fill="#f5f5ee"/>
<g font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif"><text x="36" y="55" font-size="36" font-weight="700" fill="#203747" text-anchor="start">RAG: 읽기 전에 만드는 검색 창고</text><text x="36" y="96" font-size="28" font-weight="400" fill="#203747" text-anchor="start">생성 모델 재학습 없이 연결하는 구성</text><rect x="28" y="124" width="744" height="238" rx="18" fill="#e7efeb" stroke="#cbd7d5" stroke-width="2"/><text x="48" y="164" font-size="30" font-weight="700" fill="#24736d" text-anchor="start">문서 등록</text><rect x="48" y="190" width="196" height="104" rx="18" fill="#ffffff" stroke="#cbd7d5" stroke-width="2"/><text x="146" y="230" font-size="28" font-weight="700" fill="#203747" text-anchor="middle">원문</text><text x="146" y="271" font-size="28" font-weight="400" fill="#203747" text-anchor="middle">업무 문서</text><rect x="302" y="190" width="196" height="104" rx="18" fill="#ffffff" stroke="#cbd7d5" stroke-width="2"/><text x="400" y="230" font-size="28" font-weight="700" fill="#203747" text-anchor="middle">조각 · 임베딩</text><text x="400" y="271" font-size="28" font-weight="400" fill="#203747" text-anchor="middle">분할 · 변환</text><rect x="556" y="190" width="196" height="104" rx="18" fill="#ffffff" stroke="#cbd7d5" stroke-width="2"/><text x="654" y="230" font-size="28" font-weight="700" fill="#203747" text-anchor="middle">검색 저장소</text><text x="654" y="271" font-size="28" font-weight="400" fill="#203747" text-anchor="middle">색인 구성</text><path d="M251 242 L291 242" fill="none" stroke="#24736d" stroke-width="4" marker-end="url(#arrow)"/><path d="M505 242 L545 242" fill="none" stroke="#24736d" stroke-width="4" marker-end="url(#arrow)"/><text x="48" y="338" font-size="29" font-weight="500" fill="#203747" text-anchor="start">별도 사본: 조각 · 임베딩 · 메타데이터</text><rect x="28" y="386" width="744" height="238" rx="18" fill="#ffffff" stroke="#cbd7d5" stroke-width="2"/><text x="48" y="426" font-size="30" font-weight="700" fill="#24736d" text-anchor="start">질문 처리</text><rect x="48" y="452" width="196" height="104" rx="18" fill="#f6f8f6" stroke="#cbd7d5" stroke-width="2"/><text x="146" y="492" font-size="28" font-weight="700" fill="#203747" text-anchor="middle">질문 · 권한</text><text x="146" y="533" font-size="28" font-weight="400" fill="#203747" text-anchor="middle">사용자 확인</text><rect x="302" y="452" width="196" height="104" rx="18" fill="#f6f8f6" stroke="#cbd7d5" stroke-width="2"/><text x="400" y="492" font-size="28" font-weight="700" fill="#203747" text-anchor="middle">허용된 조각</text><text x="400" y="533" font-size="28" font-weight="400" fill="#203747" text-anchor="middle">관련 조각 검색</text><rect x="556" y="452" width="196" height="104" rx="18" fill="#f6f8f6" stroke="#cbd7d5" stroke-width="2"/><text x="654" y="492" font-size="28" font-weight="700" fill="#203747" text-anchor="middle">답변 생성</text><text x="654" y="533" font-size="28" font-weight="400" fill="#203747" text-anchor="middle">문맥 입력</text><path d="M251 504 L291 504" fill="none" stroke="#24736d" stroke-width="4" marker-end="url(#arrow)"/><path d="M505 504 L545 504" fill="none" stroke="#24736d" stroke-width="4" marker-end="url(#arrow)"/><text x="48" y="600" font-size="29" font-weight="500" fill="#203747" text-anchor="start">검색 단계에서 문서별 열람 권한 적용</text><text x="36" y="679" font-size="32" font-weight="700" fill="#203747" text-anchor="start">누가 어떤 문서까지 찾을 수 있나?</text><text x="36" y="724" font-size="27" font-weight="400" fill="#203747" text-anchor="start">임베딩도 자동 익명화가 보장되지는 않습니다.</text></g></svg>