<svg xmlns="http://www.w3.org/2000/svg" width="800" height="776" viewBox="0 0 800 776" role="img" aria-labelledby="title desc">
<title id="title">복사본과 결과 모델의 별도 삭제 검수</title><desc id="desc">원본과 검색 사본, 검색 비노출 재검증, 운영 기록과 백업, 미세조정 모델 영향 제거를 별개로 확인하며 임의의 삭제 시간을 제시하지 않습니다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#24736d"/></marker></defs>
<rect width="800" height="776" rx="22" fill="#f5f5ee"/>
<g font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif"><text x="36" y="55" font-size="36" font-weight="700" fill="#203747" text-anchor="start">삭제는 저장소별로 완료를 확인</text><text x="36" y="96" font-size="28" font-weight="400" fill="#203747" text-anchor="start">요청 성공 · 검색 비노출 · 잔여 보관을 대조</text><rect x="28" y="126" width="358" height="238" rx="18" fill="#e7efeb" stroke="#cbd7d5" stroke-width="2"/><text x="48" y="173" font-size="31" font-weight="700" fill="#24736d" text-anchor="start">원본과 검색 사본</text><text x="48" y="227" font-size="27" font-weight="400" fill="#203747" text-anchor="start">원문 · 조각 · 임베딩</text><text x="48" y="273" font-size="27" font-weight="400" fill="#203747" text-anchor="start">색인 · 캐시에</text><text x="48" y="319" font-size="27" font-weight="400" fill="#203747" text-anchor="start">삭제가 전달됐나?</text><rect x="414" y="126" width="358" height="238" rx="18" fill="#ffffff" stroke="#cbd7d5" stroke-width="2"/><text x="434" y="173" font-size="31" font-weight="700" fill="#24736d" text-anchor="start">검색 재확인</text><text x="434" y="227" font-size="27" font-weight="400" fill="#203747" text-anchor="start">API 성공 응답 뒤</text><text x="434" y="273" font-size="27" font-weight="400" fill="#203747" text-anchor="start">같은 고유 문구가</text><text x="434" y="319" font-size="27" font-weight="400" fill="#203747" text-anchor="start">다시 검색되나?</text><rect x="28" y="390" width="358" height="238" rx="18" fill="#e7efeb" stroke="#cbd7d5" stroke-width="2"/><text x="48" y="437" font-size="31" font-weight="700" fill="#24736d" text-anchor="start">운영 기록과 백업</text><text x="48" y="491" font-size="27" font-weight="400" fill="#203747" text-anchor="start">공급자 · 앱 로그</text><text x="48" y="537" font-size="27" font-weight="400" fill="#203747" text-anchor="start">백업의 별도 주기와</text><text x="48" y="583" font-size="27" font-weight="400" fill="#203747" text-anchor="start">보관 예외는?</text><rect x="414" y="390" width="358" height="238" rx="18" fill="#ffffff" stroke="#cbd7d5" stroke-width="2"/><text x="434" y="437" font-size="31" font-weight="700" fill="#24736d" text-anchor="start">미세조정 결과</text><text x="434" y="491" font-size="27" font-weight="400" fill="#203747" text-anchor="start">학습 파일 삭제와</text><text x="434" y="537" font-size="27" font-weight="400" fill="#203747" text-anchor="start">모델·어댑터 영향 제거는</text><text x="434" y="583" font-size="27" font-weight="400" fill="#203747" text-anchor="start">별도로 검증했나?</text><text x="36" y="690" font-size="32" font-weight="700" fill="#203747" text-anchor="start">누가 · 언제 · 어떤 증거로 확인하나?</text><text x="36" y="735" font-size="28" font-weight="400" fill="#203747" text-anchor="start">목적 · 설정 · 보관 · 권한 · 삭제를 함께 묻기</text></g></svg>