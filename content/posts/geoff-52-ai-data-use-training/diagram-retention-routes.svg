<svg xmlns="http://www.w3.org/2000/svg" width="800" height="720" viewBox="0 0 800 720" role="img" aria-labelledby="title desc">
<title id="title">학습 여부와 별개인 세 보관 경로</title><desc id="desc">공급자 플랫폼, 애플리케이션 추적, 업무 시스템의 보관을 별도로 확인하고 제로 데이터 보존의 적용 범위와 예외도 확인합니다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#24736d"/></marker></defs>
<rect width="800" height="720" rx="22" fill="#f5f5ee"/>
<g font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif"><text x="36" y="55" font-size="36" font-weight="700" fill="#203747" text-anchor="start">학습 제외와 보관은 별도 질문</text><text x="36" y="96" font-size="28" font-weight="400" fill="#203747" text-anchor="start">모델 개선에 쓰지 않아도 남을 수 있는 경로</text><rect x="28" y="126" width="744" height="138" rx="18" fill="#e7efeb" stroke="#cbd7d5" stroke-width="2"/><text x="48" y="168" font-size="32" font-weight="700" fill="#24736d" text-anchor="start">공급자 플랫폼</text><text x="48" y="209" font-size="29" font-weight="400" fill="#203747" text-anchor="start">오용 감시 로그 · 기능별 상태</text><text x="48" y="246" font-size="27" font-weight="400" fill="#203747" text-anchor="start">파일 · 벡터 저장소도 별도 객체</text><rect x="28" y="284" width="744" height="138" rx="18" fill="#ffffff" stroke="#cbd7d5" stroke-width="2"/><text x="48" y="326" font-size="32" font-weight="700" fill="#24736d" text-anchor="start">애플리케이션</text><text x="48" y="367" font-size="29" font-weight="400" fill="#203747" text-anchor="start">운영 로그 · 추적 기록</text><text x="48" y="404" font-size="27" font-weight="400" fill="#203747" text-anchor="start">입출력 수집 여부와 전송처 확인</text><rect x="28" y="442" width="744" height="138" rx="18" fill="#ffffff" stroke="#cbd7d5" stroke-width="2"/><text x="48" y="484" font-size="32" font-weight="700" fill="#24736d" text-anchor="start">업무 시스템</text><text x="48" y="525" font-size="29" font-weight="400" fill="#203747" text-anchor="start">회신 초안 · 회의 메모 · CRM</text><text x="48" y="562" font-size="27" font-weight="400" fill="#203747" text-anchor="start">업무 기록의 보관·삭제 정책 확인</text><text x="36" y="636" font-size="32" font-weight="700" fill="#203747" text-anchor="start">각 저장소의 위치 · 주기 · 예외는?</text><text x="36" y="680" font-size="28" font-weight="400" fill="#203747" text-anchor="start">ZDR도 지원 기능·모델·예외를 따로 확인</text></g></svg>