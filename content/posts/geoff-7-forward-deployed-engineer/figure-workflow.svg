<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">납기 문의에서 Tool, Skill, Memory, 승인과 실행이 연결되는 방식</title>
  <desc id="desc">가상의 납기 문의 업무. Skill이 재고, 검사 상태, 예약 물량을 확인하는 절차를 안내하고 Tool이 각 시스템을 조회한다. 에이전트는 확인한 근거로 납기안을 제안한다. 계약과 다른 납기를 확정하려면 사람의 승인과 업무 API의 권한 및 조건 검증을 거친다. 실행 뒤 실제 상태를 확인하며 Memory에는 확인 항목, 승인 대기와 실행 결과를 기록한다.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#627579"/></marker>
    <marker id="blueArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#275BCA"/></marker>
    <marker id="tealArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#127C78"/></marker>
  </defs>
  <rect width="1200" height="800" rx="24" fill="#F7F4EC"/>
  <g font-family="'Apple SD Gothic Neo', Pretendard, 'Noto Sans KR', sans-serif" fill="#20303B">
    <text x="48" y="58" font-size="16" font-weight="700" letter-spacing="2" fill="#127C78">FROM RULES TO A WORKFLOW</text>
    <text x="48" y="111" font-size="35" font-weight="800">“오늘 출고할 수 있나요?”에 답하려면</text>
    <text x="48" y="150" font-size="21" fill="#617076">가상의 납기 업무 예시 · 조회부터 승인, 실행 확인까지 이어져야 합니다.</text>

    <rect x="48" y="202" width="282" height="260" rx="20" fill="#FFFFFF" stroke="#D8DEDA" stroke-width="1.5"/>
    <text x="72" y="241" font-size="24" font-weight="800" fill="#275BCA">Tool</text>
    <text x="132" y="241" font-size="20" fill="#617076">시스템을 조회</text>
    <g font-size="20">
      <circle cx="79" cy="287" r="5" fill="#275BCA"/><text x="96" y="295">재고 수량</text>
      <circle cx="79" cy="335" r="5" fill="#275BCA"/><text x="96" y="343">검사 상태</text>
      <circle cx="79" cy="383" r="5" fill="#275BCA"/><text x="96" y="391">다른 주문의 예약 물량</text>
    </g>
    <text x="72" y="435" font-size="18" fill="#617076">조회 실패도 확인할 정보입니다</text>

    <rect x="392" y="197" width="307" height="123" rx="18" fill="#E2EAE7"/>
    <text x="416" y="235" font-size="24" font-weight="800" fill="#127C78">Skill</text>
    <text x="479" y="235" font-size="20" fill="#617076">업무 절차를 안내</text>
    <text x="416" y="270" font-size="20">확인 순서 · 예외 처리</text>
    <text x="416" y="299" font-size="20">정보 부족 시 담당자에게 확인</text>
    <path d="M545 322V358" fill="none" stroke="#127C78" stroke-width="3" marker-end="url(#tealArrow)"/>

    <path d="M331 399H391" fill="none" stroke="#275BCA" stroke-width="3" marker-end="url(#blueArrow)"/>
    <rect x="392" y="366" width="307" height="148" rx="20" fill="#275BCA"/>
    <text x="545" y="405" text-anchor="middle" font-size="24" font-weight="800" fill="#FFFFFF">에이전트가 납기안을 제안</text>
    <text x="545" y="445" text-anchor="middle" font-size="20" fill="#FFFFFF">조회한 근거 + 업무 기준</text>
    <text x="545" y="480" text-anchor="middle" font-size="18" fill="#E1E8F7">제안과 확정은 별도 단계</text>

    <path d="M700 438H770" fill="none" stroke="#627579" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="918" y="211" text-anchor="middle" font-size="20" font-weight="700" fill="#D86B4A">계약과 다른 납기를 확정한다면</text>
    <path d="M790 244H1148" stroke="#D86B4A" stroke-width="2"/>
    <g>
      <circle cx="806" cy="298" r="16" fill="#F5E3D9"/>
      <text x="806" y="305" text-anchor="middle" font-size="18" font-weight="800" fill="#D86B4A">1</text>
      <text x="840" y="304" font-size="24" font-weight="800">사람이 승인</text>
      <text x="840" y="338" font-size="20" fill="#617076">고객 약속 · 예외 조건 검토</text>
      <path d="M806 320V393" stroke="#D2C6BC" stroke-width="2.5" marker-end="url(#arrow)"/>
      <circle cx="806" cy="414" r="16" fill="#F5E3D9"/>
      <text x="806" y="421" text-anchor="middle" font-size="18" font-weight="800" fill="#D86B4A">2</text>
      <text x="840" y="420" font-size="24" font-weight="800">업무 API가 검증 · 실행</text>
      <text x="840" y="454" font-size="20" fill="#617076">권한 · 현재 조건 · 중복 여부</text>
      <path d="M806 436V509" stroke="#D2C6BC" stroke-width="2.5" marker-end="url(#arrow)"/>
      <circle cx="806" cy="530" r="16" fill="#E2EAE7"/>
      <text x="806" y="537" text-anchor="middle" font-size="18" font-weight="800" fill="#127C78">3</text>
      <text x="840" y="536" font-size="24" font-weight="800">실제 실행 결과 확인</text>
      <text x="840" y="570" font-size="20" fill="#617076">주문 상태가 바뀌었는가?</text>
    </g>
    <path d="M770 438V298H786" fill="none" stroke="#627579" stroke-width="3" marker-end="url(#arrow)"/>

    <path d="M545 515V620" fill="none" stroke="#127C78" stroke-width="2.5" marker-end="url(#tealArrow)"/>
    <path d="M350 623V504Q350 480 374 480H389" fill="none" stroke="#127C78" stroke-width="2.5" stroke-dasharray="5 5" marker-end="url(#tealArrow)"/>
    <text x="213" y="550" font-size="19" fill="#127C78">이어서 처리</text>
    <path d="M1060 591V646H703" fill="none" stroke="#127C78" stroke-width="2.5" marker-end="url(#tealArrow)"/>
    <rect x="48" y="625" width="652" height="116" rx="18" fill="#E2EAE7"/>
    <text x="74" y="666" font-size="24" font-weight="800" fill="#127C78">Memory</text>
    <text x="182" y="666" font-size="20" fill="#617076">다음 작업으로 이어질 진행 상태</text>
    <text x="74" y="707" font-size="20">확인한 항목 · 미확인 정보 · 승인 대기 · 실행 결과</text>
    <text x="755" y="706" font-size="19" fill="#617076">승인 거절 · 조건 불충족 시</text>
    <text x="755" y="735" font-size="19" font-weight="700" fill="#D86B4A">실행을 멈추고 다시 확인</text>
  </g>
</svg>
