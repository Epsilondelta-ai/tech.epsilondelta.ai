<svg xmlns="http://www.w3.org/2000/svg" width="800" height="560" viewBox="0 0 800 560" role="img"><title>서로 기다리지 않고 조사할 수 있나요?</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8" fill="#256d73"/></marker></defs><rect width="800" height="560" fill="#faf7ef"/><g font-family="Noto Sans CJK KR, sans-serif"><text x="32" y="52" font-size="30" fill="#183d40" font-weight="700">서로 기다리지 않고 조사할 수 있나요?</text><rect x="32" y="88" width="736" height="205" rx="14" fill="white" stroke="#256d73" stroke-width="2"/><text x="54" y="129" font-size="28" fill="#256d73" font-weight="700">독립 조사 → 팀을 시험할 후보</text><rect x="55" y="153" width="211" height="65" rx="14" fill="white" stroke="#256d73" stroke-width="2"/><text x="78" y="195" font-size="26" fill="#183d40" font-weight="400">문헌 조사</text><rect x="288" y="153" width="211" height="65" rx="14" fill="white" stroke="#256d73" stroke-width="2"/><text x="311" y="195" font-size="26" fill="#183d40" font-weight="400">기업 조사</text><rect x="521" y="153" width="211" height="65" rx="14" fill="white" stroke="#256d73" stroke-width="2"/><text x="544" y="195" font-size="26" fill="#183d40" font-weight="400">조건 확인</text><text x="55" y="263" font-size="26" fill="#183d40" font-weight="400">각자 읽고 확인한 뒤, 근거를 모아 합류</text><rect x="32" y="320" width="736" height="205" rx="14" fill="white" stroke="#a65036" stroke-width="2"/><text x="54" y="361" font-size="28" fill="#a65036" font-weight="700">단계가 이어지는 일 → 단일 기준선</text><rect x="55" y="389" width="190" height="65" rx="14" fill="white" stroke="#a65036" stroke-width="2"/><text x="84" y="431" font-size="26" fill="#183d40" font-weight="400">앞 단계</text><rect x="304" y="389" width="190" height="65" rx="14" fill="white" stroke="#a65036" stroke-width="2"/><text x="333" y="431" font-size="26" fill="#183d40" font-weight="400">조건 변경</text><rect x="553" y="389" width="190" height="65" rx="14" fill="white" stroke="#a65036" stroke-width="2"/><text x="582" y="431" font-size="26" fill="#183d40" font-weight="400">다음 단계</text><path d="M249 421 L294 421" fill="none" stroke="#256d73" stroke-width="3" marker-end="url(#a)"/><path d="M500 421 L543 421" fill="none" stroke="#256d73" stroke-width="3" marker-end="url(#a)"/><text x="55" y="496" font-size="26" fill="#183d40" font-weight="400">하나의 기록을 순서대로 고치는 작업</text></g></svg>