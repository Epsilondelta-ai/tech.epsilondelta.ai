<svg xmlns="http://www.w3.org/2000/svg" width="800" height="560" viewBox="0 0 800 560" role="img"><title>호출 횟수보다 위임 구조를 봅니다</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8" fill="#256d73"/></marker></defs><rect width="800" height="560" fill="#faf7ef"/><g font-family="Noto Sans CJK KR, sans-serif"><text x="32" y="52" font-size="30" fill="#183d40" font-weight="700">호출 횟수보다 위임 구조를 봅니다</text><rect x="32" y="90" width="736" height="125" rx="14" fill="white" stroke="#256d73" stroke-width="2"/><text x="54" y="129" font-size="28" fill="#256d73" font-weight="700">반복 호출</text><text x="54" y="173" font-size="26" fill="#183d40" font-weight="400">초안 → 요약 → 재질문</text><rect x="32" y="240" width="736" height="125" rx="14" fill="white" stroke="#256d73" stroke-width="2"/><text x="54" y="279" font-size="28" fill="#256d73" font-weight="700">단일 에이전트</text><text x="54" y="323" font-size="26" fill="#183d40" font-weight="400">검색 · 계산 · 조회 도구 사용</text><rect x="32" y="390" width="736" height="125" rx="14" fill="white" stroke="#256d73" stroke-width="2"/><text x="54" y="429" font-size="28" fill="#256d73" font-weight="700">에이전트 팀</text><text x="54" y="473" font-size="26" fill="#183d40" font-weight="400">목표와 작업 공간을 나누어 위임</text><text x="550" y="429" font-size="25" fill="#a65036" font-weight="700">독립 판단</text></g></svg>