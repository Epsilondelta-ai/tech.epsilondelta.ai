<svg xmlns="http://www.w3.org/2000/svg" width="800" height="715" viewBox="0 0 800 715" role="img"><title>독립적으로 읽고, 한 곳에서 합칩니다</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8" fill="#256d73"/></marker></defs><rect width="800" height="715" fill="#faf7ef"/><g font-family="Noto Sans CJK KR, sans-serif"><text x="32" y="52" font-size="30" fill="#183d40" font-weight="700">독립적으로 읽고, 한 곳에서 합칩니다</text><rect x="32" y="86" width="736" height="86" rx="14" fill="white" stroke="#256d73" stroke-width="2"/><text x="54" y="122" font-size="28" fill="#256d73" font-weight="700">① 공통 기준부터 고정</text><text x="54" y="155" font-size="24" fill="#183d40" font-weight="400">비용 범위 · 대응 시간 정의 · 미기재 처리</text><path d="M400 179 L400 204" fill="none" stroke="#256d73" stroke-width="3" marker-end="url(#a)"/><rect x="32" y="215" width="160" height="100" rx="14" fill="white" stroke="#256d73" stroke-width="2"/><text x="54" y="253" font-size="26" fill="#256d73" font-weight="700">A사 파일</text><text x="54" y="291" font-size="24" fill="#183d40" font-weight="400">원문 위치</text><rect x="224" y="215" width="160" height="100" rx="14" fill="white" stroke="#256d73" stroke-width="2"/><text x="246" y="253" font-size="26" fill="#256d73" font-weight="700">B사 파일</text><text x="246" y="291" font-size="24" fill="#183d40" font-weight="400">원문 위치</text><rect x="416" y="215" width="160" height="100" rx="14" fill="white" stroke="#256d73" stroke-width="2"/><text x="438" y="253" font-size="26" fill="#256d73" font-weight="700">C사 파일</text><text x="438" y="291" font-size="24" fill="#183d40" font-weight="400">원문 위치</text><rect x="608" y="215" width="160" height="100" rx="14" fill="white" stroke="#256d73" stroke-width="2"/><text x="630" y="253" font-size="26" fill="#256d73" font-weight="700">D사 파일</text><text x="630" y="291" font-size="24" fill="#183d40" font-weight="400">원문 위치</text><text x="32" y="353" font-size="26" fill="#183d40" font-weight="400">② 각자 읽고, 출처와 함께 별도 파일에 기록</text><path d="M400 367 L400 394" fill="none" stroke="#256d73" stroke-width="3" marker-end="url(#a)"/><rect x="32" y="405" width="736" height="94" rx="14" fill="white" stroke="#256d73" stroke-width="2"/><text x="54" y="444" font-size="28" fill="#256d73" font-weight="700">③ 합류 책임자 한 곳에서 비교 · 작성</text><text x="54" y="480" font-size="25" fill="#183d40" font-weight="400">원문 대조 → 상충 조항은 인간 판단으로</text><rect x="32" y="527" width="736" height="103" rx="14" fill="white" stroke="#a65036" stroke-width="2"/><text x="54" y="566" font-size="28" fill="#a65036" font-weight="700">④ 탐색 · 토큰 예산 상한에서 중단</text><text x="54" y="605" font-size="25" fill="#183d40" font-weight="400">근거를 못 찾으면 “추가 질의 필요”로 종료</text><text x="32" y="679" font-size="24" fill="#183d40" font-weight="400">가상 구매 사례 · 공급사 수는 이 예시의 조건</text></g></svg>