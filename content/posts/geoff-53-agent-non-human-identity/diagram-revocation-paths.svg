<svg xmlns="http://www.w3.org/2000/svg" width="800" height="981" viewBox="0 0 800 981" role="img" aria-labelledby="title desc"><title id="title">신원 삭제와 자격 증명·세션 회수 경로</title><desc id="desc">신규 발급, 비밀키와 갱신 토큰, 기존 토큰, 교환된 토큰, 외부 세션의 차단을 각각 확인한다. 온라인 검사와 회수 이벤트를 지원하는 리소스는 만료 전 차단이 가능하다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#226c67"/></marker></defs><rect width="800" height="981" rx="22" fill="#f7f5ed"/><g font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif"><text x="36" y="58" font-size="35" font-weight="700" fill="#203747" text-anchor="start">퇴역은 경로마다 차단을 확인</text><rect x="36" y="91" width="728" height="100" rx="18" fill="#f8eddb" stroke="#c8d5d2" stroke-width="2"/><text x="60" y="133" font-size="31" font-weight="700" fill="#203747" text-anchor="start">신원 비활성화·삭제</text><text x="60" y="172" font-size="26" font-weight="400" fill="#203747" text-anchor="start">이 조치만으로 기존 접근 종료를 단정하지 않기</text><rect x="36" y="219" width="728" height="97" rx="18" fill="#fff" stroke="#c8d5d2" stroke-width="2"/><circle cx="65" cy="250" r="8" fill="#226c67" stroke="#226c67" stroke-width="2"/><text x="87" y="259" font-size="29" font-weight="700" fill="#226c67" text-anchor="start">신규 토큰 발급</text><text x="60" y="298" font-size="27" font-weight="400" fill="#203747" text-anchor="start">발급 자격·정책 차단 확인</text><rect x="36" y="334" width="728" height="97" rx="18" fill="#fff" stroke="#c8d5d2" stroke-width="2"/><circle cx="65" cy="365" r="8" fill="#226c67" stroke="#226c67" stroke-width="2"/><text x="87" y="374" font-size="29" font-weight="700" fill="#226c67" text-anchor="start">비밀키·갱신 토큰</text><text x="60" y="413" font-size="27" font-weight="400" fill="#203747" text-anchor="start">교체·회수로 재발급 경로 차단</text><rect x="36" y="449" width="728" height="97" rx="18" fill="#fff" stroke="#c8d5d2" stroke-width="2"/><circle cx="65" cy="480" r="8" fill="#226c67" stroke="#226c67" stroke-width="2"/><text x="87" y="489" font-size="29" font-weight="700" fill="#226c67" text-anchor="start">기존 액세스 토큰</text><text x="60" y="528" font-size="27" font-weight="400" fill="#203747" text-anchor="start">온라인 검사·회수 지원 또는 만료</text><rect x="36" y="564" width="728" height="97" rx="18" fill="#fff" stroke="#c8d5d2" stroke-width="2"/><circle cx="65" cy="595" r="8" fill="#226c67" stroke="#226c67" stroke-width="2"/><text x="87" y="604" font-size="29" font-weight="700" fill="#226c67" text-anchor="start">교환된 하위 토큰</text><text x="60" y="643" font-size="27" font-weight="400" fill="#203747" text-anchor="start">상위 회수의 자동 전파를 가정하지 않기</text><rect x="36" y="679" width="728" height="97" rx="18" fill="#fff" stroke="#c8d5d2" stroke-width="2"/><circle cx="65" cy="710" r="8" fill="#226c67" stroke="#226c67" stroke-width="2"/><text x="87" y="719" font-size="29" font-weight="700" fill="#226c67" text-anchor="start">외부 서비스 세션</text><text x="60" y="758" font-size="27" font-weight="400" fill="#203747" text-anchor="start">서비스별 세션 종료·접근 차단 확인</text><rect x="36" y="818" width="728" height="129" rx="18" fill="#e5efea" stroke="#226c67" stroke-width="2"/><text x="60" y="863" font-size="29" font-weight="700" fill="#203747" text-anchor="start">만료 전 차단도 가능: 지원 경로에 한해</text><text x="60" y="905" font-size="27" font-weight="400" fill="#203747" text-anchor="start">자체 검증만 하는 API에는 잔여 접근 가능</text><text x="60" y="937" font-size="25" font-weight="400" fill="#203747" text-anchor="start">서비스별 실제 차단 시점을 확인</text></g></svg>