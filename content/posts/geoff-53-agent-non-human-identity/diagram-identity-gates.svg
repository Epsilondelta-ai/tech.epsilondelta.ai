<svg xmlns="http://www.w3.org/2000/svg" width="800" height="788" viewBox="0 0 800 788" role="img" aria-labelledby="title desc"><title id="title">신원과 인바운드·아웃바운드 권한</title><desc id="desc">에이전트 신원은 행위자를 식별하며 직원의 호출 허용과 업무 API 접근 허용은 별도 출입문이다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#226c67"/></marker></defs><rect width="800" height="788" rx="22" fill="#f7f5ed"/><g font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif"><text x="36" y="59" font-size="36" font-weight="700" fill="#203747" text-anchor="start">사번과 두 출입문을 나누기</text><text x="36" y="105" font-size="28" font-weight="400" fill="#203747" text-anchor="start">비인간 신원: 소프트웨어 행위자의 식별</text><rect x="210" y="139" width="380" height="153" rx="18" fill="#e5efea" stroke="#c8d5d2" stroke-width="2"/><circle cx="259" cy="184" r="20" fill="#fff" stroke="#226c67" stroke-width="2"/><rect x="238" y="212" width="42" height="35" rx="5" fill="#226c67" stroke="#226c67" stroke-width="2"/><text x="307" y="190" font-size="31" font-weight="700" fill="#203747" text-anchor="start">에이전트 신원</text><text x="307" y="239" font-size="27" font-weight="400" fill="#203747" text-anchor="start">누가 실행했는가</text><rect x="36" y="361" width="194" height="125" rx="18" fill="#fff" stroke="#c8d5d2" stroke-width="2"/><text x="133" y="413" font-size="32" font-weight="700" fill="#203747" text-anchor="middle">직원</text><text x="133" y="456" font-size="27" font-weight="400" fill="#203747" text-anchor="middle">요청 주체</text><rect x="303" y="361" width="194" height="125" rx="18" fill="#e5efea" stroke="#c8d5d2" stroke-width="2"/><text x="400" y="413" font-size="31" font-weight="700" fill="#203747" text-anchor="middle">에이전트</text><text x="400" y="456" font-size="27" font-weight="400" fill="#203747" text-anchor="middle">실행 주체</text><rect x="570" y="361" width="194" height="125" rx="18" fill="#fff" stroke="#c8d5d2" stroke-width="2"/><text x="667" y="413" font-size="31" font-weight="700" fill="#203747" text-anchor="middle">업무 API</text><text x="667" y="456" font-size="26" font-weight="400" fill="#203747" text-anchor="middle">ERP · 계약</text><path d="M230 422 L296 422" stroke="#226c67" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M497 422 L563 422" stroke="#226c67" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M400 292 L400 350" stroke="#226c67" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="182" y="333" font-size="28" font-weight="700" fill="#226c67" text-anchor="start">호출 허용</text><text x="512" y="333" font-size="28" font-weight="700" fill="#226c67" text-anchor="start">접근 허용</text><rect x="36" y="529" width="728" height="120" rx="18" fill="#fff" stroke="#c8d5d2" stroke-width="2"/><text x="60" y="575" font-size="29" font-weight="700" fill="#203747" text-anchor="start">직원 → 에이전트: 누가 부를 수 있나</text><text x="60" y="621" font-size="29" font-weight="700" fill="#203747" text-anchor="start">에이전트 → API: 어떤 작업을 할 수 있나</text><text x="36" y="705" font-size="28" font-weight="400" fill="#203747" text-anchor="start">신원 단위는 업무 책임·배포 방식에 맞게</text><text x="36" y="748" font-size="28" font-weight="400" fill="#203747" text-anchor="start">개별 실행은 별도 실행 식별자로 추적</text></g></svg>