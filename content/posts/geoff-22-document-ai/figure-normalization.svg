<svg xmlns="http://www.w3.org/2000/svg" width="800" height="460" viewBox="0 0 800 460" role="img" aria-label="원문 값과 계산 결과는 다릅니다"><rect width="800" height="460" rx="24" fill="#faf7ef"/><style>text{font-family:'Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#193b43}.h{font-size:27px;font-weight:700}.t{font-size:22px}.s{font-size:18px}.n{font-size:32px;font-weight:700}</style><text class="h" x="32" y="49">원문 값과 계산 결과는 다릅니다</text><rect x="32" y="85" width="340" height="240" rx="15" fill="white"/><text class="h" x="54" y="125">원문 근거</text><text class="t" x="54" y="178">표의 가격: 90,000원 / 박스</text><text class="t" x="54" y="226">각주: 1박스 10개입</text><text class="s" x="54" y="279">문서·페이지·위치 보존</text><text class="n" x="390" y="207">→</text><rect x="443" y="85" width="325" height="240" rx="15" fill="#e1eee8"/><text class="h" x="465" y="125">코드로 환산</text><text class="t" x="465" y="186">90,000 ÷ 10</text><text class="n" x="465" y="242">개당 9,000원</text><text class="s" x="465" y="281">계산식과 단위를 함께 저장</text><rect x="32" y="352" width="736" height="70" rx="15" fill="#f4e1d7"/><text class="t" x="55" y="395">결과를 검토할 때 원문 가격과 각주까지 바로 확인</text></svg>
