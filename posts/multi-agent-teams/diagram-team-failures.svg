<svg xmlns="http://www.w3.org/2000/svg" width="800" height="560" viewBox="0 0 800 560" role="img"><title>분업 규칙이 없으면 생기는 네 문제</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8" fill="#256d73"/></marker></defs><rect width="800" height="560" fill="#faf7ef"/><g font-family="Noto Sans CJK KR, sans-serif"><text x="32" y="52" font-size="30" fill="#183d40" font-weight="700">분업 규칙이 없으면 생기는 네 문제</text><rect x="32" y="90" width="352" height="200" rx="14" fill="white" stroke="#a65036" stroke-width="2"/><text x="54" y="135" font-size="28" fill="#a65036" font-weight="700">중복 · 덮어쓰기</text><text x="54" y="188" font-size="26" fill="#183d40" font-weight="400">같은 일을 반복</text><text x="54" y="231" font-size="26" fill="#183d40" font-weight="400">공유 파일 수정 충돌</text><rect x="416" y="90" width="352" height="200" rx="14" fill="white" stroke="#a65036" stroke-width="2"/><text x="438" y="135" font-size="28" fill="#a65036" font-weight="700">가정의 충돌</text><text x="438" y="188" font-size="26" fill="#183d40" font-weight="400">같은 항목을</text><text x="438" y="231" font-size="26" fill="#183d40" font-weight="400">서로 다른 뜻으로 해석</text><rect x="32" y="320" width="352" height="200" rx="14" fill="white" stroke="#a65036" stroke-width="2"/><text x="54" y="365" font-size="28" fill="#a65036" font-weight="700">같은 오답에 동의</text><text x="54" y="418" font-size="26" fill="#183d40" font-weight="400">동의한 수보다</text><text x="54" y="461" font-size="26" fill="#183d40" font-weight="400">원문 근거를 확인</text><rect x="416" y="320" width="352" height="200" rx="14" fill="white" stroke="#a65036" stroke-width="2"/><text x="438" y="365" font-size="28" fill="#a65036" font-weight="700">조율 · 비용 증가</text><text x="438" y="418" font-size="26" fill="#183d40" font-weight="400">대기 · 재시도 · 병합</text><text x="438" y="461" font-size="26" fill="#183d40" font-weight="400">모두 비용에 포함</text></g></svg>