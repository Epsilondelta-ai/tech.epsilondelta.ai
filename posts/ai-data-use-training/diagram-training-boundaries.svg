<svg xmlns="http://www.w3.org/2000/svg" width="800" height="744" viewBox="0 0 800 744" role="img" aria-labelledby="title desc">
<title id="title">고객 미세조정과 공급자 모델 개선의 경계</title><desc id="desc">고객 전용 학습 작업과 범용 모델 개선을 나누고 API 기본 학습 제외의 명시적 공유 옵트인 예외 및 실제 계약과 설정 확인을 표시합니다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#24736d"/></marker></defs>
<rect width="800" height="744" rx="22" fill="#f5f5ee"/>
<g font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif"><text x="36" y="55" font-size="36" font-weight="700" fill="#203747" text-anchor="start">학습의 목적과 접근 범위를 나누기</text><text x="36" y="96" font-size="28" font-weight="400" fill="#203747" text-anchor="start">고객용 미세조정과 공급자 개선은 별도 경로</text><rect x="28" y="124" width="744" height="228" rx="18" fill="#e7efeb" stroke="#cbd7d5" stroke-width="2"/><text x="48" y="169" font-size="33" font-weight="700" fill="#24736d" text-anchor="start">고객 전용 미세조정</text><text x="48" y="219" font-size="30" font-weight="400" fill="#203747" text-anchor="start">승인 예제 → 별도 학습 작업 → 평가</text><text x="48" y="263" font-size="30" font-weight="400" fill="#203747" text-anchor="start">결과: 고객용 모델 또는 어댑터</text><text x="48" y="312" font-size="28" font-weight="400" fill="#203747" text-anchor="start">학습·검증 파일과 결과 모델을 각각 관리</text><rect x="28" y="378" width="744" height="228" rx="18" fill="#ffffff" stroke="#cbd7d5" stroke-width="2"/><text x="48" y="423" font-size="33" font-weight="700" fill="#17364b" text-anchor="start">공급자 범용 모델 개선</text><text x="48" y="473" font-size="29" font-weight="400" fill="#203747" text-anchor="start">OpenAI API 입출력: 기본 학습·개선 제외</text><text x="48" y="517" font-size="30" font-weight="700" fill="#203747" text-anchor="start">명시적 공유 옵트인은 예외 경로</text><text x="48" y="566" font-size="28" font-weight="400" fill="#203747" text-anchor="start">실제 제품 · 계정 · 계약 · 설정을 확인</text><text x="36" y="662" font-size="32" font-weight="700" fill="#203747" text-anchor="start">전용 사용 = 접근 범위</text><text x="36" y="707" font-size="28" font-weight="400" fill="#203747" text-anchor="start">전용 물리 서버 제공까지 뜻하지는 않습니다.</text></g></svg>