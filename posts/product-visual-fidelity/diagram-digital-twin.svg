    <text x="360" y="357" font-size="29">시장 선택 · 카메라 · 배경과 조명</text>
    <path d="M360 373v25m-7-8 7 8 7-8" fill="none" stroke="#537c6e" stroke-width="3" stroke-linejoin="round"/>
    <rect x="100" y="405" width="520" height="68" rx="14" fill="#fff9ec" stroke="#ac774b" stroke-width="2"/>
    <text x="360" y="451" fill="#5e381e" font-size="34" font-weight="700">완성본 검수</text>
  </g>
