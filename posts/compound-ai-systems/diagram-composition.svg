<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480" role="img"><title>모델 수보다 역할과 실행 순서를 봅니다</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#256d73"/></marker></defs><rect width="800" height="480" fill="#faf7ef"/><g font-family="Noto Sans CJK KR, sans-serif"><text x="30" y="48" font-size="29" fill="#183d40" font-weight="700">모델 수보다 역할과 실행 순서를 봅니다</text><rect x="30" y="85" width="350" height="130" rx="14" fill="white" stroke="#256d73" stroke-width="2"/><text x="50" y="121" font-size="24" fill="#256d73" font-weight="700">단일 호출로 충분한 일</text><text x="50" y="157" font-size="20" fill="#183d40" font-weight="400">완결된 메모 → 모델 → 문체 수정</text><rect x="420" y="85" width="350" height="130" rx="14" fill="white" stroke="#256d73" stroke-width="2"/><text x="440" y="121" font-size="24" fill="#256d73" font-weight="700">외부 부품이 필요한 일</text><text x="440" y="157" font-size="20" fill="#183d40" font-weight="400">요청 → 원장 조회 · 계산 · 검증</text><rect x="30" y="250" width="350" height="170" rx="14" fill="white" stroke="#256d73" stroke-width="2"/><text x="50" y="286" font-size="24" fill="#256d73" font-weight="700">워크플로</text><text x="50" y="322" font-size="20" fill="#183d40" font-weight="400">코드가 다음 단계를 정함</text><text x="50" y="353" font-size="20" fill="#183d40" font-weight="400">정해진 반복 절차</text><text x="50" y="384" font-size="20" fill="#183d40" font-weight="400">예외 판단에만 모델을 쓸 수도 있음</text><rect x="420" y="250" width="350" height="170" rx="14" fill="white" stroke="#256d73" stroke-width="2"/><text x="440" y="286" font-size="24" fill="#256d73" font-weight="700">에이전트</text><text x="440" y="322" font-size="20" fill="#183d40" font-weight="400">모델이 다음 행동을 고름</text><text x="440" y="353" font-size="20" fill="#183d40" font-weight="400">상황에 따라 도구 선택</text><text x="440" y="384" font-size="20" fill="#183d40" font-weight="400">멀티에이전트는 여러 구성 중 하나</text></g></svg>