<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480" role="img"><title>인계 계약: 값과 함께 의미·근거·상태를 넘깁니다</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#256d73"/></marker></defs><rect width="800" height="480" fill="#faf7ef"/><g font-family="Noto Sans CJK KR, sans-serif"><text x="30" y="48" font-size="29" fill="#183d40" font-weight="700">인계 계약: 값과 함께 의미·근거·상태를 넘깁니다</text><rect x="30" y="85" width="355" height="205" rx="14" fill="white" stroke="#256d73" stroke-width="2"/><text x="50" y="121" font-size="24" fill="#256d73" font-weight="700">수량: 2만 넘기면 모호합니다</text><text x="50" y="157" font-size="20" fill="#183d40" font-weight="400">수량: 2 / 단위: 박스</text><text x="50" y="188" font-size="20" fill="#183d40" font-weight="400">의미: 기존 주문에 추가</text><text x="50" y="219" font-size="20" fill="#183d40" font-weight="400">입수량: 24개/박스</text><text x="50" y="250" font-size="20" fill="#183d40" font-weight="400">계산 결과: 추가 48개</text><rect x="415" y="85" width="355" height="205" rx="14" fill="white" stroke="#256d73" stroke-width="2"/><text x="435" y="121" font-size="24" fill="#256d73" font-weight="700">함께 넘길 조회 근거</text><text x="435" y="157" font-size="20" fill="#183d40" font-weight="400">확정 주문 ID · 상품 ID</text><text x="435" y="188" font-size="20" fill="#183d40" font-weight="400">원장 버전 · 조회 시각</text><text x="435" y="219" font-size="20" fill="#183d40" font-weight="400">가격 유효기간</text><text x="435" y="250" font-size="20" fill="#183d40" font-weight="400">계산 규칙 버전</text><rect x="30" y="320" width="740" height="125" rx="14" fill="white" stroke="#a65036" stroke-width="2"/><text x="50" y="356" font-size="24" fill="#a65036" font-weight="700">조회 상태를 빈칸이나 0으로 숨기지 않습니다</text><text x="50" y="392" font-size="20" fill="#183d40" font-weight="400">정상 / 결과 없음 / 대상 모호 / 조회 불가</text><text x="50" y="423" font-size="20" fill="#183d40" font-weight="400">모호·실패 시 확인 요청 · 저장 재시도는 멱등 키와 재조회</text></g></svg>