<svg xmlns="http://www.w3.org/2000/svg" width="800" height="655" viewBox="0 0 800 655"><title>잘못된 병합 분리와 연결된 시스템 정정</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#597674" stroke-width="1.5"/></marker></defs><rect width="800" height="655" rx="20" fill="#FAF7F0"/><g fill="#243E40" font-family="Noto Sans CJK KR, sans-serif"><text x="30" y="48" font-size="29" font-weight="700">중심 데이터 분리에서 끝내지 않습니다</text><rect x="30" y="80" width="740" height="90" rx="12" fill="#F4E7DA"/><text x="50" y="113" font-size="25" font-weight="700">1  고위험 행동 보류</text><text x="50" y="149" font-size="22" font-weight="500">자동 청구·계약 변경·외부 발송을 멈춤</text><path d="M400 172 L400 188" stroke="#597674" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="30" y="192" width="740" height="90" rx="12" fill="#E8EFEB"/><text x="50" y="225" font-size="25" font-weight="700">2  원천 기준 분리·재산출</text><text x="50" y="261" font-size="22" font-weight="500">법인·사업장을 분리하고 대응표·대표값 재계산</text><path d="M400 284 L400 300" stroke="#597674" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="30" y="304" width="740" height="90" rx="12" fill="#E8EFEB"/><text x="50" y="337" font-size="25" font-weight="700">3  이력 보존·재병합 방지</text><text x="50" y="373" font-size="22" font-weight="500">원천 키·분리 이력·새 버전·차단 규칙 보존</text><path d="M400 396 L400 412" stroke="#597674" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="30" y="416" width="740" height="90" rx="12" fill="#E8EFEB"/><text x="50" y="449" font-size="25" font-weight="700">4  정정 이벤트 전파</text><text x="50" y="485" font-size="22" font-weight="500">CRM · 지원 · 분석 · 검색 · AI 캐시 · 대기 작업</text><path d="M400 508 L400 524" stroke="#597674" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="30" y="528" width="740" height="90" rx="12" fill="#F4E7DA"/><text x="50" y="561" font-size="25" font-weight="700">5  반영 확인·기실행 업무 수습</text><text x="50" y="597" font-size="22" font-weight="500">시스템별 완료 확인 + 청구서·문의 별도 정정</text></g></svg>