<svg xmlns="http://www.w3.org/2000/svg" width="800" height="645" viewBox="0 0 800 645"><title>원천 ID 대응표와 담당자 관계</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#597674" stroke-width="1.5"/></marker></defs><rect width="800" height="645" rx="20" fill="#FAF7F0"/><g fill="#243E40" font-family="Noto Sans CJK KR, sans-serif"><text x="30" y="48" font-size="30" font-weight="700">원천 번호를 남기는 대응표</text><text x="30" y="86" font-size="23" font-weight="500">동일 법인 확인 후 매핑 · 원래 ID는 보존</text><rect x="30" y="115" width="345" height="76" rx="12" fill="#E8EFEB"/><text x="48" y="144" font-size="22" font-weight="700">영업 CRM</text><text x="48" y="174" font-size="23" font-weight="500">account/A-018</text><path d="M385 153 L464 245" stroke="#597674" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="30" y="207" width="345" height="76" rx="12" fill="#E8EFEB"/><text x="48" y="236" font-size="22" font-weight="700">재무 ERP</text><text x="48" y="266" font-size="23" font-weight="500">customer/00731</text><path d="M385 245 L464 245" stroke="#597674" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="30" y="299" width="345" height="76" rx="12" fill="#E8EFEB"/><text x="48" y="328" font-size="22" font-weight="700">고객지원</text><text x="48" y="358" font-size="23" font-weight="500">organization/O-92</text><path d="M385 337 L464 245" stroke="#597674" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="480" y="175" width="290" height="141" rx="12" fill="#E8EFEB"/><text x="501" y="213" font-size="23" font-weight="500">확인된 동일 법인</text><text x="501" y="254" font-size="30" font-weight="700">ORG-0042</text><text x="501" y="292" font-size="23" font-weight="500">가온테크</text><rect x="30" y="400" width="345" height="85" rx="12" fill="#F4E7DA"/><text x="48" y="432" font-size="23" font-weight="700">담당자 · 별도 인물</text><text x="48" y="466" font-size="23" font-weight="500">contact/P-11</text><path d="M385 440 H440 V345 H620 V320" stroke="#597674" stroke-width="3" stroke-dasharray="7 5" fill="none" marker-end="url(#arrow)"/><text x="480" y="404" font-size="21" font-weight="500">소속 관계만 연결</text><text x="480" y="440" font-size="20" font-weight="500">법인 ID로 병합하지 않음</text><rect x="30" y="509" width="740" height="109" rx="12" fill="#E8EFEB"/><text x="50" y="544" font-size="24" font-weight="700">대응표에 함께 보존할 정보</text><text x="50" y="585" font-size="21" font-weight="500">원천 시스템 · 대상 유형 · ID · 근거 · 유효 시점 · 버전</text></g></svg>