<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
<title id="title">업무 ID로 연결하는 여섯 증거 묶음</title><desc id="desc">당시 입력, 정책, 실행 버전, 권한과 위임, 승인 대상, 실행과 결과를 업무 ID로 연결한다. 정책 원문과 실제 승인 요청을 보존하며 같은 모델의 결정론적 재생을 뜻하지 않는다.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#236c69" stroke-width="1.5"/></marker></defs>
<rect width="800" height="500" rx="22" fill="#f5f2e9"/>
<g font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif"><text x="32" y="48" font-size="33" fill="#172c3b" font-weight="700" text-anchor="start">당시 값으로 연결하는 여섯 증거 묶음</text><rect x="210" y="67" width="380" height="57" rx="16" fill="#172c3b" stroke="#172c3b" stroke-width="2"/><text x="400" y="106" font-size="28" fill="#ffffff" font-weight="700" text-anchor="middle">업무 ID · 실행 시도 연결</text><rect x="32" y="144" width="352" height="78" rx="16" fill="#ffffff" stroke="#c5d3d0" stroke-width="2"/><text x="50" y="176" font-size="28" fill="#236c69" font-weight="700" text-anchor="start">당시 입력</text><text x="50" y="207" font-size="25" fill="#172c3b" font-weight="500" text-anchor="start">실제 문맥·검색 버전</text><rect x="416" y="144" width="352" height="78" rx="16" fill="#ffffff" stroke="#c5d3d0" stroke-width="2"/><text x="434" y="176" font-size="28" fill="#236c69" font-weight="700" text-anchor="start">적용 정책</text><text x="434" y="207" font-size="25" fill="#172c3b" font-weight="500" text-anchor="start">원문·리비전·판정</text><rect x="32" y="235" width="352" height="78" rx="16" fill="#ffffff" stroke="#c5d3d0" stroke-width="2"/><text x="50" y="267" font-size="28" fill="#236c69" font-weight="700" text-anchor="start">실행 버전</text><text x="50" y="298" font-size="25" fill="#172c3b" font-weight="500" text-anchor="start">모델·프롬프트·도구</text><rect x="416" y="235" width="352" height="78" rx="16" fill="#ffffff" stroke="#c5d3d0" stroke-width="2"/><text x="434" y="267" font-size="28" fill="#236c69" font-weight="700" text-anchor="start">권한·위임</text><text x="434" y="298" font-size="25" fill="#172c3b" font-weight="500" text-anchor="start">주체·위임 범위</text><rect x="32" y="326" width="352" height="78" rx="16" fill="#ffffff" stroke="#c5d3d0" stroke-width="2"/><text x="50" y="358" font-size="28" fill="#236c69" font-weight="700" text-anchor="start">승인 결합</text><text x="50" y="389" font-size="25" fill="#172c3b" font-weight="500" text-anchor="start">대상 요청·금액·계좌</text><rect x="416" y="326" width="352" height="78" rx="16" fill="#ffffff" stroke="#c5d3d0" stroke-width="2"/><text x="434" y="358" font-size="28" fill="#236c69" font-weight="700" text-anchor="start">실행·결과</text><text x="434" y="389" font-size="25" fill="#172c3b" font-weight="500" text-anchor="start">API 응답·원장 상태</text><text x="400" y="462" font-size="27" fill="#ad4936" font-weight="500" text-anchor="middle">해시·별칭만으로 당시 원문을 복원할 수 없음</text></g></svg>