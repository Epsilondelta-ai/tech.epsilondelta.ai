<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
<title id="title">민감 정보 분리 보관과 무결성 검증의 경계</title><desc id="desc">일상 관측에는 마스킹 사본과 메타데이터를 두고 감사 보관소의 원문은 권한과 보존 기간을 제한한다. 최소 수집, 보존 만료, 유실을 구분한다. 해시와 서명은 수집 후 변경 탐지를 돕지만 입력의 진실성이나 수집 전 누락을 증명하지 않는다.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#236c69" stroke-width="1.5"/></marker></defs>
<rect width="800" height="500" rx="22" fill="#f5f2e9"/>
<g font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif"><text x="32" y="48" font-size="33" fill="#172c3b" font-weight="700" text-anchor="start">분리 보관하고, 검증의 경계를 남기기</text><rect x="32" y="78" width="352" height="153" rx="16" fill="#ffffff" stroke="#c5d3d0" stroke-width="2"/><rect x="416" y="78" width="352" height="153" rx="16" fill="#e6efeb" stroke="#c5d3d0" stroke-width="2"/><text x="54" y="119" font-size="29" fill="#236c69" font-weight="700" text-anchor="start">일상 관측 도구</text><text x="54" y="164" font-size="28" fill="#172c3b" font-weight="500" text-anchor="start">마스킹 사본</text><text x="54" y="204" font-size="27" fill="#172c3b" font-weight="500" text-anchor="start">메타데이터</text><text x="438" y="119" font-size="29" fill="#236c69" font-weight="700" text-anchor="start">제한된 감사 보관소</text><text x="438" y="164" font-size="27" fill="#172c3b" font-weight="500" text-anchor="start">필요 원문·열람 이력</text><text x="438" y="204" font-size="27" fill="#172c3b" font-weight="500" text-anchor="start">권한·보존 기간 제한</text><text x="400" y="272" font-size="27" fill="#172c3b" font-weight="500" text-anchor="middle">빈 항목: 최소 수집 / 보존 만료 / 수집 유실</text><rect x="32" y="299" width="736" height="164" rx="16" fill="#fff5ed" stroke="#ddc7b9" stroke-width="2"/><text x="54" y="338" font-size="28" fill="#236c69" font-weight="700" text-anchor="start">수집 경계 → 정기 무결성 검증 → 원장 대조</text><text x="54" y="386" font-size="28" fill="#172c3b" font-weight="500" text-anchor="start">해시·서명: 수집 후 변경·삭제 탐지</text><text x="54" y="433" font-size="28" fill="#ad4936" font-weight="700" text-anchor="start">입력의 진실성·수집 전 누락은 별도 확인</text></g></svg>