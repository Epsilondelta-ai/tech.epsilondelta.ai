<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
<title id="title">원장 기준 역추적과 삼분법 판정</title><desc id="desc">원장 모집단에서 시작해 실행과 재시도, 승인 범위, 당시 정책·권한·입력, 독립 원장을 대조하고 증거로 확인·불일치·자료 부족으로 미확인으로 나눈다. 누락된 실행은 예외로 남긴다.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#236c69" stroke-width="1.5"/></marker></defs>
<rect width="800" height="500" rx="22" fill="#f5f2e9"/>
<g font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif"><text x="32" y="48" font-size="33" fill="#172c3b" font-weight="700" text-anchor="start">원장에서 출발해 과거 조건으로 역추적</text><rect x="32" y="83" width="224" height="108" rx="16" fill="#e6efeb" stroke="#c5d3d0" stroke-width="2"/><text x="48" y="122" font-size="27" fill="#236c69" font-weight="700" text-anchor="start">1  원장 모집단</text><text x="48" y="164" font-size="25" fill="#172c3b" font-weight="500" text-anchor="start">완료·실패·취소</text><path d="M259 137 L284 137" fill="none" stroke="#236c69" stroke-width="3" marker-end="url(#arrow)"/><rect x="288" y="83" width="224" height="108" rx="16" fill="#ffffff" stroke="#c5d3d0" stroke-width="2"/><text x="304" y="122" font-size="27" fill="#236c69" font-weight="700" text-anchor="start">2  실행·재시도</text><text x="304" y="164" font-size="25" fill="#172c3b" font-weight="500" text-anchor="start">업무 ID로 연결</text><path d="M515 137 L540 137" fill="none" stroke="#236c69" stroke-width="3" marker-end="url(#arrow)"/><rect x="544" y="83" width="224" height="108" rx="16" fill="#ffffff" stroke="#c5d3d0" stroke-width="2"/><text x="560" y="122" font-size="27" fill="#236c69" font-weight="700" text-anchor="start">3  승인 범위</text><text x="560" y="164" font-size="25" fill="#172c3b" font-weight="500" text-anchor="start">금액·계좌·요청</text><rect x="32" y="229" width="352" height="108" rx="16" fill="#ffffff" stroke="#c5d3d0" stroke-width="2"/><text x="48" y="268" font-size="27" fill="#236c69" font-weight="700" text-anchor="start">4  당시 판단 조건</text><text x="48" y="310" font-size="25" fill="#172c3b" font-weight="500" text-anchor="start">정책·권한·입력</text><rect x="416" y="229" width="352" height="108" rx="16" fill="#ffffff" stroke="#c5d3d0" stroke-width="2"/><text x="432" y="268" font-size="27" fill="#236c69" font-weight="700" text-anchor="start">5  독립 원장 대조</text><text x="432" y="310" font-size="25" fill="#172c3b" font-weight="500" text-anchor="start">실패·취소·역분개</text><path d="M656 191 L656 211 L208 211 L208 225" fill="none" stroke="#236c69" stroke-width="3" marker-end="url(#arrow)"/><path d="M387 283 L413 283" fill="none" stroke="#236c69" stroke-width="3" marker-end="url(#arrow)"/><text x="32" y="378" font-size="29" fill="#172c3b" font-weight="700" text-anchor="start">6  판정 · 누락은 예외로 남기기</text><rect x="32" y="401" width="228" height="61" rx="16" fill="#ffffff" stroke="#c5d3d0" stroke-width="2"/><text x="146.0" y="441" font-size="26" fill="#236c69" font-weight="700" text-anchor="middle">증거로 확인</text><rect x="276" y="401" width="180" height="61" rx="16" fill="#ffffff" stroke="#c5d3d0" stroke-width="2"/><text x="366.0" y="441" font-size="26" fill="#ad4936" font-weight="700" text-anchor="middle">불일치</text><rect x="472" y="401" width="296" height="61" rx="16" fill="#ffffff" stroke="#c5d3d0" stroke-width="2"/><text x="620.0" y="441" font-size="26" fill="#172c3b" font-weight="700" text-anchor="middle">자료 부족으로 미확인</text></g></svg>