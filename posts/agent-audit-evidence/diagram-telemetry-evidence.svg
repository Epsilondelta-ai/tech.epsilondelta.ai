<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
<title id="title">운영 관측과 감사 증거의 수집 경로</title><desc id="desc">운영 관측의 표본 추출과 수집 유실은 특정 거래의 증거 존재를 보장하지 않는다. 위험 업무는 합의된 범위에서 별도로 보존하고 의도적 제외와 유실을 구분한다.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#236c69" stroke-width="1.5"/></marker></defs>
<rect width="800" height="500" rx="22" fill="#f5f2e9"/>
<g font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif"><text x="32" y="49" font-size="34" fill="#172c3b" font-weight="700" text-anchor="start">운영 관측과 감사 증거의 수집 경로</text><rect x="32" y="78" width="350" height="265" rx="16" fill="#ffffff" stroke="#c5d3d0" stroke-width="2"/><rect x="418" y="78" width="350" height="265" rx="16" fill="#e6efeb" stroke="#c5d3d0" stroke-width="2"/><text x="55" y="122" font-size="30" fill="#236c69" font-weight="700" text-anchor="start">운영 텔레메트리</text><text x="442" y="122" font-size="30" fill="#236c69" font-weight="700" text-anchor="start">위험 업무의 증거</text><text x="55" y="177" font-size="26" fill="#172c3b" font-weight="500" text-anchor="start">지연·오류 진단</text><text x="55" y="225" font-size="26" fill="#172c3b" font-weight="500" text-anchor="start">표본 추출·전송 유실</text><text x="55" y="293" font-size="26" fill="#172c3b" font-weight="500" text-anchor="start">특정 건 존재는 미보장</text><text x="442" y="177" font-size="26" fill="#172c3b" font-weight="500" text-anchor="start">업무 ID로 별도 보존</text><text x="442" y="225" font-size="26" fill="#172c3b" font-weight="500" text-anchor="start">성공·거절·실패</text><text x="442" y="273" font-size="26" fill="#172c3b" font-weight="500" text-anchor="start">취소·보상 처리 포함</text><rect x="32" y="365" width="736" height="102" rx="16" fill="#fff5ed" stroke="#ddc7b9" stroke-width="2"/><text x="54" y="405" font-size="28" fill="#ad4936" font-weight="700" text-anchor="start">빈 기록의 사유를 구분</text><text x="54" y="446" font-size="28" fill="#172c3b" font-weight="500" text-anchor="start">의도적 수집 제외  /  장애로 유실</text></g></svg>