<svg xmlns="http://www.w3.org/2000/svg" width="800" height="850" viewBox="0 0 800 850"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8" fill="#237780"/></marker></defs><rect width="800" height="850" fill="#f7f5ee"/><g font-family="Noto Sans CJK KR, sans-serif"><text x="32" y="53" font-size="34" fill="#193d43" font-weight="700">현장 파일럿 전, 확인할 다섯 가지</text><rect x="28" y="87" width="744" height="117" rx="18" fill="white" stroke="#c9d8d5" stroke-width="2"/><circle cx="69" cy="130" r="23" fill="#237780"/><text x="60" y="140" font-size="28" fill="white" font-weight="700">1</text><text x="109" y="135" font-size="31" fill="#237780" font-weight="700">목적</text><text x="52" y="180" font-size="29" fill="#193d43" font-weight="400">어떤 의사결정을 앞당기나요?</text><rect x="28" y="223" width="744" height="117" rx="18" fill="white" stroke="#c9d8d5" stroke-width="2"/><circle cx="69" cy="266" r="23" fill="#237780"/><text x="60" y="276" font-size="28" fill="white" font-weight="700">2</text><text x="109" y="271" font-size="31" fill="#237780" font-weight="700">낯선 조건</text><text x="52" y="316" font-size="29" fill="#193d43" font-weight="400">학습 밖의 조건에서도 평가했나요?</text><rect x="28" y="359" width="744" height="117" rx="18" fill="white" stroke="#c9d8d5" stroke-width="2"/><circle cx="69" cy="402" r="23" fill="#237780"/><text x="60" y="412" font-size="28" fill="white" font-weight="700">3</text><text x="109" y="407" font-size="31" fill="#237780" font-weight="700">실물 대조</text><text x="52" y="452" font-size="29" fill="#193d43" font-weight="400">같은 과제·지표로 비교했나요?</text><rect x="28" y="495" width="744" height="117" rx="18" fill="white" stroke="#c9d8d5" stroke-width="2"/><circle cx="69" cy="538" r="23" fill="#237780"/><text x="60" y="548" font-size="28" fill="white" font-weight="700">4</text><text x="109" y="543" font-size="31" fill="#237780" font-weight="700">운영 부담</text><text x="52" y="588" font-size="29" fill="#193d43" font-weight="400">분모·개입·복구 시간을 기록했나요?</text><rect x="28" y="631" width="744" height="117" rx="18" fill="white" stroke="#c9d8d5" stroke-width="2"/><circle cx="69" cy="674" r="23" fill="#237780"/><text x="60" y="684" font-size="28" fill="white" font-weight="700">5</text><text x="109" y="679" font-size="31" fill="#237780" font-weight="700">변경 관리</text><text x="52" y="724" font-size="29" fill="#193d43" font-weight="400">조건이 바뀌면 누가 다시 맞추나요?</text><text x="44" y="808" font-size="30" fill="#ac5b2e" font-weight="700">가상 시험 결과 → 실물 비교의 출발점</text></g></svg>