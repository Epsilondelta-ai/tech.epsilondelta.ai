<svg xmlns="http://www.w3.org/2000/svg" width="800" height="830" viewBox="0 0 800 830"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8" fill="#237780"/></marker></defs><rect width="800" height="830" fill="#f7f5ee"/><g font-family="Noto Sans CJK KR, sans-serif"><text x="32" y="53" font-size="36" fill="#193d43" font-weight="700">반복 시험은 모델 보정부터</text><rect x="28" y="86" width="744" height="132" rx="18" fill="white" stroke="#c9d8d5" stroke-width="2"/><text x="52" y="131" font-size="32" fill="#237780" font-weight="700">① 실물 측정 → 모델 보정</text><text x="52" y="179" font-size="29" fill="#193d43" font-weight="400">질량·마찰·반응 지연을 실제 장비와 맞추기</text><path d="M400 224 L400 257" fill="none" stroke="#237780" stroke-width="4" marker-end="url(#arrow)"/><rect x="28" y="272" width="744" height="277" rx="18" fill="white" stroke="#c9d8d5" stroke-width="2"/><text x="52" y="318" font-size="32" fill="#237780" font-weight="700">② 조건을 바꾸며 병렬 연습</text><rect x="52" y="345" width="212" height="115" rx="18" fill="#edf4f2" stroke="#c9d8d5" stroke-width="2"/><text x="74" y="387" font-size="30" fill="#237780" font-weight="700">조명</text><text x="69" y="431" font-size="26" fill="#193d43" font-weight="400">밝기·그림자</text><rect x="294" y="345" width="212" height="115" rx="18" fill="#edf4f2" stroke="#c9d8d5" stroke-width="2"/><text x="316" y="387" font-size="30" fill="#237780" font-weight="700">물체</text><text x="311" y="431" font-size="26" fill="#193d43" font-weight="400">위치·방향</text><rect x="536" y="345" width="212" height="115" rx="18" fill="#edf4f2" stroke="#c9d8d5" stroke-width="2"/><text x="558" y="387" font-size="30" fill="#237780" font-weight="700">동역학</text><text x="553" y="431" font-size="26" fill="#193d43" font-weight="400">마찰·지연</text><text x="52" y="509" font-size="30" fill="#193d43" font-weight="400">실패 → 초기화 → 다시 시도</text><path d="M400 556 L400 590" fill="none" stroke="#237780" stroke-width="4" marker-end="url(#arrow)"/><rect x="28" y="604" width="744" height="132" rx="18" fill="white" stroke="#c9d8d5" stroke-width="2"/><text x="52" y="649" font-size="32" fill="#237780" font-weight="700">③ 별도 조건에서 평가</text><text x="52" y="697" font-size="29" fill="#193d43" font-weight="400">학습에 쓰지 않은 조건으로 후보 좁히기</text><text x="44" y="790" font-size="30" fill="#ac5b2e" font-weight="700">관절 순서·단위·좌표계는 따로 확인</text></g></svg>