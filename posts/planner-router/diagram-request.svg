<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="title desc"><title id="title">가상 요청: 먼저 보존할 두 가지 일</title><desc id="desc">대상 지점은 미확정이며 단말기 연결 장애와 청구 확인은 별도 의도다. 금요일 행사 전이라는 기한이 있다.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#203d40"/></marker></defs><rect width="800" height="480" rx="20" fill="#faf7ee"/><g font-family="Noto Sans CJK KR, sans-serif"><text x="30" y="46" font-size="27" font-weight="700" fill="#203d40">가상 요청: 먼저 보존할 두 가지 일</text><rect x="30" y="76" width="740" height="80" rx="14" fill="#f0e3bc"/><text x="48" y="107" font-size="21" font-weight="600" fill="#203d40">“새 지점 단말기가 끊겨요. 이번 달 요금도 이상해요.”</text><text x="48" y="136" font-size="21" font-weight="400" fill="#203d40">금요일 행사 전까지 정상화 요청</text><rect x="30" y="194" width="350" height="105" rx="14" fill="#dce9e5"/><text x="48" y="225" font-size="21" font-weight="600" fill="#203d40">의도 ① 연결 장애 조사</text><text x="48" y="254" font-size="21" font-weight="400" fill="#203d40">증상만으로 기기 고장 단정 금지</text><rect x="420" y="194" width="350" height="105" rx="14" fill="#dce9e5"/><text x="438" y="225" font-size="21" font-weight="600" fill="#203d40">의도 ② 청구 내역 확인</text><text x="438" y="254" font-size="21" font-weight="400" fill="#203d40">별도 항목으로 기록·추적</text><path d="M200,157 L200,187" fill="none" stroke="#203d40" stroke-width="2.5" marker-end="url(#a)"/><path d="M595,157 L595,187" fill="none" stroke="#203d40" stroke-width="2.5" marker-end="url(#a)"/><rect x="30" y="337" width="740" height="100" rx="14" fill="#f3dfd5"/><text x="48" y="368" font-size="21" font-weight="600" fill="#203d40">공통 선행 정보: 어느 지점인가?</text><text x="48" y="397" font-size="21" font-weight="400" fill="#203d40">성수점 / 판교점이 구별되지 않으면 확인 질문</text></g></svg>