<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="title desc"><title id="title">Hexion의 출하 구간 소요 시간</title><desc id="desc">Celonis 공개 사례: 신용 보류 해제부터 출하까지 약 11일에서 5일로 감소.</desc><rect width="800" height="450" rx="20" fill="#fffaf2"/><g font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" fill="#193e4a"><text x="36" y="52" font-size="28" fill="#193e4a">Hexion · 보류가 풀린 뒤에도 출하까지</text><text x="36" y="88" font-size="20" fill="#193e4a">측정 구간: 신용 보류 해제 → 출하</text><line x1="150" y1="120" x2="150" y2="320" stroke="#dcded7"/><text x="145" y="350" font-size="18" fill="#193e4a">0</text><line x1="236" y1="120" x2="236" y2="320" stroke="#dcded7"/><text x="231" y="350" font-size="18" fill="#193e4a">2</text><line x1="322" y1="120" x2="322" y2="320" stroke="#dcded7"/><text x="317" y="350" font-size="18" fill="#193e4a">4</text><line x1="408" y1="120" x2="408" y2="320" stroke="#dcded7"/><text x="403" y="350" font-size="18" fill="#193e4a">6</text><line x1="494" y1="120" x2="494" y2="320" stroke="#dcded7"/><text x="489" y="350" font-size="18" fill="#193e4a">8</text><line x1="580" y1="120" x2="580" y2="320" stroke="#dcded7"/><text x="575" y="350" font-size="18" fill="#193e4a">10</text><line x1="666" y1="120" x2="666" y2="320" stroke="#dcded7"/><text x="661" y="350" font-size="18" fill="#193e4a">12</text><text x="40" y="175" font-size="22" fill="#193e4a">개선 전</text><rect x="150" y="140" width="473" height="55" rx="6" fill="#dc8d72"/><text x="635" y="175" font-size="22" fill="#193e4a">약 11일</text><text x="40" y="275" font-size="22" fill="#193e4a">개선 후</text><rect x="150" y="240" width="215" height="55" rx="6" fill="#348985"/><text x="382" y="275" font-size="22" fill="#193e4a">5일</text><text x="700" y="350" font-size="18" fill="#193e4a">일</text><text x="36" y="411" font-size="18" fill="#193e4a">출처: Celonis 공개 Hexion 고객 사례</text></g></svg>
