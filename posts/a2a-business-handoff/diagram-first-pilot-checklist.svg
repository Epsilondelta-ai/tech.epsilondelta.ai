<svg xmlns="http://www.w3.org/2000/svg" width="800" height="718" viewBox="0 0 800 718" role="img"><title>첫 파일럿의 다섯 가지 운영 설계 기준</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#256d73"/></marker></defs><rect width="800" height="718" fill="#faf7ef"/><g font-family="Noto Sans CJK KR, sans-serif"><text x="32" y="48" font-size="30" fill="#183d40" font-weight="700">첫 파일럿을 위한 운영 합의</text><rect x="32" y="78" width="736" height="96" rx="16" fill="white" stroke="#256d73" stroke-width="2"/><circle cx="75" cy="126" r="25" fill="#256d73"/><text x="67" y="136" font-size="28" fill="white" font-weight="700">1</text><text x="121" y="117" font-size="28" fill="#256d73" font-weight="700">협력사 한 곳 · 단일 업무</text><text x="121" y="154" font-size="25" fill="#183d40" font-weight="400">검증된 상대와 견적 초안 조회부터</text><rect x="32" y="191" width="736" height="96" rx="16" fill="white" stroke="#256d73" stroke-width="2"/><circle cx="75" cy="239" r="25" fill="#256d73"/><text x="67" y="249" font-size="28" fill="white" font-weight="700">2</text><text x="121" y="230" font-size="28" fill="#256d73" font-weight="700">단위 · 결과 양식</text><text x="121" y="267" font-size="25" fill="#183d40" font-weight="400">품목·포장·통화와 견적 필수 항목 합의</text><rect x="32" y="304" width="736" height="96" rx="16" fill="white" stroke="#256d73" stroke-width="2"/><circle cx="75" cy="352" r="25" fill="#256d73"/><text x="67" y="362" font-size="28" fill="white" font-weight="700">3</text><text x="121" y="343" font-size="28" fill="#256d73" font-weight="700">최소 데이터</text><text x="121" y="380" font-size="25" fill="#183d40" font-weight="400">예산·타사 견적·전체 대화 제외</text><rect x="32" y="417" width="736" height="96" rx="16" fill="white" stroke="#256d73" stroke-width="2"/><circle cx="75" cy="465" r="25" fill="#256d73"/><text x="67" y="475" font-size="28" fill="white" font-weight="700">4</text><text x="121" y="456" font-size="28" fill="#256d73" font-weight="700">기능과 권한 분리</text><text x="121" y="493" font-size="25" fill="#183d40" font-weight="400">조회·견적 요청만 허용, 발주는 제외</text><rect x="32" y="530" width="736" height="96" rx="16" fill="white" stroke="#256d73" stroke-width="2"/><circle cx="75" cy="578" r="25" fill="#256d73"/><text x="67" y="588" font-size="28" fill="white" font-weight="700">5</text><text x="121" y="569" font-size="28" fill="#256d73" font-weight="700">수락 · 예외 담당자</text><text x="121" y="606" font-size="25" fill="#183d40" font-weight="400">결과 검수와 추가 입력·지연·취소 조율</text><text x="32" y="684" font-size="25" fill="#a65036" font-weight="400">초기 설계의 출발점 · 보편적으로 실증된 공식은 아님</text></g></svg>