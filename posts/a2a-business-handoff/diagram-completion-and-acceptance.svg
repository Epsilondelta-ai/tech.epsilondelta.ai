<svg xmlns="http://www.w3.org/2000/svg" width="800" height="733" viewBox="0 0 800 733" role="img"><title>추가 입력 대기·작업 완료·업무 수락의 구분</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#256d73"/></marker></defs><rect width="800" height="733" fill="#faf7ef"/><g font-family="Noto Sans CJK KR, sans-serif"><text x="32" y="48" font-size="30" fill="#183d40" font-weight="700">포장 단위 확인부터 견적 검수까지</text><rect x="32" y="78" width="736" height="194" rx="16" fill="white" stroke="#256d73" stroke-width="2"/><text x="52" y="116" font-size="28" fill="#256d73" font-weight="700">같은 작업 안에서 단위를 확인</text><text x="52" y="164" font-size="28" fill="#a65036" font-weight="700">추가 입력 대기</text><text x="52" y="202" font-size="24" fill="#a65036" font-weight="400">input-required</text><path d="M285 183 L385 183" fill="none" stroke="#256d73" stroke-width="3" marker-end="url(#arrow)"/><text x="410" y="164" font-size="27" fill="#183d40" font-weight="400">담당자가 단위 회신</text><text x="410" y="210" font-size="26" fill="#183d40" font-weight="400">낱개 / 박스 합의 후 계속</text><rect x="32" y="310" width="344" height="142" rx="16" fill="white" stroke="#256d73" stroke-width="2"/><rect x="424" y="310" width="344" height="142" rx="16" fill="#eee0be" stroke="#a65036" stroke-width="2"/><text x="52" y="352" font-size="29" fill="#256d73" font-weight="700">작업 완료</text><text x="52" y="391" font-size="25" fill="#183d40" font-weight="400">completed · 견적 전달</text><text x="52" y="426" font-size="25" fill="#183d40" font-weight="400">프로토콜의 작업 종료</text><text x="444" y="352" font-size="29" fill="#a65036" font-weight="700">업무 수락</text><text x="444" y="391" font-size="26" fill="#183d40" font-weight="400">담당자의 별도 검수</text><text x="444" y="426" font-size="26" fill="#183d40" font-weight="400">채택 여부 판단</text><text x="390" y="393" font-size="36" fill="#a65036" font-weight="700">≠</text><text x="32" y="499" font-size="26" fill="#183d40" font-weight="400">필수 검수: 통화 · 단가 · 세금 · 운송비</text><text x="32" y="541" font-size="26" fill="#183d40" font-weight="400">유효기간 · 납기</text><rect x="32" y="578" width="736" height="123" rx="16" fill="white" stroke="#256d73" stroke-width="2"/><text x="52" y="617" font-size="28" fill="#a65036" font-weight="700">발주는 별도로 승인된 절차로 진행</text><text x="52" y="658" font-size="25" fill="#183d40" font-weight="400">완료된 작업의 후속 논의는 새 작업으로</text></g></svg>