<svg xmlns="http://www.w3.org/2000/svg" width="800" height="592" viewBox="0 0 800 592" role="img"><title>기능·신원·권한 판단과 최소 송신 항목</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#256d73"/></marker></defs><rect width="800" height="592" fill="#faf7ef"/><g font-family="Noto Sans CJK KR, sans-serif"><text x="32" y="48" font-size="30" fill="#183d40" font-weight="700">기능 확인과 실행 권한은 별도 판단</text><rect x="32" y="82" width="228" height="136" rx="16" fill="white" stroke="#256d73" stroke-width="2"/><text x="50" y="128" font-size="28" fill="#256d73" font-weight="700">기능 확인</text><text x="50" y="175" font-size="24" fill="#183d40" font-weight="400">견적을 만들 수 있나</text><rect x="286" y="82" width="228" height="136" rx="16" fill="white" stroke="#256d73" stroke-width="2"/><text x="304" y="128" font-size="28" fill="#256d73" font-weight="700">신원 확인</text><text x="304" y="175" font-size="24" fill="#183d40" font-weight="400">등록된 협력사인가</text><rect x="540" y="82" width="228" height="136" rx="16" fill="white" stroke="#256d73" stroke-width="2"/><text x="558" y="128" font-size="28" fill="#256d73" font-weight="700">권한 판단</text><text x="558" y="175" font-size="24" fill="#183d40" font-weight="400">이 요청이 허용되나</text><text x="32" y="263" font-size="27" fill="#a65036" font-weight="700">에이전트 카드 자체는 실행 허가가 아닙니다</text><path d="M32 288 L768 288" fill="none" stroke="#256d73" stroke-width="3"/><rect x="32" y="322" width="354" height="238" rx="16" fill="white" stroke="#256d73" stroke-width="2"/><rect x="414" y="322" width="354" height="238" rx="16" fill="#eee0be" stroke="#a65036" stroke-width="2"/><text x="52" y="363" font-size="28" fill="#256d73" font-weight="700">합의한 항목만 송신</text><text x="52" y="411" font-size="27" fill="#183d40" font-weight="400">품목 코드 · 수량</text><text x="52" y="456" font-size="27" fill="#183d40" font-weight="400">납품 장소 · 희망일</text><text x="52" y="525" font-size="25" fill="#256d73" font-weight="400">외부 견적 요청으로 →</text><text x="434" y="363" font-size="28" fill="#a65036" font-weight="700">사내에 남길 맥락</text><text x="434" y="411" font-size="27" fill="#183d40" font-weight="400">내부 예산 상한</text><text x="434" y="456" font-size="27" fill="#183d40" font-weight="400">타사 견적</text><text x="434" y="501" font-size="27" fill="#183d40" font-weight="400">전체 대화 이력</text></g></svg>