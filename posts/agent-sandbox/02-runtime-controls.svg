<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#426c76"/></marker></defs><rect width="800" height="600" fill="#faf8f2"/><g font-family="Noto Sans CJK KR, sans-serif"><text x="36" y="52" font-size="30" fill="#183847" font-weight="700" text-anchor="start">실행 전 승인과 실행 중 격리는 함께 필요합니다</text><rect x="36" y="86" width="728" height="92" rx="16" fill="#f4ead3" stroke="#b69a62" stroke-width="2"/><text x="60" y="124" font-size="28" fill="#183847" font-weight="700" text-anchor="start">업무 지침</text><text x="60" y="159" font-size="26" fill="#183847" font-weight="500" text-anchor="start">모델에게 지정 폴더만 쓰도록 요청</text><path d="M400 185 L400 216" fill="none" stroke="#426c76" stroke-width="3" marker-end="url(#a)"/><rect x="36" y="224" width="728" height="92" rx="16" fill="#e8eef5" stroke="#7c92aa" stroke-width="2"/><text x="60" y="262" font-size="28" fill="#183847" font-weight="700" text-anchor="start">도구 권한 · 사람 승인</text><text x="60" y="297" font-size="26" fill="#183847" font-weight="500" text-anchor="start">실행 전에 대상과 인자를 검사</text><path d="M400 323 L400 354" fill="none" stroke="#426c76" stroke-width="3" marker-end="url(#a)"/><rect x="36" y="362" width="728" height="145" rx="16" fill="#e6f1ed" stroke="#51968c" stroke-width="2"/><text x="60" y="402" font-size="28" fill="#183847" font-weight="700" text-anchor="start">샌드박스 안 런타임</text><text x="60" y="443" font-size="28" fill="#183847" font-weight="500" text-anchor="start">셸 명령 → 하위 프로세스</text><text x="60" y="482" font-size="26" fill="#183847" font-weight="500" text-anchor="start">실행 중 파일 · 통신 · 프로세스 접근 제한</text><text x="36" y="556" font-size="26" fill="#183847" font-weight="700" text-anchor="start">파일 도구 · 외부 연결 서버의 경계는 따로 확인</text></g></svg>