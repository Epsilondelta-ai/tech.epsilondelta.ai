<svg xmlns="http://www.w3.org/2000/svg" width="800" height="728" viewBox="0 0 800 728"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#426c76"/></marker></defs><rect width="800" height="728" fill="#faf8f2"/><g font-family="Noto Sans CJK KR, sans-serif"><text x="36" y="52" font-size="30" fill="#183847" font-weight="700" text-anchor="start">같은 경계를 하위 프로세스까지 적용</text><rect x="36" y="84" width="728" height="136" rx="16" fill="#e6f1ed" stroke="#51968c" stroke-width="2"/><text x="60" y="126" font-size="30" fill="#183847" font-weight="700" text-anchor="start">파일</text><text x="60" y="164" font-size="26" fill="#183847" font-weight="500" text-anchor="start">입력 사본은 읽기 전용 · 임시 작업은 별도 경로</text><text x="60" y="201" font-size="26" fill="#183847" font-weight="500" text-anchor="start">결과는 지정된 반출 폴더에만 저장</text><rect x="36" y="240" width="728" height="136" rx="16" fill="#e8eef5" stroke="#7c92aa" stroke-width="2"/><text x="60" y="282" font-size="30" fill="#183847" font-weight="700" text-anchor="start">통신</text><text x="60" y="320" font-size="26" fill="#183847" font-weight="500" text-anchor="start">허용 도메인 + 사용할 계정 + 허용 API 기능</text><text x="60" y="357" font-size="26" fill="#183847" font-weight="500" text-anchor="start">모델 입력 전송과 결과 반출 경로도 확인</text><rect x="36" y="396" width="728" height="136" rx="16" fill="#f4ead3" stroke="#b69a62" stroke-width="2"/><text x="60" y="438" font-size="30" fill="#183847" font-weight="700" text-anchor="start">작업 수명</text><text x="60" y="476" font-size="26" fill="#183847" font-weight="500" text-anchor="start">업무별 환경 분리 · 자원과 실행 시간 상한</text><text x="60" y="513" font-size="26" fill="#183847" font-weight="500" text-anchor="start">종료할 때 하위 프로세스까지 회수</text><text x="400" y="583" font-size="28" fill="#183847" font-weight="700" text-anchor="middle">작업 종료 후에도 남는 절차</text><rect x="36" y="611" width="342" height="78" rx="16" fill="#fff" stroke="#8da5ab" stroke-widt