<svg xmlns="http://www.w3.org/2000/svg" width="800" height="738" viewBox="0 0 800 738"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#426c76"/></marker></defs><rect width="800" height="738" fill="#faf8f2"/><g font-family="Noto Sans CJK KR, sans-serif"><text x="36" y="52" font-size="30" fill="#183847" font-weight="700" text-anchor="start">키 보관 · 업무 권한 · 반출 검토를 분리</text><rect x="36" y="84" width="728" height="110" rx="16" fill="#e6f1ed" stroke="#51968c" stroke-width="2"/><text x="60" y="126" font-size="29" fill="#183847" font-weight="700" text-anchor="start">샌드박스 안</text><text x="60" y="169" font-size="27" fill="#183847" font-weight="500" text-anchor="start">입력 사본 분석 → 보고서 · 발주 초안 생성</text><path d="M400 202 L400 241" fill="none" stroke="#426c76" stroke-width="3" marker-end="url(#a)"/><text x="427" y="230" font-size="24" fill="#183847" font-weight="500" text-anchor="start">요청</text><rect x="36" y="250" width="728" height="144" rx="16" fill="#e8eef5" stroke="#7c92aa" stroke-width="2"/><text x="60" y="292" font-size="29" fill="#183847" font-weight="700" text-anchor="start">샌드박스 밖: 자격증명 중계</text><text x="60" y="335" font-size="26" fill="#183847" font-weight="500" text-anchor="start">실제 키 보관 · 허용 계정과 API 기능 제한</text><text x="60" y="373" font-size="26" fill="#183847" font-weight="500" text-anchor="start">거래처 · 금액 · 문서 버전 확인 + 담당자 승인</text><path d="M400 402 L400 441" fill="none" stroke="#426c76" stroke-width="3" marker-end="url(#a)"/><rect x="36" y="450" width="728" height="94" rx="16" fill="#f4ead3" stroke="#b69a62" stroke-width="2"/><text x="60" y="489" font-size="29" fill="#183847" font-weight="700" text-anchor="start">외부 업무 시스템</text><text x="60" y="525" font-size="26" fill="#183847" font-weight="500" text-anchor="start">승인된 범위에서만 실제 업무 변경</text><rect x="36" y="574" width="728" height="120" rx="16" fill="#fff" stroke="#8da5ab" stroke-width="2"/><text x="60" y="616"