<svg xmlns="http://www.w3.org/2000/svg" width="800" height="490" viewBox="0 0 800 490"><title>근거와 범위가 있는 교정의 승인 흐름</title><rect width="800" height="490" rx="20" fill="#FAF7F0"/><g font-family="Noto Sans CJK KR, sans-serif"><text x="28" y="43" font-size="27" font-weight="700" fill="#243E40">교정 카드를 검토하고, 범위를 잠급니다</text><rect x="28" y="64" width="744" height="130" rx="12" fill="#F4E7DA"/><text x="46" y="96" font-size="23" font-weight="700" fill="#243E40">고객 A · 주문 O-001 · 반품 배송비 예외</text><text x="46" y="128" font-size="22" font-weight="400" fill="#243E40">근거·소유자·승인 기록 / 다른 고객·주문 제외</text><text x="46" y="161" font-size="22" font-weight="400" fill="#243E40">시행 2026-10-21 → 만료 2026-11-01</text><rect x="28" y="214" width="744" height="63" rx="12" fill="#E8EFEB"/><text x="46" y="241" font-size="23" font-weight="700" fill="#243E40">접수 → 분류 → 근거 확인</text><text x="46" y="266" font-size="20" font-weight="400" fill="#243E40">수정 전후·이유·실행 맥락을 보존</text><rect x="28" y="288" width="744" height="63" rx="12" fill="#E8EFEB"/><text x="46" y="315" font-size="23" font-weight="700" fill="#243E40">변경 후보 → 승인 → 검증</text><text x="46" y="340" font-size="20" font-weight="400" fill="#243E40">제출자·근거 판정자·배포 승인자 권한 분리</text><rect x="28" y="362" width="744" height="63" rx="12" fill="#E8EFEB"/><text x="46" y="389" font-size="23" font-weight="700" fill="#243E40">제한 배포 → 관찰 → 종료·철회</text><text x="46" y="414" font-size="20" font-weight="400" fill="#243E40">만료 후 일반 규정 복귀 / 이력 보존</text><text x="30" y="464" font-size="22" font-weight="700" fill="#243E40">범위 누락·근거 충돌 → 보류하고 사람 검토</text></g></svg>
