<svg xmlns="http://www.w3.org/2000/svg" width="800" height="490" viewBox="0 0 800 490"><title>교정의 범위 누수 시험과 제한 배포</title><rect width="800" height="490" rx="20" fill="#FAF7F0"/><g font-family="Noto Sans CJK KR, sans-serif"><text x="28" y="43" font-size="28" font-weight="700" fill="#243E40">고친 질문 밖의 경계도 시험합니다</text><rect x="28" y="62" width="744" height="49" rx="12" fill="#E8EFEB"/><text x="43" y="93" font-size="21" font-weight="700" fill="#243E40">교정 사례·표현 변형</text><text x="350" y="93" font-size="20" font-weight="400" fill="#243E40">승인 근거와 조건에 맞게 응답</text><rect x="28" y="119" width="744" height="49" rx="12" fill="#F4E7DA"/><text x="43" y="150" font-size="21" font-weight="700" fill="#243E40">다른 고객·다른 주문</text><text x="350" y="150" font-size="20" font-weight="400" fill="#243E40">O-001 예외가 다른 대상에 새지 않음</text><rect x="28" y="176" width="744" height="49" rx="12" fill="#E8EFEB"/><text x="43" y="207" font-size="21" font-weight="700" fill="#243E40">시행 전·만료 후</text><text x="350" y="207" font-size="20" font-weight="400" fill="#243E40">예외 미적용 / 일반 규정으로 복귀</text><rect x="28" y="233" width="744" height="49" rx="12" fill="#F4E7DA"/><text x="43" y="264" font-size="21" font-weight="700" fill="#243E40">정상 업무·미사용 사건</text><text x="350" y="264" font-size="20" font-weight="400" fill="#243E40">회귀 확인 / 사건군을 분리해 시험</text><rect x="28" y="290" width="744" height="49" rx="12" fill="#E8EFEB"/><text x="43" y="321" font-size="21" font-weight="700" fill="#243E40">미승인·중복·악성 교정</text><text x="350" y="321" font-size="20" font-weight="400" fill="#243E40">승인된 규칙으로 승격되지 않음</text><text x="30" y="390" font-size="23" font-weight="700" fill="#243E40">오프라인 비교 → 섀도 검증 → 제한 배포·관찰</text><text x="30" y="432" font-size="21" font-weight="400" fill="#243E40">복원 후 라우팅·캐시·진행 작업·색인까지 확인</text><text x="30" y="466" font-size="21" font-weight="400" fill="#243E40">이미 발송한 답변·환불은 별도 통지·보정 필요</text></g></svg>
