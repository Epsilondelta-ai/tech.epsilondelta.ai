<svg xmlns="http://www.w3.org/2000/svg" width="800" height="540" viewBox="0 0 800 540"><title>최소권한, 승인, 중복 방지, 결과 검증의 네 가지 운영 통제</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#28777b"/></marker></defs><rect width="800" height="540" fill="#f8f5ed"/><g font-family="Noto Sans CJK KR, sans-serif"><text x="32" y="52" font-size="29" fill="#173d43" font-weight="700">권한·승인·중복·결과를 따로 설계합니다</text><rect x="32" y="85" width="352" height="172" rx="14" fill="#ffffff" stroke="#8cb1af" stroke-width="2"/><text x="52" y="127" font-size="27" fill="#173d43" font-weight="700">최소권한 환경</text><text x="52" y="176" font-size="22" fill="#173d43" font-weight="400">사람이 로그인하거나</text><text x="52" y="210" font-size="22" fill="#173d43" font-weight="400">전용 계정으로 범위 제한</text><rect x="416" y="85" width="352" height="172" rx="14" fill="#ffffff" stroke="#8cb1af" stroke-width="2"/><text x="436" y="127" font-size="27" fill="#173d43" font-weight="700">사람 승인</text><text x="436" y="176" font-size="22" fill="#173d43" font-weight="400">외부 발송·자금 이동 등</text><text x="436" y="210" font-size="22" fill="#173d43" font-weight="400">중요 행동은 규칙으로 중단</text><rect x="32" y="280" width="352" height="172" rx="14" fill="#ffffff" stroke="#8cb1af" stroke-width="2"/><text x="52" y="322" font-size="27" fill="#173d43" font-weight="700">중복 제출 관리</text><text x="52" y="371" font-size="22" fill="#173d43" font-weight="400">제출 전 기존 등록 조회</text><text x="52" y="405" font-size="22" fill="#173d43" font-weight="400">응답 불명확 시 재클릭 중단</text><rect x="416" y="280" width="352" height="172" rx="14" fill="#ffffff" stroke="#8cb1af" stroke-width="2"/><text x="436" y="322" font-size="27" fill="#173d43" font-weight="700">저장 결과 확인</text><text x="436" y="371" font-size="22" fill="#173d43" font-weight="400">접수 번호·업무 키 재조회</text><text x="436" y="405" font-size="22" fill="#173d43" font-weight="400">완료 불명확 시 사람 인계</text><text x="48" y="503" font-size="24" fill="#a35636" font-weight="700">로그인 ≠ 거래 승인</text><text x="420" y="503" font-size="24" fill="#a35636" font-weight="700">승인 ≠ 저장 완료</text></g></svg>