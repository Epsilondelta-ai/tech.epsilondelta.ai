<svg xmlns="http://www.w3.org/2000/svg" width="800" height="560" viewBox="0 0 800 560"><title>그레이벨의 검증과 사람 검토, 리플릿의 결과 확인 경로</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#28777b"/></marker></defs><rect width="800" height="560" fill="#f8f5ed"/><g font-family="Noto Sans CJK KR, sans-serif"><text x="32" y="52" font-size="30" fill="#173d43" font-weight="700">화면 입력 앞뒤에 검증 경로를 둡니다</text><text x="32" y="96" font-size="24" fill="#28777b" font-weight="700">그레이벨 공개 사례의 흐름</text><rect x="32" y="119" width="220" height="103" rx="14" fill="#ffffff" stroke="#8cb1af" stroke-width="2"/><text x="50" y="157" font-size="26" fill="#173d43" font-weight="700">메일 자료</text><text x="50" y="198" font-size="22" fill="#173d43" font-weight="400">요청 정보 추출</text><rect x="290" y="119" width="220" height="103" rx="14" fill="#ffffff" stroke="#8cb1af" stroke-width="2"/><text x="308" y="157" font-size="26" fill="#173d43" font-weight="700">사전 검증</text><text x="308" y="198" font-size="22" fill="#173d43" font-weight="400">서비스 규칙 확인</text><rect x="548" y="119" width="220" height="103" rx="14" fill="#ffffff" stroke="#8cb1af" stroke-width="2"/><text x="566" y="157" font-size="26" fill="#173d43" font-weight="700">화면 입력</text><text x="566" y="198" font-size="22" fill="#173d43" font-weight="400">사내 플랫폼 입력</text><path d="M254 169 L280 169" stroke="#28777b" stroke-width="3" marker-end="url(#arrow)" fill="none"/><path d="M512 169 L538 169" stroke="#28777b" stroke-width="3" marker-end="url(#arrow)" fill="none"/><rect x="180" y="272" width="440" height="83" rx="14" fill="#f9e7da" stroke="#c28162" stroke-width="2"/><text x="207" y="306" font-size="25" fill="#173d43" font-weight="700">낮은 신뢰도·예외·승인 필요</text><text x="207" y="339" font-size="23" fill="#173d43" font-weight="400">사람 검토자에게 인계</text><path d="M400 225 V260" stroke="#28777b" stroke-width="3" marker-end="url(#arrow)"/><text x="32" y="405" font-size="24" fill="#28777b" font-weigh