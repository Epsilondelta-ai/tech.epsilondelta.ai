<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-labelledby="title desc"><title id="title">전문성은 업무 기준과 학습에서 나옵니다</title><desc id="desc">사람이 양식과 예외를 먼저 정한다. 분야 문서로 도메인 적응을 하고 사람 정답으로 미세조정을 하며 교사 출력을 사람이 검수해 증류한다. 프롬프트 예시만 주는 방식은 가중치를 바꾸지 않는다.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#547b77"/></marker></defs><rect width="800" height="500" rx="20" fill="#faf6ed"/><g font-family="Noto Sans CJK KR, sans-serif"><text x="36" y="52" font-size="32" fill="#193d42" text-anchor="start">전문성은 업무 기준과 학습에서 나옵니다</text><text x="40" y="100" font-size="26" fill="#193d42" text-anchor="start">사람이 먼저 정의: 출력 양식 · 예외 규칙</text><rect x="40" y="130" width="340" height="75" rx="18" fill="#dcebe7"/><text x="64" y="172" font-size="28" fill="#193d42" text-anchor="start">분야 문서</text><path d="M390 168 L415 168" stroke="#547b77" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="430" y="130" width="330" height="75" rx="18" fill="#dcebe7"/><text x="454" y="172" font-size="28" fill="#193d42" text-anchor="start">도메인 적응</text><rect x="40" y="225" width="340" height="75" rx="18" fill="#dcebe7"/><text x="64" y="267" font-size="28" fill="#193d42" text-anchor="start">사람이 검토한 정답</text><path d="M390 263 L415 263" stroke="#547b77" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="430" y="225" width="330" height="75" rx="18" fill="#dcebe7"/><text x="454" y="267" font-size="28" fill="#193d42" text-anchor="start">미세조정</text><rect x="40" y="320" width="450" height="75" rx="18" fill="#dcebe7"/><text x="64" y="362" font-size="28" fill="#193d42" text-anchor="start">교사 출력 → 사람 검수</text><path d="M500 358 L525 358" stroke="#547b77" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="540" y="320" width="220" height="75" rx="18" fill="#f2e5c4"/><text x="564" y="362" font-size="28" fill="#193d42" text-anchor="start">증류</text><text x="40" y="455" font-size="26" fill="#193d42" text-anchor="start">프롬프트 예시만 제공: 가중치 학습은 아님</text></g></svg>