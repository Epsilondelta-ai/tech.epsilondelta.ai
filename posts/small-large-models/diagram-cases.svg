<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-labelledby="title desc"><title id="title">역할 분리와 ‘없는 값’의 채점</title><desc id="desc">링크드인 자체 발표는 검색 이해, 관련성, 정책 평가 역할을 분리한다. 아마존 연구의 85.4퍼센트 정답은 값 추출 52.4퍼센트와 올바른 값 없음 33.0퍼센트의 합이다.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#547b77"/></marker></defs><rect width="800" height="500" rx="20" fill="#faf6ed"/><g font-family="Noto Sans CJK KR, sans-serif"><text x="36" y="52" font-size="32" fill="#193d42" text-anchor="start">역할 분리와 ‘없는 값’의 채점</text><text x="40" y="100" font-size="24" fill="#193d42" text-anchor="start">링크드인 자체 발표 · 역할별 모델</text><rect x="40" y="120" width="225" height="100" rx="18" fill="#dcebe7"/><text x="64" y="162" font-size="28" fill="#193d42" text-anchor="start">검색 이해</text><text x="64" y="200" font-size="28" fill="#193d42" text-anchor="start">1.5B~4B</text><rect x="285" y="120" width="230" height="100" rx="18" fill="#dcebe7"/><text x="309" y="162" font-size="28" fill="#193d42" text-anchor="start">관련성 점수</text><text x="309" y="200" font-size="28" fill="#193d42" text-anchor="start">0.6B</text><rect x="535" y="120" width="225" height="100" rx="18" fill="#dcebe7"/><text x="559" y="162" font-size="28" fill="#193d42" text-anchor="start">정책 평가</text><text x="559" y="200" font-size="28" fill="#193d42" text-anchor="start">8B</text><text x="40" y="275" font-size="24" fill="#193d42" text-anchor="start">아마존 연구 · 전체 정답률의 구성</text><rect x="40" y="300" width="340" height="100" rx="18" fill="#dcebe7"/><text x="64" y="342" font-size="28" fill="#193d42" text-anchor="start">값 추출 52.4%</text><text x="395" y="360" font-size="30" fill="#193d42" text-anchor="middle">+</text><rect x="420" y="300" width="340" height="100" rx="18" fill="#dcebe7"/><text x="444" y="342" font-size="28" fill="#193d42" text-anchor="start">값 없음 33.0%</text><text x="400" y="454" font-size="28" fill="#193d42" text-anchor="middle">합계 85.4% · 빈칸을 채운 비율 아님</text></g></svg>