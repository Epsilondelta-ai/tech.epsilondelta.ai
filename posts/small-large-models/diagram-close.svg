<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-labelledby="title desc"><title id="title">작게 맡기려면 경계를 먼저 닫습니다</title><desc id="desc">닫힌 분류 추출 과제는 작은 전문 모델의 후보이며 대표 시험 합격이 필요하다. 다문서 해석과 기준 미정 문제는 큰 모델과 사람이 검토하되 같은 기준으로 재검증하고 미정 기준은 사람이 결정한다.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#547b77"/></marker></defs><rect width="800" height="500" rx="20" fill="#faf6ed"/><g font-family="Noto Sans CJK KR, sans-serif"><text x="36" y="52" font-size="32" fill="#193d42" text-anchor="start">작게 맡기려면 경계를 먼저 닫습니다</text><rect x="40" y="92" width="340" height="160" rx="18" fill="#dcebe7"/><text x="64" y="134" font-size="28" fill="#193d42" text-anchor="start">닫힌 분류 · 추출</text><text x="64" y="172" font-size="28" fill="#193d42" text-anchor="start">작은 전문 모델 후보</text><text x="64" y="210" font-size="28" fill="#193d42" text-anchor="start">대표 시험으로 합격 확인</text><rect x="420" y="92" width="340" height="160" rx="18" fill="#f2e5c4"/><text x="444" y="134" font-size="28" fill="#193d42" text-anchor="start">다문서 · 기준 미정</text><text x="444" y="172" font-size="28" fill="#193d42" text-anchor="start">큰 모델 + 사람 검토</text><text x="444" y="210" font-size="28" fill="#193d42" text-anchor="start">미정 기준은 사람이 결정</text><path d="M210 265 L210 300" stroke="#547b77" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M590 265 L590 300" stroke="#547b77" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="40" y="315" width="720" height="120" rx="18" fill="#dcebe7"/><text x="64" y="357" font-size="28" fill="#193d42" text-anchor="start">같은 업무 기준으로 결과 재검증</text><text x="64" y="395" font-size="28" fill="#193d42" text-anchor="start">검토 후에도 보류가 남을 수 있음</text></g></svg>