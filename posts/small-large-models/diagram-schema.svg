<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-labelledby="title desc"><title id="title">먼저 빈칸과 예외를 정의합니다</title><desc id="desc">가상 상품 설명에서 본체 보증 개월 수, 소모품 별도 기준, 시작일 기준을 고정된 양식으로 추출하며 부품 보유 기간은 제외한다.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#547b77"/></marker></defs><rect width="800" height="500" rx="20" fill="#faf6ed"/><g font-family="Noto Sans CJK KR, sans-serif"><text x="36" y="52" font-size="32" fill="#193d42" text-anchor="start">먼저 빈칸과 예외를 정의합니다</text><text x="40" y="95" font-size="24" fill="#193d42" text-anchor="start">가상 예시 · 사람이 정한 추출 양식</text><rect x="40" y="120" width="720" height="95" rx="18" fill="#dcebe7"/><text x="64" y="162" font-size="28" fill="#193d42" text-anchor="start">본체 무상 보증 1년 · 소모품 제외</text><path d="M400 220 L400 250" stroke="#547b77" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="40" y="260" width="720" height="120" rx="18" fill="#dcebe7"/><text x="64" y="302" font-size="28" fill="#193d42" text-anchor="start">본체: 12개월    소모품 별도: 있음</text><text x="64" y="340" font-size="28" fill="#193d42" text-anchor="start">시작일 기준: 원문 미기재 → null</text><text x="40" y="431" font-size="28" fill="#a15339" text-anchor="start">제외 규칙: 부품 보유 5년 ≠ 무상 보증</text></g></svg>