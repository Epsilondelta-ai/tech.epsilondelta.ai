<svg xmlns="http://www.w3.org/2000/svg" width="720" height="472" viewBox="0 0 720 472" role="img" aria-labelledby="title desc" xml:lang="ko">
  <title id="title">조회, 초안 작성, 확정 발송의 권한 경계</title>
  <desc id="desc">가격과 가용성 조회, 내부 견적 초안 작성은 에이전트에 위임할 수 있습니다. 담당자는 확정 견적을 발송하기 전에 승인 판본, 본문과 첨부의 일치, 발송 권한을 확인합니다.</desc>
  <g font-family='"Noto Sans CJK KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif'>
  <rect x="0" y="0" width="720" height="472" rx="20" fill="#faf5ea" stroke="none"/>
  <text x="48" y="63" fill="#173043" font-size="36" font-weight="700" text-anchor="start">영업 에이전트의 위임 경계</text>
  <rect x="44" y="96" width="632" height="168" rx="14" fill="#d8e9e3" stroke="none"/>
  <text x="69" y="138" fill="#124f50" font-size="30" font-weight="700" text-anchor="start">에이전트가 맡을 수 있는 일</text>
  <path d="M69 155L651 155" fill="none" stroke="#9ebfba" stroke-width="2" stroke-linecap="round"/>
  <text x="70" y="207" fill="#173043" font-size="32" font-weight="700" text-anchor="start">가격·가용성 조회</text>
  <text x="383" y="207" fill="#173043" font-size="32" font-weight="700" text-anchor="start">견적 초안 작성</text>
  <text x="70" y="241" fill="#3d5360" font-size="26" font-weight="400" text-anchor="start">업무 시스템 읽기</text>
  <text x="383" y="241" fill="#3d5360" font-size="26" font-weight="400" text-anchor="start">내부 문서 작성</text>
  <path d="M45 290L675 290" fill="none" stroke="#a23d27" stroke-width="2" stroke-linecap="round" stroke-dasharray="8 8"/>
  <rect x="44" y="316" width="632" height="124" rx="14" fill="#fffdf7" stroke="#d6b3a3"/>
  <text x="69" y="362" fill="#a23d27" font-size="33" font-weight="700" text-anchor="start">담당자 확인 후 확정 발송</text>
  <text x="69" y="407" fill="#173043" font-size="30" font-weight="400" text-anchor="start">승인 판본 대조·발송 권한 확인</text>
  </g>
</svg>
