    .head {font-size:35px;font-weight:700}
    .body {font-size:30px;font-weight:500}
    .small {font-size:28px;font-weight:500}
    .navy {fill:#273958}
    .teal {fill:#125457}
    .rust {fill:#973e20}
    .white {fill:#fff9ee}
  </style>
  <rect width="720" height="488" rx="24" fill="#fbf4e7"/>
  <rect x="26" y="26" width="668" height="436" rx="18" fill="#fffaf0" stroke="#d8cdb9" stroke-width="2"/>
  <rect x="26" y="26" width="668" height="68" rx="18" fill="#273958"/>
  <path d="M26 72h668v22H26z" fill="#273958"/>
  <text x="66" y="72" class="head white">단계</text>
  <text x="320" y="72" class="head white">확인할 기록</text>
