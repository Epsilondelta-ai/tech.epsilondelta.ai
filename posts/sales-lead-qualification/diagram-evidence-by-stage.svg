<svg xmlns="http://www.w3.org/2000/svg" width="720" height="488" viewBox="0 0 720 488" role="img" aria-labelledby="title desc" xml:lang="ko">
  <title id="title">접촉부터 수주까지 단계별로 확인할 근거</title>
