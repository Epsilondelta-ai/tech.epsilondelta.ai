<svg xmlns="http://www.w3.org/2000/svg" width="800" height="460" viewBox="0 0 800 460" role="img" aria-label="가격 셀과 각주를 함께 읽습니다"><rect width="800" height="460" rx="24" fill="#faf7ef"/><style>text{font-family:'Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#193b43}.h{font-size:27px;font-weight:700}.t{font-size:22px}.s{font-size:18px}.n{font-size:32px;font-weight:700}</style><text class="h" x="32" y="49">가격 셀과 각주를 함께 읽습니다</text><rect x="32" y="85" width="430" height="310" rx="15" fill="white"/><text class="t" x="56" y="126">B사 견적서 · 가상 예시</text><text class="t" x="56" y="182">품목</text><text class="t" x="267" y="182">박스 가격</text><path d="M55 195H438 M55 260H438" stroke="#b5c9c4" stroke-width="2"/><text class="t" x="56" y="235">포장재</text><text class="t" x="270" y="235">90,000원</text><rect x="55" y="294" width="385" height="62" rx="15" fill="#fff0c3"/><text class="t" x="76" y="333">* 1박스 10개입</text><rect x="510" y="145" width="258" height="175" rx="15" fill="#e1eee8"/><text class="t" x="534" y="190">함께 추출할 정보</text><text class="t" x="534" y="237">90,000원 / 박스</text><text class="t" x="534" y="279">10개 / 박스</text><path d="M440 322 Q490 325 505 267 M438 235 L505 225" stroke="#287968" stroke-width="3" fill="none"/><text class="s" x="33" y="426">각주를 찾는 것에 더해, 어느 가격에 적용되는지 연결합니다.</text></svg>
