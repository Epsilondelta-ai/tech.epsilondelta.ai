<svg xmlns="http://www.w3.org/2000/svg" width="800" height="460" viewBox="0 0 800 460" role="img" aria-label="글자 → 표의 관계 → 업무 항목"><rect width="800" height="460" rx="24" fill="#faf7ef"/><style>text{font-family:'Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#193b43}.h{font-size:27px;font-weight:700}.t{font-size:22px}.s{font-size:18px}.n{font-size:32px;font-weight:700}</style><text class="h" x="32" y="49">글자 → 표의 관계 → 업무 항목</text><rect x="32" y="85" width="225" height="280" rx="15" fill="#e1eee8"/><rect x="286" y="85" width="225" height="280" rx="15" fill="#e1eee8"/><rect x="540" y="85" width="228" height="280" rx="15" fill="#f4e1d7"/><text class="t" x="53" y="126">① 문자 인식</text><text class="n" x="55" y="198">90,000원</text><text class="t" x="55" y="244">박스 · 10개입</text><text class="t" x="307" y="126">② 구조 파악</text><text class="t" x="307" y="186">어느 품목의 가격?</text><text class="t" x="307" y="228">어느 단위가 적용?</text><text class="t" x="307" y="270">각주는 어디에 연결?</text><text class="t" x="561" y="126">③ 항목 추출</text><text class="t" x="561" y="187">공급사: B</text><text class="t" x="561" y="229">박스 가격: 90,000</text><text class="t" x="561" y="271">박스당 수량: 10</text><text class="t" x="261" y="230">→</text><text class="t" x="515" y="230">→</text><text class="s" x="32" y="415">숫자를 읽은 뒤에도 품목·단위·수량의 관계를 보존해야 합니다.</text></svg>
