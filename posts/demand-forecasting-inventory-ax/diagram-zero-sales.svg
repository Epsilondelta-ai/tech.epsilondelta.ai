<svg xmlns="http://www.w3.org/2000/svg" width="800" height="460" viewBox="0 0 800 460" role="img" aria-labelledby="title desc"><title id="title">판매량 0개, 원인은 다를 수 있습니다</title><desc id="desc">가상 비교: 재고가 있지만 고객이 찾지 않아 판매량 0인 경우와 고객이 찾지만 품절이라 판매량 0인 경우. 판매만으로 수요를 구분할 수 없어 재고와 품절 기록이 필요.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#466766"/></marker></defs><rect width="800" height="460" rx="20" fill="#faf7f0"/><g font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" fill="#183b3b"><text x="32" y="46" font-size="25" font-weight="700">판매량 0개, 원인은 다를 수 있습니다</text><text x="32" y="78" font-size="15">가상 상황 · 같은 판매 기록, 서로 다른 원인</text><rect x="32" y="110" width="354" height="240" rx="14" fill="#e2eeeb"/><text x="56" y="150" font-size="24">재고는 있는데</text><text x="56" y="184" font-size="24">고객이 찾지 않았습니다</text><rect x="62" y="215" width="68" height="58" rx="6" fill="#5b9691"/><rect x="149" y="215" width="68" height="58" rx="6" fill="#5b9691"/><text x="56" y="320" font-size="24">관측 판매량 0개</text><rect x="414" y="110" width="354" height="240" rx="14" fill="#f5dfd3"/><text x="438" y="150" font-size="24">고객은 찾는데</text><text x="438" y="184" font-size="24">상품이 품절됐습니다</text><path d="M443 270H718M443 215V275M718 215V275" fill="none" stroke="#cc947d" stroke-width="4"/><text x="438" y="320" font-size="24">관측 판매량 0개</text><text x="60" y="404" font-size="23">판매 기록 + 재고 가용성 + 품절 시간을 함께 확인</text></g></svg>
