<svg xmlns="http://www.w3.org/2000/svg" width="800" height="460" viewBox="0 0 800 460" role="img" aria-labelledby="title desc"><title id="title">재고가 있는 곳과 필요한 곳을 함께 봅니다</title><desc id="desc">설계 예시: 여유 재고를 가진 매장에서 부족한 매장으로 재배치를 검토한다. 예약 재고를 제외하고 운송 시간 비용 유통기한을 확인한다. Walmart 실제 시스템의 상세 구조가 아니다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#466766"/></marker></defs><rect width="800" height="460" rx="20" fill="#faf7f0"/><g font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" fill="#183b3b"><text x="32" y="46" font-size="25" font-weight="700">재고가 있는 곳과 필요한 곳을 함께 봅니다</text><text x="32" y="78" font-size="15">재배치 판단의 설명 예시</text><rect x="32" y="112" width="220" height="165" rx="14" fill="#e2eeeb"/><text x="55" y="147" font-size="22">A매장 · 여유 재고</text><rect x="55" y="169" width="42" height="34" rx="5" fill="#5b9691"/><rect x="107" y="169" width="42" height="34" rx="5" fill="#5b9691"/><rect x="159" y="169" width="42" height="34" rx="5" fill="#5b9691"/><rect x="55" y="215" width="42" height="34" rx="5" fill="#5b9691"/><rect x="107" y="215" width="42" height="34" rx="5" fill="#5b9691"/><rect x="159" y="215" width="42" height="34" rx="5" fill="#5b9691"/><rect x="548" y="112" width="220" height="165" rx="14" fill="#f5dfd3"/><text x="570" y="147" font-size="22">B매장 · 품절 위험</text><path d="M575 200H735M575 239H735" stroke="#cc947d" stroke-width="4"/><path d="M269 193L530 193" fill="none" stroke="#466766" stroke-width="3" marker-end="url(#arrow)"/><text x="305" y="170" font-size="21">재배치 후보</text><rect x="32" y="310" width="736" height="110" rx="14" fill="#e2eeeb"/><text x="54" y="346" font-size="22">옮겨도 되는 재고인가?</text><text x="54" y="382" font-size="18">예약 물량 제외  ·  도착 시간  ·  운송비  ·  잔여 유통기한</text></g></svg>
