<svg xmlns="http://www.w3.org/2000/svg" width="800" height="460" viewBox="0 0 800 460" role="img" aria-labelledby="title desc"><title id="title">예상 판매 100개 ≠ 새 주문 100개</title><desc id="desc">본문의 가상 계산 예시. 예상 판매 100개에서 판매 가능 재고 30개와 주초 입고 예정 40개를 빼면 부족량 30개. 20개 단위 납품이라면 발주 후보 40개.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#466766"/></marker></defs><rect width="800" height="460" rx="20" fill="#faf7f0"/><g font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" fill="#183b3b"><text x="32" y="46" font-size="25" font-weight="700">예상 판매 100개 ≠ 새 주문 100개</text><text x="32" y="78" font-size="15">가상 예시 · 다음 주 수요와 주초 입고를 가정</text><rect x="32" y="112" width="165" height="116" rx="14" fill="#e2eeeb"/><text x="51" y="145" font-size="18">예상 판매</text><text x="51" y="198" font-size="38">100개</text><text x="212" y="185" font-size="32">−</text><rect x="248" y="112" width="165" height="116" rx="14" fill="#e2eeeb"/><text x="267" y="145" font-size="18">판매 가능 재고</text><text x="267" y="198" font-size="38">30개</text><text x="427" y="185" font-size="32">−</text><rect x="464" y="112" width="165" height="116" rx="14" fill="#e2eeeb"/><text x="483" y="145" font-size="18">주초 입고 예정</text><text x="483" y="198" font-size="38">40개</text><text x="645" y="185" font-size="32">=</text><text x="689" y="180" font-size="29">30개</text><path d="M708 230L708 282" fill="none" stroke="#466766" stroke-width="3" marker-end="url(#arrow)"/><rect x="32" y="295" width="736" height="100" rx="14" fill="#f5dfd3"/><text x="55" y="329" font-size="23">부족량 30개 → 20개 단위 납품이라면 발주 후보 40개</text><text x="55" y="365" font-size="17">입고 시점 · 유통기한 · 안전재고 기준을 확인해 최종 결정</text></g></svg>
