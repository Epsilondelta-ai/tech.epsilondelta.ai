<svg xmlns="http://www.w3.org/2000/svg" width="800" height="460" viewBox="0 0 800 460" role="img" aria-labelledby="title desc"><title id="title">예측 오차와 운영 결과를 함께 확인합니다</title><desc id="desc">수치 없는 평가 지도. 예측에는 품목 장소 기간별 오차와 검증 시점을 확인하며 운영에는 품절 재고 폐기 긴급배송 및 사람의 수정 시간을 확인.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#466766"/></marker></defs><rect width="800" height="460" rx="20" fill="#faf7f0"/><g font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" fill="#183b3b"><text x="32" y="46" font-size="25" font-weight="700">예측 오차와 운영 결과를 함께 확인합니다</text><rect x="32" y="100" width="350" height="235" rx="14" fill="#e2eeeb"/><text x="56" y="141" font-size="25">예측은 잘했나?</text><text x="56" y="184" font-size="18">품목·매장별 오차</text><text x="56" y="222" font-size="18">납기에 맞는 예측 기간</text><text x="56" y="260" font-size="18">예측 당시 알 수 있었던 자료</text><text x="56" y="303" font-size="16">기존 방식과 같은 조건으로 비교</text><rect x="414" y="100" width="354" height="235" rx="14" fill="#f5dfd3"/><text x="438" y="141" font-size="25">업무는 좋아졌나?</text><text x="438" y="184" font-size="18">품절 · 재고 · 폐기</text><text x="438" y="222" font-size="18">긴급 발주 · 운송 비용</text><text x="438" y="260" font-size="18">담당자의 확인·수정 시간</text><text x="438" y="303" font-size="16">실제 발주·배분 이후 결과 확인</text><rect x="32" y="363" width="736" height="63" rx="14" fill="#d7e7f2"/><text x="56" y="403" font-size="21">같은 품목과 기간에서 예측·발주·비용의 변화를 연결</text></g></svg>
