<svg xmlns="http://www.w3.org/2000/svg" width="800" height="460" viewBox="0 0 800 460" role="img" aria-labelledby="title desc"><title id="title">예측·최적화·에이전트를 업무 시스템에 연결</title><desc id="desc">설계 예시: 판매 재고 납기 데이터에서 예측 최적화를 거쳐 발주 이동 후보를 계산. 에이전트는 조회 설명 승인 요청을 돕고 구매 시스템은 권한 검사와 주문 확정을 담당.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#466766"/></marker></defs><rect width="800" height="460" rx="20" fill="#faf7f0"/><g font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" fill="#183b3b"><text x="32" y="46" font-size="25" font-weight="700">예측·최적화·에이전트를 업무 시스템에 연결</text><rect x="32" y="95" width="736" height="48" rx="14" fill="#e2eeeb"/><text x="56" y="126" font-size="20">판매 · 재고 · 입고 예정 · 납기 · 행사 데이터</text><path d="M125 148L125 183" fill="none" stroke="#466766" stroke-width="3" marker-end="url(#arrow)"/><rect x="32" y="192" width="220" height="105" rx="14" fill="#e2eeeb"/><text x="54" y="227" font-size="22">예측 모델</text><text x="54" y="259" font-size="18">수요와 불확실성</text><path d="M264 244L285 244" fill="none" stroke="#466766" stroke-width="3" marker-end="url(#arrow)"/><rect x="297" y="192" width="220" height="105" rx="14" fill="#e2eeeb"/><text x="318" y="227" font-size="22">최적화 서비스</text><text x="318" y="259" font-size="18">발주·이동 수량 후보</text><path d="M528 244L548 244" fill="none" stroke="#466766" stroke-width="3" marker-end="url(#arrow)"/><rect x="560" y="192" width="208" height="105" rx="14" fill="#f5dfd3"/><text x="579" y="227" font-size="20">구매·물류 시스템</text><text x="579" y="259" font-size="17">권한 검사 · 실행 확정</text><rect x="32" y="350" width="485" height="73" rx="14" fill="#d7e7f2"/><text x="55" y="380" font-size="21">에이전트</text><text x="55" y="407" font-size="16">담당자 질의 · 자료 조회 · 선택 이유 설명 · 승인 요청</text><path d="M405 350V310" stroke="#466766" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/><text x="556" y="380" font-size="18">회사 정책과 사람 승인</text><text x="556" y="407" font-size="16">필요한 실행 지점에 적용</text></g></svg>
