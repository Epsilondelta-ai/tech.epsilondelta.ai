<svg xmlns="http://www.w3.org/2000/svg" width="800" height="560" viewBox="0 0 800 560" lang="ko"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#377f80"/></marker></defs><rect width="800" height="560" rx="20" fill="#f8f5ed"/><g font-family="Noto Sans CJK KR, sans-serif"><text x="36" y="48" font-size="30" fill="#19374a" font-weight="700">사건 단위로 묶은 사람 판정 자료</text><rect x="30" y="78" width="740" height="94" rx="16" fill="#e0ece8" stroke="#bdd1d0" stroke-width="2"/><text x="54" y="117" font-size="30" fill="#19374a" font-weight="700">개발용</text><text x="240" y="117" font-size="27" fill="#19374a" font-weight="500">루브릭 · 예시 · 프롬프트 수정</text><text x="240" y="153" font-size="25" fill="#19374a" font-weight="500">같은 사건의 변형도 한 묶음</text><rect x="30" y="190" width="740" height="85" rx="16" fill="#ffffff" stroke="#bdd1d0" stroke-width="2"/><text x="54" y="241" font-size="30" fill="#19374a" font-weight="700">보정용</text><text x="240" y="241" font-size="27" fill="#19374a" font-weight="500">판정 경계 · 보류 기준 조정</text><rect x="30" y="293" width="740" height="110" rx="16" fill="#19374a" stroke="#19374a" stroke-width="2"/><text x="54" y="338" font-size="30" fill="#ffffff" font-weight="700">미사용 검증용</text><text x="54" y="379" font-size="28" fill="#ffffff" font-weight="500">모든 설정을 고정한 뒤 마지막에 확인</text><text x="36" y="449" font-size="27" fill="#b04435" font-weight="700">결과를 보고 수정했다면 → 새 검증 자료</text><text x="36" y="498" font-size="27" fill="#19374a" font-weight="500">합격 오판 · 실패 오판 · 보류를 따로 보고</text><text x="36" y="537" font-size="25" fill="#19374a" font-weight="500">각 비율의 분모와 자동 판정 범위도 함께 확인</text></g></svg>