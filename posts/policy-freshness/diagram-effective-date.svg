<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480"><title>게시일보다 업무 기준일을 먼저 확인합니다</title><rect width="800" height="480" rx="20" fill="#FAF7F0"/><g fill="#243E40" font-family="Noto Sans CJK KR, sans-serif"><text x="30" y="49" font-size="28" font-weight="700">게시일보다 업무 기준일을 먼저 확인합니다</text><rect x="30" y="75" width="740" height="94" rx="12" fill="#E8EFEB"/><text x="50" y="109" font-size="24" font-weight="700">2026년 10월 20일 · v2 게시</text><text x="50" y="146" font-size="21">게시 시점에는 아직 시행 전 · v2 시행일은 11월 1일</text><rect x="30" y="185" width="740" height="94" rx="12" fill="#E8EFEB"/><text x="50" y="219" font-size="24" font-weight="700">10월 20일 출장 → 현행 v1 · 10만 원</text><text x="50" y="256" font-size="21">승인된 버전 중 업무일에 효력이 있는 규정을 적용</text><rect x="30" y="295" width="740" height="94" rx="12" fill="#F4E7DA"/><text x="50" y="329" font-size="24" font-weight="700">11월 1일부터 → 예정 v2 · 13만 원</text><text x="50" y="366" font-size="21">11월 5일 출장 질문에는 시행 예정임을 함께 안내</text><text x="30" y="444" font-size="21" font-weight="600">승인 상태 + 적용 범위 + 업무 기준일 + 현재 열람 권한</text></g></svg>