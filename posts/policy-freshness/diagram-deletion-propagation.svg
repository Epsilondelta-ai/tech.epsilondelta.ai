<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480"><title>원본 삭제와 복사본 정리는 별도 작업입니다</title><rect width="800" height="480" rx="20" fill="#FAF7F0"/><g fill="#243E40" font-family="Noto Sans CJK KR, sans-serif"><text x="30" y="49" font-size="28" font-weight="700">원본 삭제와 복사본 정리는 별도 작업입니다</text><rect x="30" y="75" width="740" height="94" rx="12" fill="#F4E7DA"/><text x="50" y="109" font-size="24" font-weight="700">1  원본 저장소 · 삭제 이벤트</text><text x="50" y="146" font-size="21">파일 삭제 자체가 승인 규정의 과거 효력 종료는 아님</text><rect x="30" y="185" width="740" height="94" rx="12" fill="#E8EFEB"/><text x="50" y="219" font-size="24" font-weight="700">2  검색 색인 · 버전과 청크 대응표로 정리</text><text x="50" y="256" font-size="21">삭제 제어 기록으로 늦은 재처리가 복원하지 못하게 차단</text><rect x="30" y="295" width="740" height="94" rx="12" fill="#E8EFEB"/><text x="50" y="329" font-size="24" font-weight="700">3  답변 캐시 · 기존 응답 재사용 통제</text><text x="50" y="366" font-size="21">색인만 정리해도 저장된 옛 답변은 따로 남을 수 있음</text><text x="30" y="444" font-size="21" font-weight="600">대체·폐기·초안 철회를 구분하고 필요한 과거 이력은 보존</text></g></svg>