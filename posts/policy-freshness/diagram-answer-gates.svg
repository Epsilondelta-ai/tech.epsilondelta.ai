<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480"><title>유효성 검증을 응답 반환까지 이어갑니다</title><rect width="800" height="480" rx="20" fill="#FAF7F0"/><g fill="#243E40" font-family="Noto Sans CJK KR, sans-serif"><text x="30" y="49" font-size="28" font-weight="700">유효성 검증을 응답 반환까지 이어갑니다</text><rect x="30" y="75" width="740" height="94" rx="12" fill="#E8EFEB"/><text x="50" y="109" font-size="24" font-weight="700">1  검색 전 후보 제한 → 검색·생성</text><text x="50" y="146" font-size="21">승인 · 업무 기준일 · 직원 적용 범위 · 현재 열람 권한</text><rect x="30" y="185" width="740" height="94" rx="12" fill="#F4E7DA"/><text x="50" y="219" font-size="24" font-weight="700">2  생성 직전과 반환 직전 다시 검증</text><text x="50" y="256" font-size="21">인용 버전 · 현재 권한 revision 확인 불가 시 보류·폐기</text><rect x="30" y="295" width="740" height="94" rx="12" fill="#E8EFEB"/><text x="50" y="329" font-size="24" font-weight="700">3  캐시 적중도 정책 변화와 시간 경계로 통제</text><text x="50" y="366" font-size="21">정책 집합 revision · 다음 시행·종료 경계를 함께 확인</text><text x="30" y="444" font-size="21" font-weight="600">같은 범위·기간에 규정이 충돌하면 임의 선택 대신 충돌 보고</text></g></svg>