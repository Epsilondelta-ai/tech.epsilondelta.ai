<svg xmlns="http://www.w3.org/2000/svg" width="800" height="460" viewBox="0 0 800 460" role="img" aria-labelledby="title desc"><title id="title">Wates는 경고를 보고 작업 전략을 바꿨습니다</title><desc id="desc">Buildots가 공개한 Wates 사례. 조명 설치의 예측 지연은 대응 전 6주에서 새 전략 합의 후 1주로 줄었다. 계획 속도는 주당72개이고 회복에 필요한 속도는114개였다.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10" fill="#397b79"/></marker></defs><rect width="800" height="460" rx="20" fill="#faf7f0"/><g font-family="Apple SD Gothic Neo,Noto Sans KR,sans-serif"><text x="32" y="47" font-size="26" fill="#183b3b" font-weight="700">Wates는 경고를 보고 작업 전략을 바꿨습니다</text><text x="32" y="81" font-size="16" fill="#59696b" font-weight="400">조명 설치의 예측 지연 · Wates / Buildots 공개 사례</text><text x="34" y="142" font-size="21" fill="#183b3b" font-weight="400">대응 전</text><rect x="168" y="107" width="540" height="52" rx="12" fill="#f5dfd3"/><text x="725" y="142" font-size="24" fill="#d46c47" font-weight="700">6주</text><text x="34" y="218" font-size="21" fill="#183b3b" font-weight="400">전략 변경 후</text><rect x="168" y="183" width="90" height="52" rx="12" fill="#e2eeeb"/><text x="275" y="218" font-size="24" fill="#397b79" font-weight="700">1주</text><rect x="32" y="267" width="356" height="91" rx="12" fill="#d7e7f2"/><text x="50" y="298" font-size="18" fill="#183b3b" font-weight="400">당초 계획한 설치 속도</text><text x="50" y="337" font-size="29" fill="#183b3b" font-weight="700">주당 72개</text><rect x="412" y="267" width="356" height="91" rx="12" fill="#e2eeeb"/><text x="430" y="298" font-size="18" fill="#183b3b" font-weight="400">일정 회복에 필요한 설치 속도</text><text x="430" y="337" font-size="29" fill="#183b3b" font-weight="700">주당 114개</text><text x="32" y="394" font-size="19" fill="#183b3b" font-weight="600">작업 가능 구역 확인 → 실제 속도 분석 → 협력사와 새 전략 합의</text><text x="32" y="430" font-size="16" fill="#59696b" font-weight="400">표시한 6주·1주는 실제 준공 단축 기간이 아닌 예측 지연입니다.</text></g></svg>
