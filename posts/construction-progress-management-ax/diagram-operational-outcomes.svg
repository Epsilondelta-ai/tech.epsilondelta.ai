<svg xmlns="http://www.w3.org/2000/svg" width="800" height="460" viewBox="0 0 800 460" role="img" aria-labelledby="title desc"><title id="title">사진을 모은 뒤, 실제 작업이 달라졌나요?</title><desc id="desc">촬영 자료 확인에서 시작해 판정 대조 조치 후속 작업 및 실제 마일스톤까지 확인한다. 재촬영 수동 검토 회의 시간도 함께 측정한다.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10" fill="#397b79"/></marker></defs><rect width="800" height="460" rx="20" fill="#faf7f0"/><g font-family="Apple SD Gothic Neo,Noto Sans KR,sans-serif"><text x="32" y="47" font-size="26" fill="#183b3b" font-weight="700">사진을 모은 뒤, 실제 작업이 달라졌나요?</text><text x="32" y="81" font-size="16" fill="#59696b" font-weight="400">도입 성과를 확인하는 순서 · 가상의 운영 점검 예시</text><rect x="32" y="111" width="166" height="102" rx="12" fill="#e2eeeb"/><text x="48" y="149" font-size="23" fill="#183b3b" font-weight="700">관측</text><text x="48" y="184" font-size="16" fill="#183b3b" font-weight="400">구역 누락·최신성</text><rect x="222" y="111" width="166" height="102" rx="12" fill="#e2eeeb"/><text x="238" y="149" font-size="23" fill="#183b3b" font-weight="700">판정</text><text x="238" y="184" font-size="16" fill="#183b3b" font-weight="400">현장 확인과 대조</text><rect x="412" y="111" width="166" height="102" rx="12" fill="#e2eeeb"/><text x="428" y="149" font-size="23" fill="#183b3b" font-weight="700">조치</text><text x="428" y="184" font-size="16" fill="#183b3b" font-weight="400">담당자 처리 여부</text><rect x="602" y="111" width="166" height="102" rx="12" fill="#f5dfd3"/><text x="618" y="149" font-size="23" fill="#183b3b" font-weight="700">현장 결과</text><text x="618" y="184" font-size="16" fill="#183b3b" font-weight="400">후속 작업·일정</text><path d="M201 161L218 161" fill="none" stroke="#397b79" stroke-width="2.5" marker-end="url(#a)"/><path d="M391 161L408 161" fill="none" stroke="#397b79" stroke-width="2.5" marker-end="url(#a)"/><path d="M581 161L598 161" fill="none" stroke="#397b79" stroke-width="2.5" marker-end="url(#a)"/><rect x="32" y="251" width="736" height="83" rx="12" fill="#d7e7f2"/><text x="52" y="282" font-size="21" fill="#183b3b" font-weight="700">함께 셀 업무 부담</text><text x="52" y="313" font-size="20" fill="#183b3b" font-weight="400">재촬영 · 수동 검토 · 정정 · 회의에 쓴 시간</text><rect x="32" y="354" width="736" height="69" rx="12" fill="#e2eeeb"/><text x="52" y="382" font-size="21" fill="#183b3b" font-weight="700">이번 주 어느 구역의 막힌 일을 풀었고,</text><text x="52" y="410" font-size="21" fill="#183b3b" font-weight="700">어떤 후속 작업을 시작했습니까?</text></g></svg>
