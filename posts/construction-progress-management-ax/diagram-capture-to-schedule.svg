<svg xmlns="http://www.w3.org/2000/svg" width="800" height="460" viewBox="0 0 800 460" role="img" aria-labelledby="title desc"><title id="title">현장 영상은 이렇게 공정 데이터가 됩니다</title><desc id="desc">촬영 위치 및 시각을 BIM 객체와 연결해 시공 상태를 추정하고 공정표와 비교한다. 검사 기록과 모델 및 공정표 버전을 함께 확인한다.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10" fill="#397b79"/></marker></defs><rect width="800" height="460" rx="20" fill="#faf7f0"/><g font-family="Apple SD Gothic Neo,Noto Sans KR,sans-serif"><text x="32" y="47" font-size="26" fill="#183b3b" font-weight="700">현장 영상은 이렇게 공정 데이터가 됩니다</text><text x="32" y="81" font-size="16" fill="#59696b" font-weight="400">같은 구역·작업 ID로 근거와 상태를 연결하는 설계 예시</text><rect x="32" y="112" width="166" height="110" rx="12" fill="#e2eeeb"/><text x="48" y="150" font-size="23" fill="#183b3b" font-weight="700">현장 촬영</text><text x="48" y="188" font-size="16" fill="#183b3b" font-weight="400">영상·촬영 시각</text><rect x="222" y="112" width="166" height="110" rx="12" fill="#e2eeeb"/><text x="238" y="150" font-size="23" fill="#183b3b" font-weight="700">위치 연결</text><text x="238" y="188" font-size="16" fill="#183b3b" font-weight="400">층·구역·SLAM</text><rect x="412" y="112" width="166" height="110" rx="12" fill="#e2eeeb"/><text x="428" y="150" font-size="23" fill="#183b3b" font-weight="700">BIM 대조</text><text x="428" y="188" font-size="16" fill="#183b3b" font-weight="400">대상·설치 수량</text><rect x="602" y="112" width="166" height="110" rx="12" fill="#e2eeeb"/><text x="618" y="150" font-size="23" fill="#183b3b" font-weight="700">공정표 비교</text><text x="618" y="188" font-size="16" fill="#183b3b" font-weight="400">계획·실제·속도</text><path d="M201 167L218 167" fill="none" stroke="#397b79" stroke-width="2.5" marker-end="url(#a)"/><path d="M391 167L408 167" fill="none" stroke="#397b79" stroke-width="2.5" marker-end="url(#a)"/><path d="M581 167L598 167" fill="none" stroke="#397b79" stroke-width="2.5" marker-end="url(#a)"/><path d="M305 223L305 275" fill="none" stroke="#397b79" stroke-width="2.5" marker-end="url(#a)"/><path d="M685 223L685 275" fill="none" stroke="#397b79" stroke-width="2.5" marker-end="url(#a)"/><rect x="32" y="285" width="356" height="89" rx="12" fill="#f5dfd3"/><text x="50" y="319" font-size="22" fill="#183b3b" font-weight="700">검사·승인 기록 추가</text><text x="50" y="352" font-size="18" fill="#183b3b" font-weight="400">설치됨 ≠ 다음 작업 시작 가능</text><rect x="412" y="285" width="356" height="89" rx="12" fill="#d7e7f2"/><text x="430" y="319" font-size="22" fill="#183b3b" font-weight="700">비교 기준 버전 기록</text><text x="430" y="352" font-size="18" fill="#183b3b" font-weight="400">설계 변경 · 공정표 갱신 이력</text><text x="32" y="418" font-size="20" fill="#183b3b" font-weight="600">가림·미촬영은 ‘미설치’로 확정하지 않고 별도 상태로 관리</text></g></svg>
