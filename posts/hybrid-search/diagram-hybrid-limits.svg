<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500"><title>순위 결합은 코드 필터가 아닙니다</title><desc>어휘 검색과 벡터 검색의 후보를 합쳐 순위를 매겨도 다른 제품 코드가 남을 수 있습니다. 본문 분석 예시와 하이브리드 결합의 한계를 구분합니다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#597674" stroke-width="1.5"/></marker></defs><rect width="800" height="500" rx="20" fill="#FAF7F0"/><g font-family="'Noto Sans CJK KR','Noto Sans KR','Malgun Gothic',sans-serif"><text x="32" y="49" font-size="30" font-weight="700" fill="#243E40">순위 결합은 코드 필터가 아닙니다</text><rect x="32" y="80" width="356" height="120" rx="14" fill="#E8EFEB"/><rect x="412" y="80" width="356" height="120" rx="14" fill="#E8EFEB"/><text x="54" y="116" font-size="27" font-weight="700" fill="#243E40">어휘 검색</text><text x="54" y="154" font-size="22" font-weight="500" fill="#243E40">본문 분석 예: AX / 010 / B</text><text x="54" y="184" font-size="20" font-weight="500" fill="#243E40">공통 조각으로 다른 코드도 후보</text><text x="434" y="116" font-size="27" font-weight="700" fill="#243E40">벡터 검색</text><text x="434" y="154" font-size="24" font-weight="500" fill="#243E40">저온 기동 · 진동</text><text x="434" y="184" font-size="19" font-weight="500" fill="#243E40">다른 제품도 의미가 비슷할 수 있음</text><path d="M210 207 L315 246" fill="none" stroke="#597674" stroke-width="3" marker-end="url(#arrow)"/><path d="M590 207 L485 246" fill="none" stroke="#597674" stroke-width="3" marker-end="url(#arrow)"/><rect x="110" y="256" width="580" height="143" rx="14" fill="#F4E7DA"/><text x="134" y="293" font-size="28" font-weight="700" fill="#243E40">하이브리드 순위 결합</text><text x="134" y="334" font-size="25" font-weight="500" fill="#243E40">AX-010-B 문서  +  AX-010-8 문서</text><text x="134" y="376" font-size="24" font-weight="500" fill="#243E40">두 코드가 후보에 함께 남을 수 있음</text><text x="32" y="460" font-size="25" font-weight="700" fill="#914623">일치 가산점도 필수 조건 필터를 대신하지 못함</text></g></svg>
