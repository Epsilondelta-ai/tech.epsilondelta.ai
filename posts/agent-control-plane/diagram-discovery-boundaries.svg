<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000" viewBox="0 0 800 1000"><title>발견되는 경로와 통제되는 경로</title><rect width="800" height="1000" fill="#f6f3eb"/><style>text{font-family:Noto Sans CJK KR,sans-serif;fill:#172e3b;font-size:27px} .h{font-size:32px;font-weight:700} .b{font-size:29px;font-weight:700}</style><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#147d79" stroke-width="1.5"/></marker></defs><text x="32" y="60" class="h">발견되는 경로와 통제되는 경로</text><rect x="32" y="100" width="736" height="120" rx="14" fill="white" stroke="#bacdca"/><text x="52" y="140" class="b">네이티브 등록·발견</text><text x="52" y="180">지원 워크로드와 설정한 관리 경계 안에서 집계</text><path d="M400 220L400 260" fill="none" stroke="#147d79" stroke-width="4" marker-end="url(#a)"/><rect x="32" y="270" width="736" height="110" rx="14" fill="#e5f2ed" stroke="#bacdca"/><text x="52" y="310" class="b">중앙 에이전트 목록</text><text x="52" y="350">목적·소유자·신원·연결 경로를 확인</text><path d="M400 440L400 390" fill="none" stroke="#147d79" stroke-width="4" marker-end="url(#a)"/><rect x="32" y="450" width="736" height="158" rx="14" fill="white" stroke="#bacdca"/><text x="52" y="490" class="b">Agent 365 외부 연결 → 목록·관측 수집</text><text x="52" y="530">설계상 읽기 전용 · 수동 동기화</text><text x="52" y="568">원천 삭제의 중앙 목록 자동 반영은 미보장</text><rect x="32" y="640" width="736" height="120" rx="14" fill="#fff0d7" stroke="#bacdca"/><text x="52" y="680" class="b">외부 연결만으로 원격 실행을 멈출 수 없음</text><text x="52" y="720">런타임 중지·권한 변경은 원천의 통제 경로에서</text><rect x="32" y="790" width="736" height="150" rx="14" fill="white" stroke="#bacdca"/><text x="52" y="830" class="b">자체 호스팅은 SDK로 신원·관측 연결</text><text x="52" y="870">미연결·비지원 자산은 별도로 발견·대조</text><text x="52" y="908">목록 동기화와 코드 계측은 서로 다른 경로</text></svg>