<svg xmlns="http://www.w3.org/2000/svg" width="800" height="764" viewBox="0 0 800 764" role="img"><title>이번 주 회의에서 확인할 네 가지</title><rect width="800" height="764" fill="#f6f3eb"/><style>text{font-family:Noto Sans CJK KR,sans-serif;fill:#172e3b} .title{font-size:34px;font-weight:700} .head{font-size:30px;font-weight:700} .body{font-size:27px}</style><text x="38" y="65" class="title">이번 주 회의에서 확인할 네 가지</text><path d="M38 94H762" stroke="#147d79" stroke-width="5"/><rect x="32" y="124" width="736" height="108" rx="14" fill="white" stroke="#c5d3cf"/><rect x="32" y="124" width="8" height="108" rx="4" fill="#147d79"/><text x="58" y="165" class="head">발견 경로</text><text x="58" y="206" class="body">자동 등록 밖의 에이전트도 파악하고 있는가?</text><rect x="32" y="250" width="736" height="108" rx="14" fill="white" stroke="#c5d3cf"/><rect x="32" y="250" width="8" height="108" rx="4" fill="#147d79"/><text x="58" y="291" class="head">소유권 승계</text><text x="58" y="332" class="body">인사이동·퇴사와 대장·권한이 연결되는가?</text><rect x="32" y="376" width="736" height="108" rx="14" fill="white" stroke="#c5d3cf"/><rect x="32" y="376" width="8" height="108" rx="4" fill="#147d79"/><text x="58" y="417" class="head">실제 집행</text><text x="58" y="458" class="body">우회 호출 없이 집행 모드로 통제하는가?</text><rect x="32" y="502" width="736" height="108" rx="14" fill="white" stroke="#c5d3cf"/><rect x="32" y="502" width="8" height="108" rx="4" fill="#147d79"/><text x="58" y="543" class="head">퇴역 검증</text><text x="58" y="584" class="body">런타임 정지·자격증명 회수를 확인했는가?</text><text x="38" y="644" class="body" font-weight="700">목록 · 책임 · 실행 경로 · 종료 증거를 연결</text></svg>