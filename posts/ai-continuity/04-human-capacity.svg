<svg xmlns="http://www.w3.org/2000/svg" width="800" height="640" viewBox="0 0 800 640"><rect width="800" height="640" rx="24" fill="#f7f4ed"/><style>text{font-family:'Noto Sans CJK KR','Noto Sans KR',sans-serif;fill:#183344}.h{font-size:30px;font-weight:700}.a{font-size:26px;font-weight:700}.b{font-size:23px}</style><text x="40" y="65" class="h">이 조건이라면, 시간당 처리 여력은?</text><rect x="40" y="100" width="720" height="82" rx="14" fill="white" stroke="#b9cdc8"/><rect x="40" y="100" width="8" height="82" rx="4" fill="#218478"/><text x="66" y="134" class="a">가정: 시간당 120건 유입</text><text x="66" y="165" class="b">투입 가능 인원 4명 · 건당 15분</text><rect x="40" y="200" width="720" height="82" rx="14" fill="white" stroke="#b9cdc8"/><rect x="40" y="200" width="8" height="82" rx="4" fill="#218478"/><text x="66" y="234" class="a">수동 처리: 시간당 16건</text><text x="66" y="265" class="b">4명 × 60분 ÷ 15분 = 16건</text><rect x="40" y="300" width="720" height="82" rx="14" fill="white" stroke="#b9cdc8"/><rect x="40" y="300" width="8" height="82" rx="4" fill="#218478"/><text x="66" y="334" class="a">새로 쌓이는 적체: 시간당 104건</text><text x="66" y="365" class="b">120건 − 16건 = 104건</text><rect x="40" y="400" width="720" height="82" rx="14" fill="white" stroke="#b9cdc8"/><rect x="40" y="400" width="8" height="82" rx="4" fill="#218478"/><text x="66" y="434" class="a">함께 조정할 것</text><text x="66" y="465" class="b">긴급 건 선별 · 승인 절차에 따른 기한 조정</text><text x="40" y="592" class="b">원문 검토 · 승인 요청 · 회신 기록까지 포함한 계산</text></svg>