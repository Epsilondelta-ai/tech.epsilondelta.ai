<svg xmlns="http://www.w3.org/2000/svg" width="800" height="640" viewBox="0 0 800 640"><rect width="800" height="640" rx="24" fill="#f7f4ed"/><style>text{font-family:'Noto Sans CJK KR','Noto Sans KR',sans-serif;fill:#183344}.h{font-size:30px;font-weight:700}.a{font-size:26px;font-weight:700}.b{font-size:23px}</style><text x="40" y="65" class="h">장애 전에 합의할 네 가지</text><rect x="40" y="100" width="720" height="82" rx="14" fill="white" stroke="#b9cdc8"/><rect x="40" y="100" width="8" height="82" rx="4" fill="#218478"/><text x="66" y="134" class="a">접수와 실행의 경계</text><text x="66" y="165" class="b">저장과 원문 접근 확인 · 대외 실행 보류</text><rect x="40" y="200" width="720" height="82" rx="14" fill="white" stroke="#b9cdc8"/><rect x="40" y="200" width="8" height="82" rx="4" fill="#218478"/><text x="66" y="234" class="a">실제 처리 여력과 기한</text><text x="66" y="265" class="b">긴급 기준 · 인력 용량 · 약정과 승인 절차</text><rect x="40" y="300" width="720" height="82" rx="14" fill="white" stroke="#b9cdc8"/><rect x="40" y="300" width="8" height="82" rx="4" fill="#218478"/><text x="66" y="334" class="a">인계 수락과 기록</text><text x="66" y="365" class="b">담당자 수락 · 외부 요청 여부 · 실행 주도권</text><rect x="40" y="400" width="720" height="82" rx="14" fill="white" stroke="#b9cdc8"/><rect x="40" y="400" width="8" height="82" rx="4" fill="#218478"/><text x="66" y="434" class="a">원장 대조와 단계적 재개</text><text x="66" y="465" class="b">중복 제거 · 미확정 격리 · 소량부터 확대</text><text x="40" y="592" class="b">업무별 담당자와 결정 권한을 미리 정해둡니다</text></svg>