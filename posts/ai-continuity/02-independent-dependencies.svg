<svg xmlns="http://www.w3.org/2000/svg" width="800" height="580" viewBox="0 0 800 580"><rect width="800" height="580" rx="24" fill="#f7f4ed"/><style>text{font-family:'Noto Sans CJK KR','Noto Sans KR',sans-serif;fill:#183344;font-size:24px}.h{font-size:30px;font-weight:700}.a{font-size:27px;font-weight:700}</style><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#218478" stroke-width="1.5"/></marker></defs><text x="40" y="60" class="h">모델을 바꿔도, 의존성은?</text><rect x="40" y="100" width="330" height="90" rx="16" fill="white" stroke="#b9cdc8"/><text x="205" y="153" text-anchor="middle" class="a">주력 모델</text><rect x="430" y="100" width="330" height="90" rx="16" fill="white" stroke="#b9cdc8"/><text x="595" y="153" text-anchor="middle" class="a">예비 모델</text><path d="M205 190V225H595V190M400 225V255" fill="none" stroke="#218478" stroke-width="3" marker-end="url(#arrow)"/><rect x="100" y="265" width="600" height="100" rx="16" fill="#fff0d5" stroke="#bd8434"/><text x="400" y="307" text-anchor="middle" class="a">공유 인증 · 저장소 · 업무 원장</text><text x="400" y="341" text-anchor="middle">같은 기반이 멈추면 두 경로가 함께 막힐 수 있음</text><rect x="40" y="405" width="720" height="100" rx="16" fill="white" stroke="#b9cdc8"/><text x="66" y="445" class="a">예비 경로와 수동 화면을 실제로 시험</text><text x="66" y="481">접근 · 연락 · 의존성 확인 / 기존 권한과 승인 유지</text><text x="40" y="550">대체 경로가 장애 원인과 분리되는지 확인합니다</text></svg>