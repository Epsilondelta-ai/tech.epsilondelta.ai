<svg xmlns="http://www.w3.org/2000/svg" width="800" height="460" viewBox="0 0 800 460" role="img" aria-labelledby="title desc"><title id="title">작은 파일럿에서 인계 가능성을 확인합니다</title><desc id="desc">성과 수치를 가정하지 않고, 연결과 검토 과정을 비교합니다</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#176d70"/></marker></defs><rect width="800" height="460" rx="18" fill="#faf7f0"/><g font-family="Noto Sans CJK KR, Noto Sans CJK JP, sans-serif"><text x="32" y="48" fill="#193449" font-size="29" font-weight="700">작은 파일럿에서 인계 가능성을 확인합니다</text><text x="32" y="82" fill="#526471" font-size="18" font-weight="400">성과 수치를 가정하지 않고, 연결과 검토 과정을 비교합니다</text><rect x="32" y="112" width="350" height="119" rx="14" fill="#ffffff" stroke="#d8dedc"/><text x="50" y="144" fill="#176d70" font-size="18" font-weight="700">01</text><text x="92" y="146" fill="#193449" font-size="24" font-weight="700">종료 사건 선택</text><text x="50" y="195" fill="#193449" font-size="20" font-weight="400">한 설비군 · 한 인계 사건</text><rect x="418" y="112" width="350" height="119" rx="14" fill="#ffffff" stroke="#d8dedc"/><text x="436" y="144" fill="#176d70" font-size="18" font-weight="700">02</text><text x="478" y="146" fill="#193449" font-size="24" font-weight="700">최소 연결 정보</text><text x="436" y="195" fill="#193449" font-size="20" font-weight="400">설비·제품·시각·사건</text><rect x="418" y="260" width="350" height="119" rx="14" fill="#ffffff" stroke="#d8dedc"/><text x="436" y="292" fill="#176d70" font-size="18" font-weight="700">03</text><text x="478" y="294" fill="#193449" font-size="24" font-weight="700">구분과 확인 상태</text><text x="436" y="343" fill="#193449" font-size="20" font-weight="400">원본·AI·설명, 미확인 표시</text><rect x="32" y="260" width="350" height="119" rx="14" fill="#ffffff" stroke="#d8dedc"/><text x="50" y="292" fill="#176d70" font-size="18" font-weight="700">04</text><text x="92" y="294" fill="#193449" font-size="24" font-weight="700">실제 인계로 검증</text><text x="50" y="343" fill="#193449" font-size="20" font-weight="400">원본 접근 · 추가 질문 · 부담</text><path d="M383 170 L414 170" fill="none" stroke="#176d70" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M593 234 L593 256" fill="none" stroke="#176d70" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M415 320 L386 320" fill="none" stroke="#176d70" stroke-width="2.5" marker-end="url(#arrow)"/><text x="32" y="427" fill="#176d70" font-size="22" font-weight="700">다음 담당자가 맥락과 미확인 사항을 되짚을 수 있는가?</text></g></svg>