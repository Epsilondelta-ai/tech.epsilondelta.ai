<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img"><title>업무 난도와 검사 결과에 따라 모델을 고릅니다</title><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#287D75"/></marker></defs><rect width="800" height="450" rx="18" fill="#FAF8F2"/><g font-family="Apple SD Gothic Neo,Noto Sans KR,sans-serif"><text x="30" y="46" font-size="26" fill="#193D3B" font-weight="700">업무 난도와 검사 결과에 따라 모델을 고릅니다</text><rect x="30" y="96" width="135" height="77" rx="12" fill="#fff" stroke="#D9E3DB"/><text x="48" y="127" font-size="22" fill="#193D3B" font-weight="700">업무 요청</text><text x="48" y="154" font-size="18" fill="#193D3B" font-weight="400">난도 분류</text><path d="M165 135L205 135" stroke="#287D75" stroke-width="2.5" fill="none" marker-end="url(#a)"/><rect x="215" y="96" width="203" height="77" rx="12" fill="#EAF1EB" stroke="#D9E3DB"/><text x="235" y="127" font-size="21" fill="#193D3B" font-weight="400">단순 추출</text><text x="235" y="154" font-size="18" fill="#193D3B" font-weight="400">저렴한 모델</text><path d="M418 135L462 135" stroke="#287D75" stroke-width="2.5" fill="none" marker-end="url(#a)"/><rect x="472" y="96" width="135" height="77" rx="12" fill="#fff" stroke="#D9E3DB"/><text x="490" y="127" font-size="20" fill="#193D3B" font-weight="400">결과 검사</text><text x="490" y="154" font-size="17" fill="#193D3B" font-weight="400">합계·필수값</text><path d="M607 135L650 135" stroke="#287D75" stroke-width="2.5" fill="none" marker-end="url(#a)"/><rect x="660" y="96" width="110" height="77" rx="12" fill="#EAF1EB" stroke="#D9E3DB"/><text x="683" y="140" font-size="22" fill="#193D3B" font-weight="400">완료</text><path d="M98 173V269H205" stroke="#287D75" stroke-width="2.5" fill="none" marker-end="url(#a)"/><path d="M540 173V199H317V226" stroke="#C7634C" stroke-width="2" fill="none"/><text x="443" y="219" font-size="15" fill="#C7634C" font-weight="400">검사 실패</text><rect x="215" y="231" width="203" height="77" rx="12" fill="#FCE3D8" stroke="#D9E3DB"/><text x="235" y="262" font-size="21" fill="#193D3B" font-weight="400">복잡한 조건</text><text x="235" y="289" font-size="18" fill="#193D3B" font-weight="400">더 강한 모델</text><path d="M418 269L462 269" stroke="#287D75" stroke-width="2.5" fill="none" marker-end="url(#a)"/><rect x="472" y="231" width="298" height="77" rx="12" fill="#fff" stroke="#D9E3DB"/><text x="490" y="262" font-size="18" fill="#193D3B" font-weight="400">재검사 → 완료 또는 사람 검토</text><text x="490" y="289" font-size="17" fill="#193D3B" font-weight="400">품질 기준에 따라 처리</text><rect x="30" y="348" width="740" height="69" rx="12" fill="#fff" stroke="#D9E3DB"/><text x="50" y="378" font-size="22" fill="#193D3B" font-weight="700">모델 선택 + 검사 + 재시도 비용까지 합산</text><text x="50" y="404" font-size="17" fill="#193D3B" font-weight="400">같은 업무로 품질·비용·직원 수정 시간을 비교합니다.</text></g></svg>
