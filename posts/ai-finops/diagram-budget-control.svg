<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img"><title>알림을 보내는 것과 실행을 통제하는 것은 다릅니다</title><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#287D75"/></marker></defs><rect width="800" height="450" rx="18" fill="#FAF8F2"/><g font-family="Apple SD Gothic Neo,Noto Sans KR,sans-serif"><text x="30" y="46" font-size="26" fill="#193D3B" font-weight="700">알림을 보내는 것과 실행을 통제하는 것은 다릅니다</text><rect x="30" y="85" width="740" height="78" rx="12" fill="#FCE3D8" stroke="#D9E3DB"/><text x="49" y="119" font-size="22" fill="#C7634C" font-weight="700">예산 알림</text><text x="216" y="116" font-size="19" fill="#193D3B" font-weight="400">사용량 집계 → 임계치 도달 → 담당자 통보</text><text x="216" y="144" font-size="17" fill="#193D3B" font-weight="400">알림만으로 실행이 자동 중단되지는 않습니다.</text><text x="30" y="207" font-size="22" fill="#287D75" font-weight="700">실행 단계의 통제</text><rect x="30" y="230" width="160" height="79" rx="12" fill="#fff" stroke="#D9E3DB"/><text x="44" y="262" font-size="19" fill="#193D3B" font-weight="700">공통 예산 확인</text><text x="44" y="289" font-size="16" fill="#193D3B" font-weight="400">예상 비용 예약</text><rect x="238" y="230" width="148" height="79" rx="12" fill="#fff" stroke="#D9E3DB"/><text x="252" y="262" font-size="19" fill="#193D3B" font-weight="700">작업 실행</text><text x="252" y="289" font-size="16" fill="#193D3B" font-weight="400">횟수·시간 점검</text><rect x="434" y="230" width="152" height="79" rx="12" fill="#fff" stroke="#D9E3DB"/><text x="448" y="262" font-size="19" fill="#193D3B" font-weight="700">처리 상태 확인</text><text x="448" y="289" font-size="16" fill="#193D3B" font-weight="400">실제 비용 정산</text><rect x="634" y="230" width="136" height="79" rx="12" fill="#fff" stroke="#D9E3DB"/><text x="648" y="262" font-size="19" fill="#193D3B" font-weight="700">완료·인계</text><text x="648" y="289" font-size="16" fill="#193D3B" font-weight="400">결과·기록 전달</text><path d="M192 270L228 270" stroke="#287D75" stroke-width="2.5" fill="none" marker-end="url(#a)"/><path d="M388 270L424 270" stroke="#287D75" stroke-width="2.5" fill="none" marker-end="url(#a)"/><path d="M588 270L624 270" stroke="#287D75" stroke-width="2.5" fill="none" marker-end="url(#a)"/><rect x="30" y="348" width="740" height="67" rx="12" fill="#fff" stroke="#D9E3DB"/><text x="50" y="377" font-size="21" fill="#193D3B" font-weight="700">발주 요청 중 한도에 닿았다면?</text><text x="50" y="404" font-size="18" fill="#193D3B" font-weight="400">발주가 들어갔는지 확인하고 처리 기록과 함께 사람에게 넘깁니다.</text></g></svg>
