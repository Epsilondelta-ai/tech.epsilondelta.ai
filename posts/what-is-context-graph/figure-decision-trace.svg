<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">최종 상태와 Context Graph의 차이</title>
  <desc id="desc">기존 CRM에는 할인율 20퍼센트만 남지만 Context Graph에는 고객, 정책, 장애, 선례, 승인, 실행과 계약 갱신 결과가 연결되어 있음을 보여준다.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#DED8C8" stroke-width="1" opacity=".42"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="9" stdDeviation="10" flood-color="#17212B" flood-opacity=".10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#59636E"/>
    </marker>
  </defs>

  <rect width="1200" height="675" rx="28" fill="#F7F4EC"/>
  <rect width="1200" height="675" rx="28" fill="url(#grid)"/>

  <rect x="48" y="38" width="164" height="34" rx="17" fill="#E8F3FF"/>
  <text x="130" y="61" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="16" font-weight="800" fill="#2563EB">CONTEXT GRAPH</text>
  <text x="48" y="116" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="34" font-weight="800" fill="#17212B">결과 하나를 판단의 경로로 되돌립니다</text>
  <text x="48" y="153" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="19" fill="#66717D">최종 값만 남기지 않고 당시의 근거·정책·승인과 이후 결과를 연결합니다</text>

  <g filter="url(#shadow)">
    <rect x="48" y="196" width="286" height="372" rx="24" fill="#FFFFFF" stroke="#CBD2D9" stroke-width="2"/>
    <rect x="70" y="218" width="112" height="29" rx="14" fill="#EEF1F4"/>
    <text x="126" y="238" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="14" font-weight="800" fill="#59636E">기존 CRM</text>
    <text x="70" y="288" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="19" font-weight="700" fill="#66717D">현재 상태</text>
    <rect x="70" y="309" width="242" height="92" rx="18" fill="#E8F3FF" stroke="#2563EB" stroke-width="2"/>
    <text x="191" y="350" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="17" font-weight="700" fill="#2563EB">할인율</text>
    <text x="191" y="382" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="32" font-weight="900" fill="#17212B">20%</text>

    <g font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="16" fill="#98A1AA">
      <rect x="70" y="427" width="242" height="34" rx="10" fill="#F4F5F6"/>
      <text x="88" y="450">적용 정책</text><text x="286" y="450" text-anchor="end">?</text>
      <rect x="70" y="470" width="242" height="34" rx="10" fill="#F4F5F6"/>
      <text x="88" y="493">승인 근거</text><text x="286" y="493" text-anchor="end">?</text>
      <rect x="70" y="513" width="242" height="34" rx="10" fill="#F4F5F6"/>
      <text x="88" y="536">이후 결과</text><text x="286" y="536" text-anchor="end">?</text>
    </g>
  </g>

  <path d="M352 382H408" stroke="#59636E" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="380" y="361" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="14" font-weight="800" fill="#59636E">연결</text>

  <g font-family="Pretendard, 'Noto Sans KR', sans-serif">
    <path d="M535 273L676 337M759 262L759 315M982 273L844 337M535 476L676 397M759 481L759 405M844 360H941M1030 402V452" fill="none" stroke="#59636E" stroke-width="3" marker-end="url(#arrow)"/>

    <g filter="url(#shadow)">
      <rect x="436" y="208" width="198" height="70" rx="17" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
      <circle cx="468" cy="243" r="16" fill="#E8F3FF"/>
      <path d="M460 247c3-8 13-8 16 0M468 239a5 5 0 1 0 0-10 5 5 0 0 0 0 10" fill="none" stroke="#2563EB" stroke-width="2"/>
      <text x="495" y="239" font-size="15" font-weight="700" fill="#66717D">고객</text>
      <text x="495" y="260" font-size="19" font-weight="800" fill="#17212B">ACME</text>

      <rect x="658" y="197" width="202" height="70" rx="17" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/>
      <circle cx="690" cy="232" r="16" fill="#D9F3EC"/>
      <path d="M683 223h14v18h-14zM686 228h8M686 233h8" fill="none" stroke="#0F766E" stroke-width="2"/>
      <text x="717" y="228" font-size="15" font-weight="700" fill="#66717D">적용 정책</text>
      <text x="717" y="249" font-size="18" font-weight="800" fill="#17212B">v3.2 · 한도 10%</text>

      <rect x="884" y="208" width="204" height="70" rx="17" fill="#FFFFFF" stroke="#E76F51" stroke-width="2"/>
      <circle cx="916" cy="243" r="16" fill="#FFF1E8"/>
      <path d="M916 231v14M916 251v1" stroke="#E76F51" stroke-width="3" stroke-linecap="round"/>
      <text x="943" y="239" font-size="15" font-weight="700" fill="#66717D">근거</text>
      <text x="943" y="260" font-size="18" font-weight="800" fill="#17212B">SEV-1 장애 3건</text>

      <rect x="651" y="315" width="216" height="92" rx="22" fill="#2563EB"/>
      <circle cx="692" cy="361" r="22" fill="#FFFFFF" opacity=".18"/>
      <path d="M681 361h12l10-12M693 361l10 12" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="724" y="351" font-size="15" font-weight="700" fill="#DDE9FF">결정 D-42</text>
      <text x="724" y="380" font-size="23" font-weight="900" fill="#FFFFFF">20% 예외 승인</text>

      <rect x="436" y="446" width="198" height="70" rx="17" fill="#FFFFFF" stroke="#6D5BD0" stroke-width="2"/>
      <circle cx="468" cy="481" r="16" fill="#EEEAFE"/>
      <path d="M459 481h18M468 472v18" stroke="#6D5BD0" stroke-width="2.4"/>
      <text x="495" y="477" font-size="15" font-weight="700" fill="#66717D">선례</text>
      <text x="495" y="498" font-size="18" font-weight="800" fill="#17212B">지난 분기 유사 사례</text>

      <rect x="658" y="456" width="202" height="70" rx="17" fill="#FFFFFF" stroke="#B77900" stroke-width="2"/>
      <circle cx="690" cy="491" r="16" fill="#FFF7D6"/>
      <path d="M681 493l6 6 12-15" fill="none" stroke="#B77900" stroke-width="2.5" stroke-linecap="round"/>
      <text x="717" y="487" font-size="15" font-weight="700" fill="#66717D">승인자</text>
      <text x="717" y="508" font-size="18" font-weight="800" fill="#17212B">재무 책임자</text>

      <rect x="941" y="326" width="196" height="76" rx="18" fill="#FFF1E8" stroke="#E76F51" stroke-width="2"/>
      <text x="1039" y="355" text-anchor="middle" font-size="15" font-weight="700" fill="#B45336">실행</text>
      <text x="1039" y="381" text-anchor="middle" font-size="19" font-weight="900" fill="#17212B">CRM 20% 반영</text>

      <rect x="941" y="452" width="196" height="76" rx="18" fill="#D9F3EC" stroke="#0F766E" stroke-width="2"/>
      <text x="1039" y="481" text-anchor="middle" font-size="15" font-weight="700" fill="#0F766E">결과</text>
      <text x="1039" y="507" text-anchor="middle" font-size="19" font-weight="900" fill="#17212B">계약 갱신</text>
    </g>
  </g>

  <rect x="414" y="576" width="724" height="48" rx="24" fill="#17212B"/>
  <text x="776" y="607" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">무엇이 일어났는가 + 왜 허용됐는가 + 결과가 어땠는가</text>
</svg>
