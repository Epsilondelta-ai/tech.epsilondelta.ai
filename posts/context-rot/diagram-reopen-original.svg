<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-labelledby="title desc" style="max-width:100%;height:auto">
<title id="title">가벼운 문맥, 다시 펼칠 수 있는 원문</title><desc id="desc">현재 문맥에는 상태와 파일 경로 또는 URL, 문서 식별자와 조항 위치를 남깁니다. 예외 조건이나 숫자 확인이 필요하면 원문을 다시 열고 고객사, 적용 시점과 출처를 대조해 판단에 반영합니다. 검색과 요약에도 원문 재조회 경로를 연결합니다.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#597674" stroke-width="1.5"/></marker></defs>
<rect width="800" height="500" rx="20" fill="#FAF7F0"/>
<g font-family="'Noto Sans CJK KR','Noto Sans KR','Malgun Gothic',sans-serif"><text x="32" y="49" font-size="32" font-weight="700" fill="#243E40">가벼운 문맥, 다시 펼칠 수 있는 원문</text><rect x="32" y="78" width="736" height="100" rx="14" fill="#E8EFEB"/><text x="52" y="116" font-size="28" font-weight="700" fill="#243E40">현재 문맥에 남기기</text><text x="52" y="154" font-size="26" font-weight="500" fill="#243E40">상태 + 파일·URL + 문서 식별자·조항 위치</text><path d="M400 183 L400 207" fill="none" stroke="#597674" stroke-width="3" marker-end="url(#arrow)"/><rect x="32" y="217" width="736" height="94" rx="14" fill="#F4E7DA"/><text x="52" y="253" font-size="28" font-weight="700" fill="#243E40">예외·숫자 확인이 필요할 때</text><text x="52" y="290" font-size="26" font-weight="500" fill="#243E40">남겨둔 경로로 원문 다시 열기</text><path d="M400 316 L400 340" fill="none" stroke="#597674" stroke-width="3" marker-end="url(#arrow)"/><rect x="32" y="350" width="736" height="88" rx="14" fill="#E8EFEB"/><text x="52" y="386" font-size="28" font-weight="700" fill="#243E40">원문 대조 후 판단에 반영</text><text x="52" y="422" font-size="26" font-weight="500" fill="#243E40">예외 조항·수치·고객사·적용 시점·출처</text><text x="32" y="478" font-size="26" font-weight="700" fill="#914623">검색·요약에도 원문 재조회 경로를 연결</text></g></svg>