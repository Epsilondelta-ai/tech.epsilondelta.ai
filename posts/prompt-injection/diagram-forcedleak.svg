<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img"><title>외부 문의가 CRM 안에 저장돼도, 작성자는 외부인입니다</title><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#297D75"/></marker></defs><rect width="800" height="450" rx="18" fill="#FAF8F2"/><g font-family="Apple SD Gothic Neo,Noto Sans KR,sans-serif"><text x="30" y="45" font-size="27" fill="#193D40">외부 문의가 CRM 안에 저장돼도, 작성자는 외부인입니다</text><text x="30" y="80" font-size="16" fill="#193D40">ForcedLeak 공개 연구의 경로를 단순화</text><rect x="30" y="110" width="230" height="108" rx="12" fill="#fff" stroke="#D6E3DB"/><text x="48" y="146" font-size="23" fill="#193D40">외부 문의</text><text x="48" y="185" font-size="18" fill="#193D40">지시가 섞인 내용</text><path d="M264 161L279 161" fill="none" stroke="#297D75" stroke-width="3" marker-end="url(#a)"/><rect x="285" y="110" width="230" height="108" rx="12" fill="#fff" stroke="#D6E3DB"/><text x="303" y="146" font-size="23" fill="#193D40">CRM 저장</text><text x="303" y="185" font-size="18" fill="#193D40">고객 문의 필드</text><path d="M519 161L534 161" fill="none" stroke="#297D75" stroke-width="3" marker-end="url(#a)"/><rect x="540" y="110" width="230" height="108" rx="12" fill="#fff" stroke="#D6E3DB"/><text x="558" y="146" font-size="23" fill="#193D40">AI가 조회</text><text x="558" y="185" font-size="18" fill="#193D40">직원의 정상 요청</text><path d="M655 227L655 263" fill="none" stroke="#297D75" stroke-width="3" marker-end="url(#a)"/><rect x="285" y="277" width="485" height="69" rx="12" fill="#FBE7DE" stroke="#D6E3DB"/><text x="307" y="306" font-size="20" fill="#193D40">내부 정보 조회 → 외부 이미지 요청으로 유출</text><text x="307" y="332" font-size="17" fill="#193D40">출력·네트워크 경로까지 공격에 결합</text><text x="30" y="391" font-size="18" fill="#193D40">연구팀은 2025년 9월 외부 URL 통제 조치를 설명합니다.</text><text x="30" y="423" font-size="15" fill="#193D40">출처: Noma Labs · ForcedLeak 취약점 재현 연구</text></g></svg>
