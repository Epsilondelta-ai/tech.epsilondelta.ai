<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img"><title>참고한 문장이 조직의 규칙으로 자동 승격되지 않도록</title><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#297D75"/></marker></defs><rect width="800" height="450" rx="18" fill="#FAF8F2"/><g font-family="Apple SD Gothic Neo,Noto Sans KR,sans-serif"><text x="30" y="45" font-size="27" fill="#193D40">참고한 문장이 조직의 규칙으로 자동 승격되지 않도록</text><rect x="30" y="100" width="225" height="111" rx="12" fill="#FBE7DE" stroke="#D6E3DB"/><text x="49" y="138" font-size="23" fill="#193D40">외부 문서</text><text x="49" y="177" font-size="18" fill="#193D40">특정 업체 우선 요구</text><path d="M260 154L287 154" fill="none" stroke="#297D75" stroke-width="3" marker-end="url(#a)"/><rect x="299" y="100" width="225" height="111" rx="12" fill="#fff" stroke="#D6E3DB"/><text x="317" y="138" font-size="23" fill="#193D40">출처와 함께 기록</text><text x="317" y="177" font-size="18" fill="#193D40">참고 자료로 보관</text><path d="M530 154L557 154" fill="none" stroke="#297D75" stroke-width="3" marker-end="url(#a)"/><rect x="569" y="100" width="201" height="111" rx="12" fill="#EAF3EF" stroke="#D6E3DB"/><text x="585" y="138" font-size="22" fill="#193D40">별도 검토·승인</text><text x="585" y="177" font-size="18" fill="#193D40">검토 후 채택·반려</text><rect x="30" y="261" width="740" height="113" rx="12" fill="#fff" stroke="#D6E3DB"/><text x="50" y="299" font-size="23" fill="#193D40">요약하거나 다른 에이전트에게 넘길 때도</text><text x="50" y="337" font-size="20" fill="#193D40">작성 주체와 출처를 유지하고, 공통 지침 변경은 따로 검토</text><text x="30" y="425" font-size="15" fill="#193D40">일반적인 관리 구성 예시 · 조직별 메모리·지침 승인 절차에 맞춰 적용</text></g></svg>
