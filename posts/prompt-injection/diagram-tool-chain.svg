<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img"><title>각각 정상인 도구도, 연결한 순서와 대상을 확인합니다</title><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#297D75"/></marker></defs><rect width="800" height="450" rx="18" fill="#FAF8F2"/><g font-family="Apple SD Gothic Neo,Noto Sans KR,sans-serif"><text x="30" y="45" font-size="27" fill="#193D40">각각 정상인 도구도, 연결한 순서와 대상을 확인합니다</text><text x="30" y="81" font-size="17" fill="#193D40">GitHub MCP 공개 실험의 데이터 이동</text><rect x="30" y="124" width="230" height="133" rx="12" fill="white" stroke="#D6E3DB"/><text x="47" y="169" font-size="22" fill="#193D40">공개 이슈 읽기</text><text x="47" y="213" font-size="18" fill="#193D40">외부인이 쓴 지시</text><path d="M263 191L279 191" fill="none" stroke="#297D75" stroke-width="3" marker-end="url(#a)"/><rect x="285" y="124" width="230" height="133" rx="12" fill="white" stroke="#D6E3DB"/><text x="302" y="169" font-size="22" fill="#193D40">비공개 자료 조회</text><text x="302" y="213" font-size="18" fill="#193D40">사용자의 읽기 권한</text><path d="M518 191L534 191" fill="none" stroke="#297D75" stroke-width="3" marker-end="url(#a)"/><rect x="540" y="124" width="230" height="133" rx="12" fill="#FBE7DE" stroke="#D6E3DB"/><text x="557" y="169" font-size="22" fill="#193D40">공개 PR 작성</text><text x="557" y="213" font-size="18" fill="#193D40">외부에서 볼 수 있음</text><rect x="30" y="305" width="740" height="86" rx="12" fill="#EAF3EF" stroke="#D6E3DB"/><text x="50" y="339" font-size="23" fill="#193D40">검토할 조합: 외부 입력 + 내부 자료 + 공개 쓰기</text><text x="50" y="370" font-size="19" fill="#193D40">업무에 필요한 저장소·도구·실행 승인 범위로 제한</text><text x="30" y="426" font-size="15" fill="#193D40">출처: Invariant Labs · 2025년 공개 데모 실험</text></g></svg>
