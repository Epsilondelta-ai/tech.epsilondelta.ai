<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="title desc"><title id="title">신청한 뒤에는 승인과 처리 상태를 확인합니다</title><desc id="desc">직원이 날짜와 차감 내용을 확인한 뒤 휴가를 제출하고 접수번호를 받아 승인 대기, 승인 또는 반려 결과를 안내받는다. 응답을 못 받으면 접수 여부를 확인한다.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#297C75"/></marker></defs><rect width="800" height="450" rx="18" fill="#FAF8F2"/><g font-family="Apple SD Gothic Neo,Noto Sans KR,sans-serif"><text x="30" y="44" font-size="26" fill="#183D40" font-weight="700">신청한 뒤에는 승인과 처리 상태를 확인합니다</text><rect x="30" y="90" width="170" height="88" rx="12" fill="white" stroke="#D9E4DF"/><text x="45" y="126" font-size="21" fill="#183D40" font-weight="700">내용 확인</text><text x="45" y="155" font-size="17" fill="#183D40" font-weight="400">날짜·종류·차감</text><path d="M202 134 L215 134" stroke="#297C75" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="220" y="90" width="170" height="88" rx="12" fill="white" stroke="#D9E4DF"/><text x="235" y="126" font-size="21" fill="#183D40" font-weight="700">신청 제출</text><text x="235" y="155" font-size="17" fill="#183D40" font-weight="400">인사 시스템</text><path d="M392 134 L405 134" stroke="#297C75" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="410" y="90" width="170" height="88" rx="12" fill="white" stroke="#D9E4DF"/><text x="425" y="126" font-size="21" fill="#183D40" font-weight="700">접수 확인</text><text x="425" y="155" font-size="17" fill="#183D40" font-weight="400">접수번호 기록</text><path d="M582 134 L595 134" stroke="#297C75" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="600" y="90" width="170" height="88" rx="12" fill="#FBE9DF" stroke="#D9E4DF"/><text x="615" y="126" font-size="21" fill="#183D40" font-weight="700">승인 대기</text><text x="615" y="155" font-size="17" fill="#183D40" font-weight="400">진행 상태 보존</text><path d="M685 178V210H390V233" stroke="#297C75" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="264" y="244" width="252" height="63" rx="12" fill="#EDF4EE" stroke="#D9E4DF"/><text x="284" y="283" font-size="22" fill="#183D40" font-weight="700">승인·반려 결과 안내</text><rect x="30" y="340" width="740" height="72" rx="12" fill="#FFFFFF" stroke="#D9E4DF"/><text x="50" y="370" font-size="21" fill="#C2634C" font-weight="700">제출 후 응답을 받지 못했다면?</text><text x="50" y="397" font-size="18" fill="#183D40" font-weight="400">접수 여부를 먼저 확인한 뒤 재시도해 중복 신청을 피합니다.</text><text x="30" y="435" font-size="14" fill="#61746F" font-weight="400">휴가 신청의 일반적인 구성 예시 · 회사의 실제 승인 절차에 맞춰 적용</text></g></svg>
