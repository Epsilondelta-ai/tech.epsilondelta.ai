<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="title desc"><title id="title">직원 로그인과 도구의 실행 권한을 함께 확인합니다</title><desc id="desc">공용 관리자 계정 사용 위험과 요청자 권한을 확인하는 구조 비교. 다른 사번을 입력해도 서버에서 조회권한을 검사한다.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#297C75"/></marker></defs><rect width="800" height="450" rx="18" fill="#FAF8F2"/><g font-family="Apple SD Gothic Neo,Noto Sans KR,sans-serif"><text x="30" y="44" font-size="26" fill="#183D40" font-weight="700">직원 로그인과 도구의 실행 권한을 함께 확인합니다</text><rect x="30" y="87" width="355" height="260" rx="12" fill="#FFFFFF" stroke="#D9E4DF"/><text x="50" y="123" font-size="22" fill="#C2634C" font-weight="700">주의: 공용 관리자 계정</text><rect x="50" y="145" width="315" height="47" rx="12" fill="#FFFFFF" stroke="#D9E4DF"/><text x="70" y="175" font-size="20" fill="#183D40" font-weight="400">직원 → AI</text><path d="M207 198 L207 219" stroke="#297C75" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="50" y="230" width="315" height="47" rx="12" fill="#FBE9DF" stroke="#D9E4DF"/><text x="70" y="260" font-size="19" fill="#183D40" font-weight="400">관리자 권한으로 도구 실행</text><text x="50" y="310" font-size="17" fill="#C2634C" font-weight="400">다른 직원의 정보까지 노출될 위험</text><rect x="415" y="87" width="355" height="260" rx="12" fill="#FFFFFF" stroke="#D9E4DF"/><text x="435" y="123" font-size="22" fill="#297C75" font-weight="700">요청자의 권한으로 확인</text><rect x="435" y="145" width="315" height="47" rx="12" fill="#FFFFFF" stroke="#D9E4DF"/><text x="455" y="175" font-size="20" fill="#183D40" font-weight="400">직원 → AI</text><path d="M592 198 L592 219" stroke="#297C75" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="435" y="230" width="315" height="47" rx="12" fill="#EDF4EE" stroke="#D9E4DF"/><text x="455" y="260" font-size="19" fill="#183D40" font-weight="400">서버에서 대상·필드 권한 검사</text><text x="435" y="310" font-size="17" fill="#297C75" font-weight="400">허용한 정보와 작업만 반환·실행</text><rect x="30" y="373" width="740" height="53" rx="12" fill="#FFFFFF" stroke="#D9E4DF"/><text x="50" y="406" font-size="20" fill="#183D40" font-weight="400">다른 사람의 사번을 입력해도, 조회 권한이 생기지는 않습니다.</text></g></svg>
