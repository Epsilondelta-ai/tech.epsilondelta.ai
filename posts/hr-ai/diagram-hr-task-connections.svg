<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="title desc"><title id="title">같은 휴가 질문도, 필요한 연결은 다릅니다</title><desc id="desc">규정 질문은 문서, 잔액 질문은 본인 데이터, 신청은 승인 시스템, 반려 질문은 처리 이력과 상담 연결이 필요하다.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#297C75"/></marker></defs><rect width="800" height="450" rx="18" fill="#FAF8F2"/><g font-family="Apple SD Gothic Neo,Noto Sans KR,sans-serif"><text x="30" y="44" font-size="26" fill="#183D40" font-weight="700">같은 휴가 질문도, 필요한 연결은 다릅니다</text><text x="48" y="88" font-size="18" fill="#61746F" font-weight="400">직원의 요청</text><text x="368" y="88" font-size="18" fill="#61746F" font-weight="400">AI의 작업</text><text x="583" y="88" font-size="18" fill="#61746F" font-weight="400">필요한 연결</text><rect x="30" y="105" width="740" height="55" rx="12" fill="white" stroke="#D9E4DF"/><text x="47" y="140" font-size="19" fill="#183D40" font-weight="400">경조휴가 규정이 궁금해요</text><path d="M310 133 L344 133" stroke="#297C75" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="368" y="140" font-size="19" fill="#297C75" font-weight="700">규정 안내</text><text x="583" y="140" font-size="18" fill="#183D40" font-weight="400">최신 규정·적용 대상</text><rect x="30" y="170" width="740" height="55" rx="12" fill="#EEF4EF" stroke="#D9E4DF"/><text x="47" y="205" font-size="19" fill="#183D40" font-weight="400">제 연차는 얼마나 남았나요?</text><path d="M310 198 L344 198" stroke="#297C75" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="368" y="205" font-size="19" fill="#297C75" font-weight="700">본인 잔액 조회</text><text x="583" y="205" font-size="18" fill="#183D40" font-weight="400">인증·인사 시스템</text><rect x="30" y="235" width="740" height="55" rx="12" fill="white" stroke="#D9E4DF"/><text x="47" y="270" font-size="19" fill="#183D40" font-weight="400">금요일 연차 신청해주세요</text><path d="M310 263 L344 263" stroke="#297C75" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="368" y="270" font-size="19" fill="#297C75" font-weight="700">확인 후 신청</text><text x="583" y="270" font-size="18" fill="#183D40" font-weight="400">신청 기능·승인 절차</text><rect x="30" y="300" width="740" height="55" rx="12" fill="#EEF4EF" stroke="#D9E4DF"/><text x="47" y="335" font-size="19" fill="#183D40" font-weight="400">왜 반려됐는지 알고 싶어요</text><path d="M310 328 L344 328" stroke="#297C75" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="368" y="335" font-size="19" fill="#297C75" font-weight="700">이력 확인·상담</text><text x="583" y="335" font-size="18" fill="#183D40" font-weight="400">처리 기록·담당자</text><text x="30" y="415" font-size="19" fill="#183D40" font-weight="400">대화창에 답하는 기능과 사내 시스템에서 실행하는 기능을 함께 설계</text></g></svg>
