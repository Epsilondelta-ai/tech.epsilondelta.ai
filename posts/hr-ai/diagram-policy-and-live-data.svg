<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="title desc"><title id="title">적용 규정과 현재 잔액은 서로 다른 곳에서 확인합니다</title><desc id="desc">규정 질문은 법인, 고용 조건과 대상 기간을 확인해 문서를 검색하고 잔액 질문은 인증된 본인의 현재 인사 기록을 조회한다.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#297C75"/></marker></defs><rect width="800" height="450" rx="18" fill="#FAF8F2"/><g font-family="Apple SD Gothic Neo,Noto Sans KR,sans-serif"><text x="30" y="44" font-size="26" fill="#183D40" font-weight="700">적용 규정과 현재 잔액은 서로 다른 곳에서 확인합니다</text><rect x="30" y="86" width="740" height="55" rx="12" fill="#EDF4EE" stroke="#D9E4DF"/><text x="50" y="121" font-size="21" fill="#183D40" font-weight="700">요청한 직원 확인</text><text x="290" y="120" font-size="19" fill="#183D40" font-weight="400">로그인 정보 · 소속 · 질문 대상 기간</text><rect x="30" y="174" width="355" height="191" rx="12" fill="#FFFFFF" stroke="#D9E4DF"/><text x="50" y="211" font-size="23" fill="#297C75" font-weight="700">규정·지원 기준</text><text x="50" y="245" font-size="19" fill="#183D40" font-weight="400">법인·고용 조건·시행일로 선별</text><path d="M207 257 L207 278" stroke="#297C75" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="50" y="289" width="315" height="49" rx="12" fill="#FFFFFF" stroke="#D9E4DF"/><text x="70" y="320" font-size="19" fill="#183D40" font-weight="400">적용되는 문서에서 근거 검색</text><rect x="415" y="174" width="355" height="191" rx="12" fill="#FFFFFF" stroke="#D9E4DF"/><text x="435" y="211" font-size="23" fill="#297C75" font-weight="700">개인별 잔액·신청 상태</text><text x="435" y="245" font-size="19" fill="#183D40" font-weight="400">로그인한 사용자의 권한 확인</text><path d="M592 257 L592 278" stroke="#297C75" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="435" y="289" width="315" height="49" rx="12" fill="#FFFFFF" stroke="#D9E4DF"/><text x="455" y="320" font-size="19" fill="#183D40" font-weight="400">인사 시스템의 현재 기록 조회</text><text x="30" y="410" font-size="19" fill="#183D40" font-weight="400">한국어로 질문해도 해외 법인 규정이 적용될 수 있습니다.</text><text x="30" y="436" font-size="14" fill="#61746F" font-weight="400">일반적인 구성 예시</text></g></svg>
