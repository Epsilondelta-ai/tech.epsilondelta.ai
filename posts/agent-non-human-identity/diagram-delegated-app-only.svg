<svg xmlns="http://www.w3.org/2000/svg" width="800" height="860" viewBox="0 0 800 860" role="img" aria-labelledby="title desc"><title id="title">사용자 위임과 앱 자체 권한의 경계</title><desc id="desc">사용자 위임의 실효 권한은 사용자 권한과 앱 동의 범위의 교집합이다. 앱 자체 작업은 실제 부여되고 API가 집행하는 앱 권한 내에서 동작한다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#226c67"/></marker></defs><rect width="800" height="860" rx="22" fill="#f7f5ed"/><g font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif"><text x="36" y="58" font-size="36" font-weight="700" fill="#203747" text-anchor="start">심부름과 야간 당직의 권한</text><rect x="28" y="92" width="744" height="341" rx="18" fill="#fff" stroke="#c8d5d2" stroke-width="2"/><text x="52" y="139" font-size="32" font-weight="700" fill="#226c67" text-anchor="start">직원 요청 · 사용자 위임</text><rect x="52" y="164" width="304" height="87" rx="18" fill="#edf1f5" stroke="#c8d5d2" stroke-width="2"/><text x="204" y="201" font-size="28" font-weight="700" fill="#203747" text-anchor="middle">직원의 실제 권한</text><text x="204" y="235" font-size="23" font-weight="400" fill="#203747" text-anchor="middle">김 대리가 볼 수 있는 범위</text><text x="400" y="222" font-size="49" font-weight="700" fill="#226c67" text-anchor="middle">∩</text><rect x="444" y="164" width="304" height="87" rx="18" fill="#e5efea" stroke="#c8d5d2" stroke-width="2"/><text x="596" y="201" font-size="28" font-weight="700" fill="#203747" text-anchor="middle">앱에 동의된 범위</text><text x="596" y="235" font-size="24" font-weight="400" fill="#203747" text-anchor="middle">허용한 작업 scope</text><path d="M400 257 L400 288" stroke="#226c67" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="151" y="299" width="498" height="67" rx="18" fill="#e5efea" stroke="#226c67" stroke-width="2"/><text x="400" y="344" font-size="29" font-weight="700" fill="#226c67" text-anchor="middle">실효 권한 = 두 범위의 교집합</text><text x="52" y="408" font-size="28" font-weight="400" fill="#203747" text-anchor="start">직원이 못 여는 비공개 계약서는 접근 불가</text><rect x="28" y="461" width="744" height="308" rx="18" fill="#fff" stroke="#c8d5d2" stroke-width="2"/><text x="52" y="510" font-size="32" font-weight="700" fill="#a05b27" text-anchor="start">예약 작업 · 앱 자체 권한</text><rect x="52" y="540" width="196" height="106" rx="18" fill="#f8eddb" stroke="#c8d5d2" stroke-width="2"/><text x="150" y="582" font-size="29" font-weight="700" fill="#203747" text-anchor="middle">예약 실행</text><text x="150" y="622" font-size="25" font-weight="400" fill="#203747" text-anchor="middle">로그인 없이</text><path d="M248 591 L312 591" stroke="#226c67" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="326" y="540" width="422" height="106" rx="18" fill="#e5efea" stroke="#226c67" stroke-width="2"/><text x="537" y="583" font-size="30" font-weight="700" fill="#226c67" text-anchor="middle">부여된 앱 권한</text><text x="537" y="623" font-size="27" font-weight="400" fill="#203747" text-anchor="middle">API가 집행하는 범위</text><text x="52" y="697" font-size="28" font-weight="400" fill="#203747" text-anchor="start">공용 시세표 수집 → 대시보드 갱신</text><text x="52" y="742" font-size="27" font-weight="400" fill="#203747" text-anchor="start">도입 승인자의 개인 권한을 상속하지 않음</text><text x="36" y="820" font-size="31" font-weight="700" fill="#203747" text-anchor="start">두 경로의 토큰 취득을 분리</text></g></svg>