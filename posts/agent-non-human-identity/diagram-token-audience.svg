<svg xmlns="http://www.w3.org/2000/svg" width="800" height="890" viewBox="0 0 800 890" role="img" aria-labelledby="title desc"><title id="title">리소스별 토큰 대상과 유효기간</title><desc id="desc">계약 시스템용 토큰을 ERP에 그대로 넘기지 않고 ERP를 대상으로 새 토큰을 취득한다. 짧은 토큰 수명은 일회성 거래 승인을 의미하지 않는다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#226c67"/></marker></defs><rect width="800" height="890" rx="22" fill="#f7f5ed"/><g font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif"><text x="36" y="58" font-size="34" font-weight="700" fill="#203747" text-anchor="start">출입증의 대상과 수명을 따로 보기</text><rect x="36" y="92" width="728" height="123" rx="18" fill="#fff" stroke="#c8d5d2" stroke-width="2"/><text x="60" y="135" font-size="31" font-weight="700" fill="#226c67" text-anchor="start">계약 시스템용 토큰</text><text x="60" y="179" font-size="29" font-weight="400" fill="#203747" text-anchor="start">작업 범위 · 수신 대상 · 만료 시각</text><path d="M185 215 L185 256" stroke="#226c67" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="36" y="270" width="299" height="95" rx="18" fill="#e5efea" stroke="#226c67" stroke-width="2"/><text x="185" y="309" font-size="30" font-weight="700" fill="#203747" text-anchor="middle">계약 시스템</text><text x="185" y="345" font-size="26" font-weight="400" fill="#203747" text-anchor="middle">대상 일치 확인</text><path d="M455 215 L616 255" stroke="#a05b27" stroke-width="3" fill="none" stroke-dasharray="9 7"/><rect x="463" y="270" width="301" height="95" rx="18" fill="#f8eddb" stroke="#c8d5d2" stroke-width="2"/><text x="614" y="309" font-size="30" font-weight="700" fill="#203747" text-anchor="middle">재무 ERP</text><text x="614" y="345" font-size="23" font-weight="700" fill="#a05b27" text-anchor="middle">기존 토큰 그대로는 불가</text><text x="606" y="249" font-size="41" font-weight="700" fill="#a05b27" text-anchor="start">×</text><path d="M185 365 L185 411" stroke="#226c67" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="36" y="425" width="728" height="95" rx="18" fill="#fff" stroke="#c8d5d2" stroke-width="2"/><text x="60" y="465" font-size="30" font-weight="700" fill="#203747" text-anchor="start">ERP를 수신 대상으로 새 토큰 취득</text><text x="60" y="501" font-size="27" font-weight="400" fill="#203747" text-anchor="start">OBO 또는 지원되는 토큰 교환 경로</text><path d="M614 520 L614 564" stroke="#226c67" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="463" y="579" width="301" height="85" rx="18" fill="#e5efea" stroke="#226c67" stroke-width="2"/><text x="614" y="615" font-size="29" font-weight="700" fill="#203747" text-anchor="middle">재무 ERP</text><text x="614" y="649" font-size="26" font-weight="400" fill="#203747" text-anchor="middle">대상·권한 검증</text><text x="36" y="612" font-size="27" font-weight="400" fill="#203747" text-anchor="start">허용된 권한 안에서</text><text x="36" y="650" font-size="27" font-weight="400" fill="#203747" text-anchor="start">대상별로 발급·검증</text><rect x="36" y="702" width="728" height="152" rx="18" fill="#edf1f5" stroke="#c8d5d2" stroke-width="2"/><text x="60" y="747" font-size="30" font-weight="700" fill="#203747" text-anchor="start">짧은 유효기간 ≠ 한 번만 쓰는 토큰</text><text x="60" y="792" font-size="27" font-weight="400" fill="#203747" text-anchor="start">유효한 동안 허용 범위의 여러 요청 가능</text><text x="60" y="831" font-size="26" font-weight="400" fill="#203747" text-anchor="start">갱신·클라이언트 자격이 남으면 재발급 가능</text></g></svg>