<svg xmlns="http://www.w3.org/2000/svg" width="800" height="460" viewBox="0 0 800 460" role="img" aria-labelledby="t d"><title id="t">업무 성과에서 해당 실행까지 찾아갑니다</title><desc id="d">경영지표인완료율시간비용재작업을업무ID와버전으로실행기록에연결하는지도.실적수치는없다.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#466766"/></marker></defs><rect width="800" height="460" rx="20" fill="#faf7f0"/><g font-family="Apple SD Gothic Neo,Noto Sans KR,sans-serif" fill="#183b3b"><text x="32" y="47" font-size="25" font-weight="700">업무 성과에서 해당 실행까지 찾아갑니다</text><rect x="32" y="110" width="354" height="105" rx="12" fill="#e2eeeb"/><text x="56" y="146" font-size="23">실제 완료율</text><text x="56" y="185" font-size="17">업무 시스템 결과 확인</text><rect x="414" y="110" width="354" height="105" rx="12" fill="#e2eeeb"/><text x="438" y="146" font-size="23">전체 처리 시간</text><text x="438" y="185" font-size="17">대기 · 승인 · 재시도 포함</text><rect x="32" y="236" width="354" height="105" rx="12" fill="#e2eeeb"/><text x="56" y="272" font-size="23">성공 업무당 비용</text><text x="56" y="311" font-size="17">모델 · 도구 · 검토 · 수정</text><rect x="414" y="236" width="354" height="105" rx="12" fill="#e2eeeb"/><text x="438" y="272" font-size="23">인계·재작업</text><text x="438" y="311" font-size="17">승인 요청과 부실 수정 구분</text><rect x="32" y="377" width="736" height="52" rx="12" fill="#d7e7f2"/><text x="55" y="411" font-size="22">이상 발견 → 업무 ID·배포 버전 → 해당 실행 조사</text></g></svg>
