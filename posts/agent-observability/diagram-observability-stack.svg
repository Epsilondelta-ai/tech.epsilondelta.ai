<svg xmlns="http://www.w3.org/2000/svg" width="800" height="460" viewBox="0 0 800 460" role="img" aria-labelledby="t d"><title id="t">기록을 만드는 기반과 살펴보는 도구</title><desc id="d">검색 모델 업무 API에서 만든 기록을 OTel로 연결하고 직접 또는 Collector를 통해 Langfuse LangSmith 기존 운영 도구로 전달하는 설계 예시.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#466766"/></marker></defs><rect width="800" height="460" rx="20" fill="#faf7f0"/><g font-family="Apple SD Gothic Neo,Noto Sans KR,sans-serif" fill="#183b3b"><text x="32" y="47" font-size="25" font-weight="700">기록을 만드는 기반과 살펴보는 도구</text><text x="32" y="80" font-size="15">구성 예시 · Collector는 선택 사항</text><rect x="32" y="108" width="220" height="270" rx="12" fill="#e2eeeb"/><text x="54" y="145" font-size="22">업무의 실행 단계</text><text x="54" y="199" font-size="18">문서 검색</text><text x="54" y="245" font-size="18">모델 호출</text><text x="54" y="291" font-size="18">도구·업무 API</text><text x="54" y="344" font-size="18">승인·결과 확인</text><path d="M267 240L292 240" stroke="#466766" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="306" y="162" width="192" height="155" rx="12" fill="#d7e7f2"/><text x="328" y="201" font-size="20">OpenTelemetry</text><text x="328" y="238" font-size="18">계측 · 맥락 전달</text><text x="328" y="276" font-size="18">기록 전송</text><path d="M508 240L532 240" stroke="#466766" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="548" y="108" width="220" height="270" rx="12" fill="#e2eeeb"/><text x="568" y="145" font-size="22">저장·조회·평가</text><text x="568" y="200" font-size="18">Langfuse</text><text x="568" y="245" font-size="18">LangSmith</text><text x="568" y="292" font-size="18">기존 운영 도구</text><text x="568" y="345" font-size="15">필요한 기록을 연결</text></g></svg>
