<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Agent Skills는 목록, 지침, 필요한 자료 순서로 읽습니다</title>
  <desc id="desc">에이전트가 스킬 목록의 이름과 설명을 살펴보고 견적 초안 스킬을 선택합니다. 선택한 SKILL.md의 업무 지침을 읽은 뒤 필요한 참고자료, 실행 스크립트, 양식만 사용합니다. 모든 자료를 처음부터 읽는 구조가 아닙니다. 설치, 올바른 스킬 선택, 업무 성공은 각각 확인해야 합니다.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#275BCA"/></marker>
    <marker id="teal-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#127C78"/></marker>
  </defs>
  <rect width="1200" height="680" rx="24" fill="#F7F4EC"/>
  <g font-family="'Apple SD Gothic Neo', Pretendard, 'Noto Sans KR', sans-serif" fill="#20303B">
    <text x="48" y="72" font-size="40" font-weight="800">필요한 업무 방법을, 필요한 순간에</text>
    <text x="48" y="114" font-size="24" fill="#617076">먼저 목록을 살펴보고, 선택한 지침과 관련 자료를 읽습니다.</text>

    <text x="48" y="190" font-size="26" font-weight="800">1. 이름·설명 살피기</text>
    <rect x="48" y="220" width="298" height="316" rx="16" fill="#FFFFFF" stroke="#D8DEDA" stroke-width="2"/>
    <text x="72" y="263" font-size="27" fill="#617076">회의 정리</text>
    <text x="72" y="297" font-size="22" fill="#617076">결정과 할 일을 정리</text>
    <rect x="60" y="320" width="274" height="101" rx="10" fill="#E2EAE7"/>
    <text x="78" y="361" font-size="29" font-weight="800" fill="#127C78">견적 초안</text>
    <text x="78" y="395" font-size="22" fill="#127C78">회사 조건에 맞춰 작성</text>
    <text x="72" y="467" font-size="27" fill="#617076">보고서 작성</text>
    <text x="72" y="501" font-size="22" fill="#617076">팀의 형식과 근거를 적용</text>

    <path d="M347 371H425" fill="none" stroke="#275BCA" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="431" y="190" font-size="26" font-weight="800">2. 선택한 지침 읽기</text>
    <rect x="431" y="250" width="292" height="244" rx="16" fill="#275BCA"/>
    <text x="458" y="300" font-size="34" font-weight="800" fill="#FFFFFF">SKILL.md</text>
    <path d="M458 323H694" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="2"/>
    <g font-size="26" fill="#FFFFFF">
      <text x="458" y="365">확인할 순서</text>
      <text x="458" y="411">예외와 질문 기준</text>
      <text x="458" y="457">산출물·검수 방법</text>
    </g>

    <text x="802" y="190" font-size="26" font-weight="800">3. 필요한 자료만 사용</text>
    <g fill="none" stroke="#127C78" stroke-width="3" stroke-dasharray="6 6">
      <path d="M724 372H763"/>
      <path d="M763 273V491"/>
      <path d="M763 273H800" marker-end="url(#teal-arrow)"/>
      <path d="M763 382H800" marker-end="url(#teal-arrow)"/>
      <path d="M763 491H800" marker-end="url(#teal-arrow)"/>
    </g>
    <g fill="#FFFFFF" stroke="#D8DEDA" stroke-width="2">
      <rect x="808" y="235" width="344" height="76" rx="12"/>
      <rect x="808" y="344" width="344" height="76" rx="12"/>
      <rect x="808" y="453" width="344" height="76" rx="12"/>
    </g>
    <g font-size="27" font-weight="700">
      <text x="833" y="284">참고자료</text>
      <text x="833" y="393">실행 스크립트</text>
      <text x="833" y="502">회사 양식</text>
    </g>
    <path d="M48 581H1152" stroke="#D8DEDA" stroke-width="2"/>
    <text x="600" y="622" text-anchor="middle" font-size="28" font-weight="800" fill="#127C78">설치 ≠ 선택 ≠ 업무 성공</text>
    <text x="600" y="656" text-anchor="middle" font-size="22" fill="#617076">목록이 있어도 올바른 호출과 결과는 따로 확인합니다.</text>
  </g>
</svg>
