<svg xmlns="http://www.w3.org/2000/svg" width="800" height="510" viewBox="0 0 800 510" role="img" aria-labelledby="title"><title id="title">이용 권리와 운영 주체는 별도로 확인</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#a35b3d"/></marker></defs><rect width="800" height="510" rx="18" fill="#f7f2e8"/><g font-family="Noto Sans CJK KR, sans-serif"><text x="30" y="48" font-size="32" fill="#203d40">이용 권리와 운영 주체는 별도 확인</text><rect x="30" y="75" width="740" height="65" rx="14" fill="#e0ebe7"/><text x="50" y="117.5" font-size="28" fill="#203d40">이용 권리 → 정확한 모델·버전의 약관 확인</text><text x="35" y="180" font-size="28" fill="#203d40">운영 방식</text><text x="350" y="180" font-size="28" fill="#203d40">제공받는 것 / 운영 분담</text><rect x="30" y="205" width="270" height="52" rx="14" fill="#e0ebe7"/><text x="50" y="241.0" font-size="28" fill="#203d40">외부 모델 API</text><rect x="320" y="205" width="450" height="52" rx="14" fill="#eee1ca"/><text x="340" y="241.0" font-size="25" fill="#203d40">공급자가 모델 서비스 운영</text><rect x="30" y="267" width="270" height="52" rx="14" fill="#e0ebe7"/><text x="50" y="303.0" font-size="28" fill="#203d40">관리형 전용 배포</text><rect x="320" y="267" width="450" height="52" rx="14" fill="#eee1ca"/><text x="340" y="303.0" font-size="25" fill="#203d40">전용 공간·계약에 따른 분담</text><rect x="30" y="329" width="270" height="52" rx="14" fill="#e0ebe7"/><text x="50" y="365.0" font-size="28" fill="#203d40">클라우드 자체 운영</text><rect x="320" y="329" width="450" height="52" rx="14" fill="#eee1ca"/><text x="340" y="365.0" font-size="25" fill="#203d40">임대한 자원 위 직접 운영</text><rect x="30" y="391" width="270" height="52" rx="14" fill="#e0ebe7"/><text x="50" y="427.0" font-size="28" fill="#203d40">사내 장비 자체 운영</text><rect x="320" y="391" width="450" height="52" rx="14" fill="#eee1ca"/><text x="340" y="427.0" font-size="25" fill="#203d40">추론 운영 + 물리 장비 관리</text><text x="35" y="484" font-size="25" fill="#203d40">모든 방식: 업무 품질·데이터 권한은 도입 기업 책임</text></g></svg>