<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-labelledby="title"><title id="title">업그레이드 모니터링 당직 복구 담당과 현업 품질 책임</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#a35b3d"/></marker></defs><rect width="800" height="500" rx="18" fill="#f7f2e8"/><g font-family="Noto Sans CJK KR, sans-serif"><text x="30" y="48" font-size="32" fill="#203d40">설치 이후에도 담당자가 필요합니다</text><rect x="30" y="90" width="345" height="100" rx="14" fill="#e0ebe7"/><text x="50" y="150.0" font-size="28" fill="#203d40">업그레이드 검증·승인</text><rect x="425" y="90" width="345" height="100" rx="14" fill="#e0ebe7"/><text x="445" y="150.0" font-size="28" fill="#203d40">메모리·대기열 관측</text><rect x="30" y="240" width="345" height="100" rx="14" fill="#eee1ca"/><text x="50" y="300.0" font-size="28" fill="#203d40">야간·주말 당직 대응</text><rect x="425" y="240" width="345" height="100" rx="14" fill="#eee1ca"/><text x="445" y="300.0" font-size="28" fill="#203d40">문제 시 이전 버전 복구</text><text x="35" y="398" font-size="27" fill="#203d40">버전 전환은 단계적으로 · 문제 발생 시 롤백</text><rect x="30" y="425" width="740" height="60" rx="14" fill="#c5d8d4"/><text x="50" y="465.0" font-size="28" fill="#203d40">현업 품질 책임은 모든 배포 방식에 공통</text></g></svg>