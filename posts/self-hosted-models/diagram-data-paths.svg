<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-labelledby="title"><title id="title">모델 외의 검색 로그 백업 외부 도구까지 접근 권한을 점검</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#a35b3d"/></marker></defs><rect width="800" height="500" rx="18" fill="#f7f2e8"/><g font-family="Noto Sans CJK KR, sans-serif"><text x="30" y="48" font-size="32" fill="#203d40">데이터 경로는 모델보다 넓습니다</text><rect x="30" y="90" width="170" height="70" rx="14" fill="#e0ebe7"/><text x="50" y="135.0" font-size="28" fill="#203d40">직원·앱</text><rect x="280" y="90" width="220" height="70" rx="14" fill="#e0ebe7"/><text x="300" y="135.0" font-size="28" fill="#203d40">공통 관문</text><rect x="580" y="90" width="190" height="70" rx="14" fill="#e0ebe7"/><text x="600" y="135.0" font-size="28" fill="#203d40">모델</text><path d="M203 125 L275 125" fill="none" stroke="#a35b3d" stroke-width="3" marker-end="url(#a)"/><path d="M503 125 L575 125" fill="none" stroke="#a35b3d" stroke-width="3" marker-end="url(#a)"/><rect x="250" y="240" width="280" height="70" rx="14" fill="#e0ebe7"/><text x="270" y="285.0" font-size="28" fill="#203d40">검색 저장소</text><path d="M390 165 L390 232" fill="none" stroke="#a35b3d" stroke-width="3" marker-end="url(#a)"/><rect x="550" y="240" width="220" height="70" rx="14" fill="#e0ebe7"/><text x="570" y="285.0" font-size="28" fill="#203d40">외부 업무 도구</text><path d="M675 165 L675 232" fill="none" stroke="#a35b3d" stroke-width="3" marker-end="url(#a)"/><rect x="30" y="360" width="330" height="65" rx="14" fill="#e0ebe7"/><text x="50" y="402.5" font-size="28" fill="#203d40">질문·응답 로그</text><rect x="410" y="360" width="360" height="65" rx="14" fill="#e0ebe7"/><text x="430" y="402.5" font-size="28" fill="#203d40">추적 기록·백업</text><path d="M300 165 L185 350" fill="none" stroke="#a35b3d" stroke-width="3" marker-end="url(#a)"/><path d="M500 165 L580 350" fill="none" stroke="#a35b3d" stroke-width="3" marker-end="url(#a)"/><text x="35" y="475" font-size="26" fill="#203d40">각 경로의 읽기 권한·보관 기간·운영자 접근 확인</text></g></svg>