<svg xmlns="http://www.w3.org/2000/svg" width="800" height="540" viewBox="0 0 800 540" role="img" aria-labelledby="title"><title id="title">가중치 외에 KV 캐시가 필요하며 요청이 대기할 수 있음</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#a35b3d"/></marker></defs><rect width="800" height="540" rx="18" fill="#f7f2e8"/><g font-family="Noto Sans CJK KR, sans-serif"><text x="30" y="48" font-size="32" fill="#203d40">같은 모델, 달라지는 작업 공간</text><rect x="30" y="80" width="345" height="65" rx="14" fill="#e0ebe7"/><text x="50" y="122.5" font-size="28" fill="#203d40">짧은 질문 · 한 요청</text><rect x="425" y="80" width="345" height="65" rx="14" fill="#e0ebe7"/><text x="445" y="122.5" font-size="28" fill="#203d40">긴 문서 · 동시 요청</text><rect x="30" y="180" width="345" height="65" rx="14" fill="#c5d8d4"/><text x="50" y="222.5" font-size="28" fill="#203d40">모델 가중치</text><rect x="425" y="180" width="345" height="65" rx="14" fill="#c5d8d4"/><text x="445" y="222.5" font-size="28" fill="#203d40">모델 가중치</text><rect x="30" y="260" width="345" height="100" rx="14" fill="#e0ebe7"/><text x="50" y="320.0" font-size="28" fill="#203d40">KV 캐시 · 여유 공간</text><rect x="425" y="260" width="345" height="100" rx="14" fill="#e5c49c"/><text x="445" y="320.0" font-size="28" fill="#203d40">KV 캐시 사용 증가</text><text x="620" y="394" font-size="24" fill="#203d40">용량 부족 시</text><path d="M598 365 L598 405" fill="none" stroke="#a35b3d" stroke-width="3" marker-end="url(#a)"/><rect x="425" y="412" width="345" height="60" rx="14" fill="#edd4c3"/><text x="445" y="452.0" font-size="28" fill="#203d40">요청 대기 · 재계산</text><text x="35" y="438" font-size="24" fill="#203d40">개념도 · 실제 비율 아님</text><text x="35" y="525" font-size="27" fill="#203d40">입출력 길이와 동시 요청 수를 함께 측정</text></g></svg>