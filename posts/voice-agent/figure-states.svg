<svg xmlns="http://www.w3.org/2000/svg" width="800" height="460" viewBox="0 0 800 460" role="img" aria-label="답변 생성 · 음성 재생 · 업무 실행을 구분"><rect width="800" height="460" rx="24" fill="#faf7ef"/><style>text{font-family:'Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#193b43}.h{font-size:27px;font-weight:700}.t{font-size:21px}.s{font-size:17px}.n{font-size:30px;font-weight:700}</style><text class="h" x="32" y="49">답변 생성 · 음성 재생 · 업무 실행을 구분</text><rect x="32" y="86" width="225" height="222" rx="15" fill="#e1eee8"/><rect x="287" y="86" width="225" height="222" rx="15" fill="white"/><rect x="542" y="86" width="226" height="222" rx="15" fill="#f4e1d7"/><text class="h" x="52" y="127">생성한 문장</text><text class="t" x="52" y="182">어떤 안내를</text><text class="t" x="52" y="213">만들었나?</text><text class="s" x="52" y="274">답변 기록</text><text class="h" x="307" y="127">재생한 음성</text><text class="t" x="307" y="182">어디까지 재생했고</text><text class="t" x="307" y="213">어디서 끊겼나?</text><text class="s" x="307" y="274">재생·중단 이벤트</text><text class="h" x="562" y="127">실행한 업무</text><text class="t" x="562" y="182">예약 시스템에서</text><text class="t" x="562" y="213">실제로 바뀌었나?</text><text class="s" x="562" y="274">도구 결과·처리 번호</text><rect x="32" y="342" width="736" height="82" rx="15" fill="#e1eee8"/><text class="t" x="54" y="374">실행 성공 확인 → 완료 안내</text><text class="s" x="54" y="403">안내 중 통화가 끊기면 재연결 시 기존 처리 결과부터 확인</text></svg>
